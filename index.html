{id:"e12",d:5,q:"What is the default operation for NETCONF <edit-config>?",o:["merge","replace","delete","create"],a:[0],e:"Default is merge. You can set replace, create, delete, or remove on the operation or on individual elements."},
{id:"e13",d:5,q:"Which list shows the NETCONF protocol layers from top to bottom?",o:["Content, operations, messages, secure transport","Application, presentation, session, transport","Data, model, API, device","YANG, JSON, HTTP, TCP"],a:[0],e:"Content is the YANG-modeled data, operations are get-config/edit-config etc., messages are RPC envelopes, transport is usually SSH."},
{id:"e14",d:5,q:"Which YANG node type holds multiple entries, each identified by a key?",o:["list","container","leaf","typedef"],a:[0],e:"A list is like a table with key leaves, such as interfaces keyed by name. A container groups nodes once. A leaf holds one value."},
{id:"e15",d:5,q:"Which YANG node type holds a single value, like an interface description?",o:["leaf","list","container","grouping"],a:[0],e:"A leaf has one value of a defined type. A leaf-list holds a sequence of values of the same type."},
{id:"e16",d:5,q:"What is the standard RESTCONF path for configuration and state data?",o:["/restconf/data","/api/v1/config","/netconf/data","/yang/models"],a:[0],e:"RESTCONF resources live under /restconf/data, followed by the module and node path, such as /restconf/data/ietf-interfaces:interfaces."},
{id:"e17",d:5,q:"A RESTCONF request returns HTTP 401. What does that mean?",o:["Unauthorized: missing or bad credentials","Created: the resource was added","Not found: the URI doesn't exist on the server","Server error: the device failed"],a:[0],e:"401 is an authentication failure. 201 is created, 204 is success with no content, 404 is not found, 500 is a server error."},
{id:"e18",d:5,q:"How do external tools like ServiceNow talk to Catalyst Center?",o:["Through its northbound REST (Intent) API","Through SNMP traps sent from Catalyst Center","Through southbound NETCONF to Catalyst Center","Through a console connection to the appliance"],a:[0],e:"Northbound APIs face applications above the controller. Southbound protocols (NETCONF, SSH, SNMP) face the network devices."},
{id:"e19",d:5,q:"In controller-based networking, what is a southbound interface?",o:["How the controller talks to network devices","How applications talk to the controller","How two controllers keep their state in sync","How users log in to the controller GUI"],a:[0],e:"Southbound examples: NETCONF, RESTCONF, SSH/CLI, SNMP, OpenFlow. Northbound is usually REST APIs for apps."},
{id:"e20",d:5,q:"Which config management tool is agentless, uses SSH, and writes playbooks in YAML?",o:["Ansible","Puppet","Chef","SaltStack with minions"],a:[0],e:"Ansible pushes over SSH (or NETCONF/API) with no agent on the device. Puppet and Chef traditionally use agents."},
{id:"e21",d:5,q:"Which Python library is commonly used to work with NETCONF?",o:["ncclient","requests","netmiko only","pysnmp"],a:[0],e:"ncclient handles NETCONF sessions and RPCs. requests is for HTTP/RESTCONF. Netmiko is for SSH CLI."},
{id:"e22",d:5,q:"What is a key benefit of managing network config as code in Git?",o:["Version history, peer review, and repeatable deployments","It removes the need to test changes before they're deployed to devices","Devices no longer need credentials to accept changes","It makes YANG models optional for automation"],a:[0],e:"Infrastructure as code gives change tracking, rollback, review, and consistent deployment through pipelines."},
{id:"e23",d:5,q:"Which are valid gNMI Subscribe modes?",o:["STREAM, POLL, ONCE","GET, SET, DELETE","PUSH, PULL, SYNC","PERIODIC, TRAP, INFORM"],a:[0],e:"STREAM keeps sending updates (sampled or on-change), POLL sends on request, ONCE sends one snapshot and ends."},
{id:"e24",d:5,q:"Which common open source stack collects, stores, and graphs streaming telemetry?",o:["Telegraf, InfluxDB, and Grafana (TIG)","Apache, MySQL, and PHP (LAMP stack)","Nginx, Redis, and React","Syslog-ng, cron, and Excel"],a:[0],e:"Telegraf receives telemetry, InfluxDB stores time series data, and Grafana visualizes it."},
{id:"e25",d:5,q:"Intent-based networking is best described as which approach?",o:["Declarative: define the outcome and let the system work out how","Imperative: script every CLI command in the exact order needed","Manual: configure each device by hand through its own CLI","Reactive: change configuration only after an outage occurs"],a:[0],e:"Declarative intent states what you want (such as this group can't reach that group). The controller translates it into device config."},

// ---------- Domain 1 (expanded) ----------
{id:"a55",d:1,q:"A company has 12 branch sites, each needing up to 400 hosts across 6 VLANs. Which per-branch block allocation is cleanest for summarization?",o:["A /21 per branch (8 x /24s), leaving room for growth","A /23 per branch (2 x /24s), sized exactly to 400 hosts","A random /24 per VLAN, taken from a shared pool","A /16 per branch, so every site uses the same layout"],a:[0],e:"Six VLANs of up to /24 fit in a /21 (eight /24s) with spare room, and each branch advertises a single summary to the WAN."},
{id:"a56",d:1,q:"Why should an IPv4 addressing plan follow the network hierarchy (region, site, building)?",o:["It allows summarization at each boundary, keeping tables small and stable","It makes every subnet the same size, so any VLAN can move to any site","It removes the need for DHCP, because hosts can derive their own address","It allows VLANs to span all sites, so users keep their address when moving"],a:[0],e:"Hierarchical, contiguous blocks map to summarization points, hiding changes and limiting query or LSA scope."},
{id:"a57",d:1,q:"How many /24 networks are contained in a /20?",o:["16","8","32","4"],a:[0],e:"24 - 20 = 4 bits, and 2^4 = 16."},
{id:"a58",d:1,q:"Which summary covers 192.168.4.0/24 through 192.168.7.0/24 exactly?",o:["192.168.4.0/22","192.168.4.0/21","192.168.0.0/21","192.168.4.0/23"],a:[0],e:"Four /24s = /22. 4 is a multiple of 4, so 192.168.4.0/22 covers .4 to .7."},
{id:"a59",d:1,q:"An enterprise gets a /32 IPv6 allocation from an RIR. How many /48 site prefixes does it provide?",o:["65,536","256","4,096","16"],a:[0],e:"48 - 32 = 16 bits, so 2^16 = 65,536 /48s."},
{id:"a60",d:1,q:"Which IPv6 site allocation size is commonly recommended so every site gets 65,536 /64s and nibble-aligned boundaries?",o:["/48","/56","/60","/64"],a:[0],e:"/48 per site is standard for enterprises. Smaller sites sometimes get /56. Nibble boundaries (multiples of 4) make DNS reverse zones and reading addresses easier."},
{id:"a61",d:1,q:"Why is it good practice to use nibble (4-bit) boundaries in an IPv6 addressing plan?",o:["Each hex digit maps to one level, so addresses read, summarize and delegate cleanly","It's required by SLAAC, which builds addresses only on prefixes aligned to a nibble boundary","It saves address space compared to allocating on arbitrary bit boundaries","It's required by OSPFv3, which only summarizes on nibble-aligned prefixes"],a:[0],e:"A hex digit is 4 bits. Aligning region/site/function fields to whole digits keeps the plan readable and operationally simple."},
{id:"a62",d:1,q:"Which IPv6 address type should be used for internal-only networks that never route to the internet, similar to RFC 1918?",o:["Unique local (FC00::/7, in practice FD00::/8)","Link-local (FE80::/10)","Global unicast (2000::/3, from the RIR)","Multicast (FF00::/8)"],a:[0],e:"ULA is for local use. Many designs still prefer GUA everywhere to avoid address selection issues with dual ULA/GUA."},
{id:"a63",d:1,q:"What is a design concern with relying on SLAAC alone in an enterprise?",o:["No central record of which host has which address, which complicates auditing","SLAAC can't build addresses on /64 subnets, so larger prefixes are needed on every LAN","SLAAC requires a DHCPv6 relay on every router interface to function","SLAAC works only with unique local addresses, not global unicast"],a:[0],e:"SLAAC addresses (especially privacy addresses) change and aren't logged centrally. Stateful DHCPv6 or logging NDP tables helps with tracking."},
{id:"a64",d:1,q:"Which IPv6 transition technology lets IPv4-only hosts reach the IPv4 internet over an IPv6-only access network?",o:["464XLAT or DS-Lite","6to4 relay routers","ISATAP tunnels","Dual stack on hosts"],a:[0],e:"464XLAT (CLAT plus NAT64) and DS-Lite (IPv4 in IPv6 to an AFTR) carry IPv4 over IPv6-only networks, common in mobile and ISP designs."},
{id:"a65",d:1,q:"Which statement about NAT64 design is correct?",o:["It needs DNS64 for name-based access and breaks apps that embed IPv4 literals","It works without any DNS changes, because hosts learn the mappings from router advertisements","It's a tunneling technique that carries IPv6 packets inside IPv4","It provides end-to-end IPv6 so no IPv4 is needed anywhere on the path"],a:[0],e:"DNS64 synthesizes AAAA records. Apps that use hardcoded IPv4 addresses fail without help like 464XLAT."},
{id:"a66",d:1,q:"Which OSPF design keeps the LSDB small in a large hub-and-spoke network with many remote sites?",o:["Totally stubby areas or NSSAs for remote sites, with summarization at ABRs","All sites in area 0, so every router has the full topology for best paths","A single flat area with no summarization, so changes are seen everywhere","Redistribute all OSPF routes into BGP and drop OSPF at the remote sites"],a:[0],e:"Stub-type areas plus summarization limit LSAs remote routers carry and isolate topology changes."},
{id:"a67",d:1,q:"Cisco's general guidance on OSPF area size is that design matters more than hard limits. What most affects scalability?",o:["The number of LSAs, adjacencies, and the rate of topology change","The OSPF process ID numbers configured on each router in the area","The format chosen for router IDs across the routing domain","Whether loopback interfaces are used for the router IDs"],a:[0],e:"Large LSDBs, many neighbors on hub routers, and frequent flaps drive SPF and flooding load, so use areas and summarization."},
{id:"a68",d:1,q:"What is the main role of OSPF area 0?",o:["It's the backbone every area must connect to for inter-area routing","It carries only external routes redistributed by ASBRs in the domain","It must contain every router in the domain, with no exceptions","It's the stub area that receives only a default route from ABRs"],a:[0],e:"Inter-area traffic always passes through area 0 to prevent loops, so all ABRs need a connection to it."},
{id:"a69",d:1,q:"An OSPF hub router has 300 spoke neighbors on a DMVPN cloud. What design helps hub stability?",o:["Point-to-multipoint, summarize toward spokes, and consider EIGRP or BGP at scale","Make every spoke an ABR so each one summarizes its own LAN prefixes","Put the hub in a totally stubby area so it holds only a default route toward the spokes","Turn off hellos on the tunnel so adjacencies never time out"],a:[0],e:"Large OSPF hubs are hard to scale because every spoke shares the area's LSDB. EIGRP stubs or BGP scale better for big DMVPN."},
{id:"a70",d:1,q:"Which OSPF feature lets a router avoid being used as a transit path during maintenance by advertising maximum metric?",o:["max-metric router-lsa","area range","passive-interface","default-information originate"],a:[0],e:"Stub router advertisement (max-metric) makes the router unattractive for transit while still reaching its own networks, useful during upgrades or boot."},
{id:"a71",d:1,q:"What is OSPF incremental SPF (iSPF) and why use it?",o:["Recomputes only the affected part of the SPF tree, saving CPU","Runs a full SPF only once an hour, batching all of the changes","Turns off SPF on ABRs, which rely on summaries instead","Moves the SPF calculation to the DR on each segment"],a:[0],e:"iSPF reduces computation when a change affects only part of the topology."},
{id:"a72",d:1,q:"Which EIGRP feature advertises only a default route to spokes, keeping their tables small?",o:["Summarizing to 0.0.0.0/0 on the hub's spoke-facing interfaces","Configuring EIGRP stub on the hub router","Using variance on the hub's spoke-facing tunnel interfaces","Making the hub's spoke-facing interfaces passive"],a:[0],e:"A summary of 0.0.0.0/0 toward spokes gives them one route and bounds queries at the hub."},
{id:"a73",d:1,q:"EIGRP stub with 'connected summary' is configured on a spoke. What does it advertise?",o:["Only its connected and summary routes","All routes learned from every neighbor","Nothing, it only receives routes","Only its static routes"],a:[0],e:"connected summary is the default stub option. Other options include static, redistributed, receive-only, and leak-map."},
{id:"a74",d:1,q:"A dual-homed EIGRP spoke uses two hubs, but traffic between the hubs is flowing through the spoke. What is the fix?",o:["Configure the spoke as EIGRP stub","Raise the bandwidth value on the spoke","Disable split horizon","Increase hold time"],a:[0],e:"Stubs don't advertise learned routes, so they're never used as transit between hubs."},
{id:"a75",d:1,q:"Which EIGRP mode uses address families and wide metrics in one place?",o:["Named mode","Classic mode","Stub mode","Autonomous mode"],a:[0],e:"Named EIGRP configures IPv4 and IPv6 under one process with af-interface settings and 64-bit metrics."},
{id:"a76",d:1,q:"Which IS-IS router level maintains the backbone topology across areas?",o:["Level 2","Level 1","Level 0","Level 3"],a:[0],e:"L1 routers know only their own area. L2 routers form the backbone. L1/L2 routers connect the two."},
{id:"a77",d:1,q:"Why do some large enterprises and service providers choose IS-IS over OSPF?",o:["It runs over CLNS, extends easily with TLVs like IPv6, and scales in flat designs","It supports more LSA types than OSPF, giving finer control over flooding","It's required for BGP, which needs IS-IS to resolve next hops across the core network","It uses less bandwidth than static routes because it sends no updates"],a:[0],e:"IS-IS is protocol-agnostic thanks to TLVs and isn't IP-dependent, which makes adding IPv6 and other features simple."},
{id:"a78",d:1,q:"What is IS-IS route leaking used for?",o:["Advertising specific L2 routes into an L1 area so L1 routers pick the best exit","Leaking routes between VRFs so shared services are reachable from each of the user VRFs","Redistributing BGP routes into IS-IS at the edge of the routing domain","Hiding specific routes from Level 2 so the backbone stays small"],a:[0],e:"By default L1 routers just use the nearest L1/L2 router's default route, which can be suboptimal. Leaking specific prefixes fixes that."},
{id:"a79",d:1,q:"In IS-IS, what sets the attached (ATT) bit?",o:["An L1/L2 router with backbone access, telling L1 routers to use a default","An L1 router with no neighbors, telling others it's isolated","The DIS on a broadcast segment, telling the other routers that it is the pseudonode","An ASBR, telling others it redistributes external routes"],a:[0],e:"L1 routers install a default toward L1/L2 routers that set ATT. You can suppress it to control exits."},
{id:"a80",d:1,q:"What is the IS-IS equivalent of an OSPF DR on a broadcast network?",o:["DIS (Designated Intermediate System)","BDR (Backup Designated Router)","ABR (Area Border Router)","ASBR (Autonomous System Boundary Router)"],a:[0],e:"The DIS creates the pseudonode LSP. Unlike OSPF there's no backup, and a higher-priority router preempts."},
{id:"a81",d:1,q:"A company needs to connect to two ISPs and receive full internet routes from both. What must the edge routers have?",o:["Enough memory and CPU to hold full BGP tables of over a million routes","Only a static default route to each ISP, since BGP isn't needed","OSPF adjacencies with each ISP so they can exchange internet routes","A single /30 link to each ISP, which limits the table size they send"],a:[0],e:"Full tables allow best-exit decisions. Many enterprises instead take default plus partial routes to reduce resource needs."},
{id:"a82",d:1,q:"For a dual-ISP design where the company only needs outbound failover, what is the simplest BGP route option from the ISPs?",o:["Default route only from each ISP","Full routes from both","Partial routes from both","No routes; use static only on the ISP side"],a:[0],e:"Default-only is lightweight. Use local preference to prefer one ISP and fail to the other."},
{id:"a83",d:1,q:"A route reflector design has a single RR. What is the main design risk?",o:["The RR is a single point of failure for route distribution","The RR creates routing loops between its clients","The RR requires a full mesh between its clients","The RR rewrites the next hop on every route it reflects"],a:[0],e:"Deploy at least two RRs (often in the same cluster or different clusters) for redundancy."},
{id:"a84",d:1,q:"Where should BGP route reflectors ideally be placed?",o:["Following the physical topology so reflected paths match forwarding, often off the data path","Only at the internet edge, where routes first enter the AS from eBGP peers at the border","On every access switch, so each one reflects routes to its own neighbors","On the firewalls, so every reflected route is inspected by security policy"],a:[0],e:"RRs that don't match topology can hide better paths. Dedicated out-of-path RRs are common in large designs."},
{id:"a85",d:1,q:"What does BGP 'add-path' help with in route reflector designs?",o:["Advertising several paths per prefix so clients get multipath and fast failover","Adding AS-path prepends to routes so inbound traffic shifts from one link to another","Adding communities to routes so the ISP can apply policy to them","Adding new neighbors automatically when a router joins the AS"],a:[0],e:"An RR normally reflects only its best path. Add-path sends extra paths so clients see alternatives."},
{id:"a86",d:1,q:"Which BGP feature lets you tag routes with a value used later for policy decisions?",o:["Communities","Weight","Next hop","Origin"],a:[0],e:"Communities (standard, extended, large) group routes so policy can match the tag instead of long prefix lists."},
{id:"a87",d:1,q:"What does the well-known community NO_ADVERTISE do?",o:["The route isn't advertised to any BGP peer","It isn't advertised outside the AS (eBGP)","It isn't advertised outside the confederation","It's dropped immediately"],a:[0],e:"NO_EXPORT blocks eBGP advertisement. NO_ADVERTISE blocks advertisement to all peers. LOCAL_AS blocks it outside the sub-AS."},
{id:"a88",d:1,q:"Many ISPs support customer-set communities. What are they used for?",o:["Letting the customer ask the ISP to prepend, set local pref, or blackhole routes","Encrypting the BGP session between the customer router and the ISP's edge router","Assigning public IP addresses to the customer from the ISP's pool","Changing the ISP's AS number seen by the customer's other providers"],a:[0],e:"ISP-defined communities give customers control over inbound traffic engineering inside the ISP's network."},
{id:"a89",d:1,q:"What is Remote Triggered Black Hole (RTBH) filtering used for?",o:["Dropping traffic to an address under DDoS at the edge, triggered by a BGP route","Load balancing inbound traffic across two ISPs by withdrawing routes","Summarizing customer routes into aggregates before they're advertised to upstream ISPs","Encrypting traffic to an address that is being targeted by attackers"],a:[0],e:"A trigger router advertises the target with a community that edges set to a Null0 next hop. ISPs often accept a blackhole community from customers."},
{id:"a90",d:1,q:"An enterprise wants to protect its BGP sessions from spoofed resets. Which two features help? (Choose two.)",o:["TCP MD5 or TCP-AO authentication","GTSM (TTL security)","BGP weight","AS path prepending","Local preference"],a:[0,1],e:"Authentication validates the session. GTSM requires TTL 255 on incoming packets so remote attackers can't reach the session."},
{id:"a91",d:1,q:"What does RPKI-based route origin validation do?",o:["Checks that a prefix's origin AS is authorized to announce it, helping stop hijacks","Encrypts BGP updates between peers so routes can't be read in transit","Speeds up BGP convergence by validating routes before they're installed","Replaces route reflectors by validating all routes against one central database instead"],a:[0],e:"ROAs published by prefix holders let routers mark routes as valid, invalid, or not found, and drop invalid ones."},
{id:"a92",d:1,q:"What should an enterprise filter on routes received from its ISPs?",o:["Bogons, its own prefixes, an unwanted default, and overly specific prefixes","Nothing, because the ISP already filters everything it sends to customers","Only IPv6 routes, because IPv4 routes are filtered by the ISP already","Only /8 prefixes, because they're too large to be legitimate announcements"],a:[0],e:"Inbound filtering protects against leaks and hijacks. Outbound, only advertise your own prefixes."},
{id:"a93",d:1,q:"What is the main design risk of mutual redistribution at two points between OSPF and EIGRP?",o:["Loops and suboptimal routing, because routes feed back into their original domain","Higher bandwidth use, because both protocols keep sending full updates to each other","Neighbors won't form, because the two protocols use conflicting hello timers","OSPF areas break, because EIGRP routes can't be placed in a specific area"],a:[0],e:"Use route tags with filtering, or adjust AD, so routes learned from one domain aren't re-advertised back into it."},
{id:"a94",d:1,q:"When redistributing into OSPF on IOS, what must you consider about subnets?",o:["Older IOS needs the subnets keyword or only classful networks are redistributed","OSPF never accepts subnets, so every route must be summarized first","All redistributed routes become E1, which can't be changed later","The default metric is 0, so redistributed routes are always preferred over native routes"],a:[0],e:"On older IOS, without 'subnets' only classful networks are redistributed. Newer IOS XE includes subnets automatically. Default seed metric is 20 (E2), or 1 for BGP-learned routes."},
{id:"a95",d:1,q:"What is the default seed metric when redistributing into EIGRP if none is set?",o:["Infinity, so routes aren't installed, except static and connected","20, the same default used for redistribution into OSPF","1, the lowest possible composite metric","110, the same value as the OSPF administrative distance"],a:[0],e:"EIGRP needs a metric (bandwidth, delay, reliability, load, MTU) via default-metric or on the redistribute command, except when redistributing another EIGRP AS, static, or connected."},
{id:"a96",d:1,q:"Which tool is best to stop specific redistributed routes from being redistributed back at a second redistribution point?",o:["Route tags matched in a route map","Prefix lengths matched in a prefix list","Different OSPF process IDs","Higher bandwidth on the links"],a:[0],e:"Tag routes as they enter a domain, then deny that tag when redistributing in the other direction."},
{id:"a97",d:1,q:"What does a floating static route need to work as a backup to a dynamic route?",o:["An administrative distance higher than the dynamic protocol's AD","An administrative distance lower than the dynamic protocol's AD","The same administrative distance as the dynamic protocol","A route map that matches the dynamic route's prefix"],a:[0],e:"For example, AD 250 makes it only appear in the RIB when the OSPF/EIGRP/BGP route disappears."},
{id:"a98",d:1,q:"A static route points out a broadcast interface (Ethernet) without a next hop. What is the design issue?",o:["The router ARPs for every destination, relying on proxy ARP and using memory","The route won't install at all because a next hop address is required","The route is always preferred over connected routes on the same interface","The route forces every packet to be fragmented before it leaves"],a:[0],e:"Use a next-hop IP (or interface plus next hop) on multiaccess networks."},
{id:"a99",d:1,q:"What does PBR do in a design where guest traffic must always exit through a specific firewall?",o:["Overrides destination routing for matched guest traffic and sends it to the firewall","Summarizes all guest subnets into one prefix toward the firewall","Filters routing updates so the guest subnets are never advertised to internal routers","Encrypts guest traffic before it's sent across the campus core"],a:[0],e:"PBR on the guest SVI sets the next hop. Pair with tracking so PBR falls back if the firewall is down."},
{id:"a100",d:1,q:"When using VRF-Lite to separate guest and corporate traffic across a campus, what is required on each hop?",o:["A separate interface or subinterface and routing instance per VRF","An MPLS label for each VRF on every link between hops","One shared routing table for all VRFs","A GRE tunnel for each user in each VRF"],a:[0],e:"VRF-Lite is hop by hop. It works well for a few VRFs but gets complex at scale, where MPLS or SD-Access is easier."},
{id:"a101",d:1,q:"How can several VRFs reach a shared services network (DNS, DHCP) without merging them?",o:["Route leaking with RT import and export, or a fusion router or firewall","Moving every VRF into the global routing table so all routes are shared","Using one VRF for everything so no leaking is ever needed","Static ARP entries that point each VRF at the shared servers"],a:[0],e:"A fusion router or firewall connects the VRFs at a controlled point, or MP-BGP route targets leak specific routes."},
{id:"a102",d:1,q:"Which statement about BFD design is correct?",o:["Aggressive timers detect failures fast but can flap on unstable links or busy CPUs","BFD replaces the routing protocols by exchanging reachability information between neighbors","BFD works only with static routes and can't be registered with an IGP","BFD increases convergence time because it adds another layer of hellos"],a:[0],e:"Balance detection speed and stability. Hardware-offloaded BFD supports faster timers more safely."},
{id:"a103",d:1,q:"Which mechanism precomputes a backup next hop so traffic switches within about 50 ms when a link fails?",o:["IP Fast Reroute (LFA or TI-LFA)","Graceful restart (NSF/SSO)","BGP route dampening","OSPF stub areas"],a:[0],e:"Loop-Free Alternates install a backup path in the FIB ahead of time, so forwarding switches before the IGP finishes reconverging."},
{id:"a104",d:1,q:"What does NSF/graceful restart need from neighboring routers?",o:["They must be NSF-aware so they keep forwarding to the restarting router","They must be NSF-capable themselves, with dual supervisors installed","They must run BGP so restart state can be signaled between them","Nothing at all, because the restarting router handles everything"],a:[0],e:"The restarting router (NSF-capable) keeps forwarding via its FIB while neighbors (NSF-aware) don't tear down the adjacency."},
{id:"a105",d:1,q:"Why does Cisco recommend tuning SPF and LSA throttle timers in large OSPF networks?",o:["To react fast to a single change but back off during a flapping storm","To turn off SPF calculations completely during periods of instability","To reduce the number of areas needed in a large OSPF design","To speed up hello packets so neighbors detect failures sooner"],a:[0],e:"Exponential backoff timers start low for fast convergence and increase if changes keep coming."},
{id:"a106",d:1,q:"An enterprise uses 10.0.0.0/8 internally. A newly acquired company also uses 10.0.0.0/8. Which design options help? (Choose two.)",o:["NAT between the overlapping networks","VRFs with controlled route leaking and NAT for shared services","Merging the routing tables directly","Disabling routing at both companies","Using longer subnet masks everywhere"],a:[0,1],e:"Overlaps are usually handled with NAT at the boundary and/or VRF separation until one side is renumbered."},
{id:"a107",d:1,q:"Which routing protocol is most commonly used between an enterprise and its ISPs?",o:["eBGP","OSPF","EIGRP","RIPv2"],a:[0],e:"BGP is the inter-domain protocol, with policy controls for multihoming."},
{id:"a108",d:1,q:"What is the purpose of the BGP 'maximum-prefix' feature?",o:["Protect the router from a peer sending too many routes, such as a leak","Limit how many BGP neighbors a single router is allowed to have","Set the longest prefix length that the router will accept from a given peer","Increase the size of the BGP table beyond the platform's default"],a:[0],e:"It warns or tears down the session if the received prefix count exceeds the limit."},
{id:"a109",d:1,q:"Which two methods prevent an enterprise from becoming transit between its two ISPs? (Choose two.)",o:["Outbound filter permitting only the enterprise's own prefixes (for example an AS-path '^$' filter)","Tag ISP-learned routes with NO_EXPORT","Raise local preference on both ISPs","Use weight on internal routers","Remove the default route"],a:[0,1],e:"Only advertise locally originated routes. NO_EXPORT on received routes also stops them going to other eBGP peers."},
{id:"a110",d:1,q:"An enterprise uses private AS 65010 with one ISP. What happens to the private AS when the ISP advertises the enterprise prefix to the internet?",o:["The ISP strips it (remove-private-as) and announces the prefix from its own AS","The prefix is announced to the internet with the private AS left in the path","The prefix is dropped by the ISP because private ASNs can't be advertised","The private AS is converted to a 4-byte public AS before it's advertised"],a:[0],e:"Private ASNs (64512-65534, and 4200000000-4294967294) must not appear on the internet. Multihoming to different ISPs normally needs a public ASN."},
{id:"a111",d:1,q:"What is the main reason an enterprise multihomed to two different ISPs needs provider-independent address space?",o:["So both ISPs can advertise the same prefix and inbound failover works","So the company gets faster internet service than with provider space","Because BGP only accepts /24 or shorter prefixes from any provider","So the company can avoid using NAT for internal hosts"],a:[0],e:"With PI space (or with PA space the first ISP allows), both providers announce the same prefix. Most ISPs filter announcements longer than /24 (IPv4) or /48 (IPv6)."},
{id:"a112",d:1,q:"Which IPv6 routing protocol versions are used by Cisco IGPs?",o:["OSPFv3, EIGRP for IPv6, and IS-IS with IPv6 TLVs","OSPFv2 and RIPv1 with IPv6 extensions","EIGRPv2 and OSPFv1 with IPv6 address families","Only static routes, because IGPs don't carry IPv6"],a:[0],e:"OSPFv3 is a separate protocol version. EIGRP and IS-IS add IPv6 through address families or TLVs. MP-BGP carries IPv6 too."},
{id:"a113",d:1,q:"What is a common IPv6 design rule for loopback addresses?",o:["Use /128 loopbacks from a dedicated block","Use /64 loopbacks from each site's block","Use link-local loopback addresses only","Don't configure loopbacks on IPv6 routers"],a:[0],e:"Allocate a dedicated /64 (or larger) for loopbacks and assign /128s from it, which makes filtering and summarization easy."},
{id:"a114",d:1,q:"Why should you summarize IPv6 routes even though IPv6 has huge address space?",o:["It still reduces table size and limits how far failures spread","IPv6 can't be summarized, so it doesn't apply to IPv6 at all","It's needed for SLAAC to work across routed boundaries","It encrypts routes so they can't be read by attackers"],a:[0],e:"Hierarchy and summarization matter just as much in IPv6. Plan blocks per region and site so summaries line up."},
{id:"a115",d:1,q:"Which of these is the correct expansion of 2001:db8::1:0:0:1?",o:["2001:0db8:0000:0000:0001:0000:0000:0001","2001:0db8:0001:0000:0000:0000:0000:0001","2001:0db8:0000:0001:0000:0000:0000:0001","2001:0db8:0000:0000:0000:0001:0000:0001"],a:[0],e:"Six groups are written out (2001, db8, 1, 0, 0, 1), so :: stands for 8 - 6 = 2 zero groups right after db8."},
{id:"a116",d:1,q:"What does DHCPv6 prefix delegation (PD) do?",o:["A router requests a prefix, like a /56, from upstream to number its own subnets","It gives each host a single IPv6 address from a central DHCPv6 server in the data center","It translates IPv6 addresses into IPv4 addresses at the network edge","It hands out only DNS server addresses, while hosts use SLAAC"],a:[0],e:"PD is common for branch routers and ISP CPEs, which then advertise /64s on their LAN interfaces."},
{id:"a117",d:1,q:"Which RA flag tells hosts to get their address from stateful DHCPv6?",o:["M (Managed) flag","O (Other config) flag","A (Autonomous) flag in the prefix","L (On-link) flag"],a:[0],e:"M=1 means use DHCPv6 for addresses. O=1 means get other info (DNS) from DHCPv6. A=1 in the prefix option allows SLAAC."},
{id:"a118",d:1,q:"Which statement about OSPF summarization and black holes is correct?",o:["The summarizing router adds a Null0 discard route for unused parts of the summary","Summaries never create loops, so no extra routes are ever needed on the summarizing ABR","OSPF can't summarize, so every prefix is advertised individually","Summaries can only be configured on internal routers, not on ABRs"],a:[0],e:"Traffic to an unused address in the summary is dropped at the summarizer instead of following a default route back and forth."},
{id:"a119",d:1,q:"Which design choice lets a large OSPF network add a new area without changing the backbone?",o:["Pre-allocated address blocks per area that summarize cleanly at the ABRs","The same address block reused in every area, kept apart by area ID","Removing area 0 so new areas can connect to any existing area","Putting all ABRs into a stub area so any new area inherits the stub settings"],a:[0],e:"With a block reserved per area, the backbone only sees one summary per area."},
{id:"a120",d:1,q:"An EIGRP network has slow convergence because a lost route triggers queries across 500 routers. Which two changes help most? (Choose two.)",o:["Summarize at distribution and WAN boundaries","Configure remote sites as stubs","Increase hello timers","Turn off split horizon everywhere","Use static routes on the core"],a:[0,1],e:"Both limit how far queries travel: a router receiving a query for a route it only knows as part of a summary replies immediately."},
{id:"a121",d:1,q:"In a BGP design with two edge routers connected to the same ISP, which attribute should the enterprise set to tell the ISP which link to prefer for inbound traffic?",o:["MED","Local preference","Weight","Origin"],a:[0],e:"MED is compared between paths from the same neighboring AS, so it works for two links to one ISP. Prepending is for different ISPs (and also works here)."},
{id:"a122",d:1,q:"What is conditional advertisement in BGP?",o:["Advertising a prefix only if another route exists or doesn't, such as to a backup ISP","Advertising a prefix only after a fixed delay following establishment of the BGP session","Advertising a prefix only during configured time windows such as weekdays","Advertising a prefix only within the IPv6 address family, not IPv4"],a:[0],e:"advertise-map with exist-map or non-exist-map controls this, which helps active/standby inbound designs."},
{id:"a123",d:1,q:"What is the purpose of BGP route dampening?",o:["Suppress routes that flap repeatedly to protect stability","Speed up convergence when routes are withdrawn","Increase the number of paths kept for each prefix","Change the next hop on routes that flap more than once"],a:[0],e:"Each flap adds a penalty. Over the suppress limit, the route is held down until the penalty decays below the reuse limit."},
{id:"a124",d:1,q:"Which IGP is best suited when the design needs very fast convergence, multi-vendor support, and a simple flat hierarchy across a large SP-like core?",o:["IS-IS","RIPv2","EIGRP classic","Static routing"],a:[0],e:"IS-IS is standards-based, scales well in a single L2 domain, and is widely used in SP and large DC cores."},
{id:"a125",d:1,q:"Which route has the lowest preference (highest AD) by default?",o:["iBGP (200)","External EIGRP (170)","RIP (120)","OSPF (110)"],a:[0],e:"iBGP's high AD prefers IGP routes for internal destinations. Only unknown (255) is worse."},
// ---------- Domain 2 (expanded) ----------
{id:"b55",d:2,q:"Which access layer feature lets a single switch port support an IP phone and a PC in separate VLANs?",o:["Voice VLAN (switchport voice vlan)","Private VLAN with a community port","VLAN trunking negotiated with DTP","Native VLAN tagging on the port"],a:[0],e:"The phone tags voice traffic in the voice VLAN (learned via CDP/LLDP-MED) and passes the PC's untagged data in the access VLAN."},
{id:"b56",d:2,q:"Which two technologies allow multichassis EtherChannel from an access switch to two distribution switches? (Choose two.)",o:["StackWise Virtual","vPC (on Nexus)","HSRP","UDLD","PAgP on separate switches without virtualization"],a:[0,1],e:"StackWise Virtual (Catalyst) and vPC (Nexus) let two physical switches terminate one bundle, giving all links forwarding without STP blocking."},
{id:"b57",d:2,q:"What is a key difference between vPC and StackWise Virtual?",o:["vPC keeps two separate control planes; StackWise Virtual merges them into one","vPC merges the control planes into one; StackWise Virtual keeps two separate ones","Both use one control plane","Neither supports MEC"],a:[0],e:"Nexus vPC peers stay independent (with a peer link and keepalive). StackWise Virtual creates one logical switch with SSO."},
{id:"b58",d:2,q:"What problem does a dual-active detection link solve in StackWise Virtual?",o:["It detects both switches going active after the SVL fails, preventing split brain","It load balances traffic across both switches whenever the SVL becomes congested","It replaces the SVL so the two switches can run with no direct link","It speeds up STP convergence across the StackWise Virtual pair"],a:[0],e:"If the virtual link fails, both chassis could go active with the same IPs. Dual-active detection forces one into recovery mode."},
{id:"b59",d:2,q:"Which design is preferred for connecting a Layer 2 access switch to a distribution pair to avoid STP blocking?",o:["Multichassis EtherChannel to a StackWise Virtual pair","Two separate uplinks running Rapid PVST+","A single uplink to one distribution switch","Daisy-chained access switches with a single uplink"],a:[0],e:"With MEC, both uplinks are in one logical bundle, so STP sees a single link and no ports block."},
{id:"b60",d:2,q:"What is the recommended EtherChannel member count for even hash distribution?",o:["A power of 2, such as 2, 4, or 8","Any odd number, such as 3, 5, or 7","Exactly 3 members in every bundle","Always 6 members in every bundle"],a:[0],e:"Hash buckets divide evenly across 2, 4, or 8 links. Other counts lead to uneven load."},
{id:"b61",d:2,q:"Which STP mode does Cisco recommend for most campus networks with a moderate number of VLANs?",o:["Rapid PVST+","Classic 802.1D","PVST+","CST"],a:[0],e:"Rapid PVST+ gives fast convergence with per-VLAN control. MST is better when there are many VLANs or for multi-vendor interoperability."},
{id:"b62",d:2,q:"Why should STP still be enabled even in a routed access design?",o:["As a safety net against loops from miscabling or rogue devices","Because routed point-to-point links need STP to forward traffic","To elect the default gateway for each access switch subnet","To carry HSRP hellos between the access and distribution layers"],a:[0],e:"Never disable STP. It protects the access layer from user-created loops."},
{id:"b63",d:2,q:"What is the purpose of the STP 'bridge assurance' feature?",o:["BPDUs go out every port, and a port blocks if they stop, catching one-way links","It makes PortFast ports transition to forwarding even faster than they normally would","It replaces root guard on distribution downlinks toward access switches","It encrypts BPDUs so a rogue switch can't read the STP topology"],a:[0],e:"Bridge assurance (Rapid PVST+/MST on point-to-point links) puts ports in an inconsistent state when BPDUs stop."},
{id:"b64",d:2,q:"What is the main benefit of an HSRP design with different active routers for different VLANs?",o:["It load shares traffic across both distribution switches","It removes the need for STP in the access layer","It doubles the number of virtual IPs available per VLAN","It improves security by hiding the active gateway"],a:[0],e:"Make Dist-1 active for odd VLANs and Dist-2 for even VLANs (matching STP root) to use both uplinks."},
{id:"b65",d:2,q:"Which HSRP setting should be tuned so the router that just rebooted doesn't preempt before its routing has converged?",o:["Preempt delay (standby preempt delay minimum)","Hello and hold timers (standby timers)","Virtual MAC address (standby mac-address)","Group number (standby group)"],a:[0],e:"Without a delay, a rebooted router can take over as gateway before it has routes, black-holing traffic."},
{id:"b66",d:2,q:"In a routed access design, what provides fast convergence on the uplinks?",o:["ECMP routes across both uplinks with fast IGP timers or BFD","STP PortFast on both uplinks toward the distribution switches","HSRP on the access switch toward the distribution","VTP pruning on both uplinks toward the distribution"],a:[0],e:"Equal-cost paths through both distribution switches mean a failed link is removed from the FIB quickly, often in under 200 ms."},
{id:"b67",d:2,q:"In a routed access design, what should the access switches be configured as to keep them from being used as transit?",o:["EIGRP stub or an OSPF totally stubby area","An OSPF ASBR that redistributes connected routes","A BGP route reflector client of the distribution","The HSRP active router for each access VLAN"],a:[0],e:"Stub configuration keeps access switches out of the transit path and reduces their routing tables."},
{id:"b68",d:2,q:"Which link should exist between a pair of distribution switches in a routed access design?",o:["A Layer 3 link for routing between them","No link at all","A Layer 2 trunk carrying all access VLANs","A management-only link"],a:[0],e:"A routed link between the distribution pair gives an alternate path for summarized routes and avoids black holes."},
{id:"b69",d:2,q:"Why should a distribution pair be connected with a Layer 3 link when it summarizes access routes toward the core?",o:["To avoid black-holing when one switch loses an access link but still advertises the summary","To carry STP BPDUs between the two distribution switches so they can elect a single root","To run VTP between the distribution switches so VLANs stay synchronized","To extend access VLANs between the distribution switches for host mobility"],a:[0],e:"The summarizing switch still advertises the summary. A Layer 3 path to its peer lets it forward to the access switch it can no longer reach directly."},
{id:"b70",d:2,q:"What oversubscription ratio is generally recommended between distribution and core?",o:["About 4:1","20:1","1:20","Always 1:1"],a:[0],e:"Common guidance is up to 20:1 at access-to-distribution and about 4:1 at distribution-to-core. Data centers aim lower."},
{id:"b71",d:2,q:"What is a main benefit of a separate campus core when there are many distribution blocks?",o:["It avoids a full mesh between distribution blocks, simplifying cabling and routing","It removes the need for any routing protocols between the distribution blocks","It allows VLANs to span the whole campus through the core layer","It reduces the number of access switches needed in each building"],a:[0],e:"Without a core, N distribution pairs need N(N-1)/2 interconnections. A core reduces that to connections to the core only."},
{id:"b72",d:2,q:"Which three blocks commonly connect to a campus core? (Choose three.)",o:["Distribution blocks","Data center / server block","WAN and internet edge","Individual user PCs","IP phones"],a:[0,1,2],e:"The core interconnects building distribution, DC/services, and edge blocks. End devices attach at the access layer."},
{id:"b73",d:2,q:"Which PoE standard (Type 3) provides up to 60 W at the PSE?",o:["802.3bt Type 3 (UPOE class)","802.3af","802.3at","Cisco pre-standard inline PoE"],a:[0],e:"802.3af = 15.4 W, 802.3at (PoE+) = 30 W, 802.3bt Type 3 = 60 W, Type 4 = 90 W at the switch port."},
{id:"b74",d:2,q:"What does Cisco Perpetual PoE provide?",o:["Keeps power to endpoints during a switch software reload","Doubles the power output available on each PoE port","Allows up to 200 W per port for high-power devices","Powers endpoints over fiber instead of copper cabling"],a:[0],e:"Perpetual PoE keeps power flowing during a soft reload. Fast PoE restores power quickly after a full power cycle."},
{id:"b75",d:2,q:"How should power supply capacity be planned for an access switch?",o:["Sum the PoE budget and system power, then add redundancy (N+1 or N+N)","Use the smallest supply available and add a second one if ports fail","Consider only the data ports, since PoE draws from a separate supply","Assume each powered device uses about 1 W and size the supply to match"],a:[0],e:"Under-provisioning PoE causes devices to lose power. Redundant supplies protect against PSU failure."},
{id:"b76",d:2,q:"Which Wi-Fi standard is 802.11ax?",o:["Wi-Fi 6 and 6E","Wi-Fi 5 (Wave 2)","Wi-Fi 4","Wi-Fi 7"],a:[0],e:"802.11n = Wi-Fi 4, 802.11ac = Wi-Fi 5, 802.11ax = Wi-Fi 6 (6E in 6 GHz), 802.11be = Wi-Fi 7."},
{id:"b77",d:2,q:"What is the main advantage of the 6 GHz band for WLAN design?",o:["Many more clean wide channels, used only by modern clients","Better wall penetration than the 2.4 GHz band","Support for legacy 802.11b clients","Longer range than the 5 GHz band"],a:[0],e:"6 GHz adds up to 1,200 MHz (region dependent) of spectrum without legacy devices, so wider channels are practical."},
{id:"b78",d:2,q:"What is the recommended cell overlap for seamless roaming in a voice-grade WLAN?",o:["About 15-20% overlap at -67 dBm","No overlap, to avoid co-channel interference","About 50% overlap at -85 dBm","Overlap doesn't affect roaming quality"],a:[0],e:"Enough overlap that the client sees the next AP at a good signal before leaving the current one."},
{id:"b79",d:2,q:"What type of wireless site survey uses software to model coverage from floor plans before any AP is installed?",o:["Predictive survey","Passive survey","Active survey","Post-deployment validation"],a:[0],e:"Predictive surveys estimate coverage. Passive and active surveys measure real signal (active also tests association and throughput), often after install."},
{id:"b80",d:2,q:"Why might a WLAN designer disable the lowest data rates (like 1, 2, 5.5 Mbps)?",o:["To cut airtime used by slow frames and get clients to roam sooner","To increase coverage by letting distant clients stay connected","To support legacy clients that need the lowest data rates","To hide the SSID from clients that don't support high rates"],a:[0],e:"Low rates take more airtime, and beacons at low rates make cells larger. Raising the minimum rate shrinks cells and improves capacity."},
{id:"b81",d:2,q:"What does band steering do?",o:["Encourages dual-band clients to join on 5 or 6 GHz instead of 2.4 GHz","Forces all clients onto 2.4 GHz to maximize range and coverage","Changes AP channels automatically whenever strong interference is detected","Blocks legacy clients that support only the 2.4 GHz band"],a:[0],e:"Higher bands have more channels and less interference, so steering capable clients there improves performance."},
{id:"b82",d:2,q:"What is an anchor controller used for in a guest WLAN design?",o:["Terminating guest traffic in the DMZ via a mobility tunnel from internal WLCs","Managing APs in the campus core so the internal WLCs have fewer APs to manage","Running RRM for the whole campus from a single central controller","Storing guest user credentials so internal WLCs don't need RADIUS"],a:[0],e:"Foreign (internal) WLCs tunnel guest traffic to the anchor, so guest traffic never touches internal VLANs."},
{id:"b83",d:2,q:"What does an AP in FlexConnect mode do with locally switched WLANs when the WAN to the WLC fails?",o:["Keeps serving clients and can authenticate new ones with local auth or RADIUS","Disconnects all clients until the connection to the WLC is restored","Reboots and keeps retrying until it can join the WLC again","Switches to sniffer mode and stops serving clients until the WAN link recovers"],a:[0],e:"FlexConnect standalone mode keeps local switching working. Central switching WLANs stop because they depend on the WLC."},
{id:"b84",d:2,q:"Which Catalyst 9800 deployment model fits a large campus with thousands of APs and SSO redundancy?",o:["9800-40 or 9800-80 appliances in an HA SSO pair","Embedded wireless controller running on an AP","Mobility Express on a primary AP","Cloud-only Meraki management with no WLC"],a:[0],e:"Appliances scale to thousands of APs (9800-80 up to 6,000 APs). EWC is for small sites."},
{id:"b85",d:2,q:"What does an AP group or site tag commonly control in WLAN design?",o:["Which WLANs and settings apply to a group of APs, such as by building","The RF channel and transmit power assigned to each individual AP in the group","The IP addresses handed out to clients on each WLAN","The management IP address used by the wireless controller"],a:[0],e:"Grouping APs lets different buildings get different SSIDs, VLANs, or FlexConnect settings."},
{id:"b86",d:2,q:"Which method is preferred to secure enterprise WLAN access for corporate devices?",o:["802.1X with EAP-TLS certificates","WPA2-PSK shared by all employees","Open SSID with MAC filtering","WEP"],a:[0],e:"Per-device certificates give strong mutual authentication and allow revoking a single device."},
{id:"b87",d:2,q:"What is Cisco's recommended maximum number of SSIDs per radio to limit beacon overhead?",o:["About 3 or 4","About 16 or more","About 32","Only 1"],a:[0],e:"Each SSID sends its own beacons at the minimum data rate, consuming airtime. Fewer SSIDs leave more airtime for data."},
{id:"b88",d:2,q:"In SD-Access, what is a fabric site?",o:["A group of fabric nodes sharing control plane, border, and edge roles at one location","A single switch running every fabric role for an entire campus or a whole region","A wireless SSID that's mapped to a virtual network inside the fabric","A VLAN that's extended across multiple buildings by the fabric edges"],a:[0],e:"Each fabric site has its own control plane and border nodes. Multiple sites connect through a transit."},
{id:"b89",d:2,q:"Which two SD-Access transit types connect fabric sites? (Choose two.)",o:["SD-Access transit (LISP/VXLAN, keeps VN and SGT)","IP-based transit (VRF-Lite handoff, SGT via other means)","STP transit","HSRP transit","VTP transit"],a:[0,1],e:"SD-Access transit keeps context end to end over a capable network. IP transit hands off to traditional routing like SD-WAN or MPLS, needing SXP or inline tags for SGTs."},
{id:"b90",d:2,q:"What is the underlay in SD-Access?",o:["The physical routed network (Layer 3 links and an IGP) carrying VXLAN","The VXLAN tunnels that carry user traffic between the fabric nodes","The SGT policy that controls traffic between groups of users","The wireless SSIDs that are mapped into virtual networks"],a:[0],e:"The underlay just needs IP reachability between loopbacks, ideally routed links with no STP, and an increased MTU for VXLAN."},
{id:"b91",d:2,q:"What MTU consideration applies to an SD-Access underlay?",o:["Raise the MTU, such as to 9100, to fit VXLAN's ~50-byte overhead","Reduce the MTU to 1000 bytes to leave room for VXLAN headers","No change is needed because VXLAN fragments packets itself","Disable jumbo frames so all links use a consistent 1500 bytes"],a:[0],e:"Underlay links should support jumbo frames so client frames at 1500 bytes plus VXLAN headers aren't fragmented."},
{id:"b92",d:2,q:"What is a policy extended node in SD-Access?",o:["An extended node that can also enforce SGT-based policy locally","An extended node that runs only STP toward its connected devices","A border node that hands off policy to external networks","A wireless controller that applies policy to fabric APs"],a:[0],e:"Extended nodes connect non-fabric devices (like IE switches) to the fabric. Policy extended nodes can additionally enforce group-based policy."},
{id:"b93",d:2,q:"Which SD-Access component is optional but helpful for traffic that must go through a firewall between VNs?",o:["A fusion device (router or firewall) outside the border","An extra control plane node for inter-VN traffic","An AP in monitor mode watching inter-VN traffic","A second Catalyst Center cluster for policy"],a:[0],e:"VNs are isolated. A fusion router or firewall connected to the border leaks routes between VNs and shared services."},
{id:"b94",d:2,q:"What makes SD-Access wireless different from a traditional centralized WLAN design?",o:["Data is switched at the fabric edge in VXLAN instead of tunneled to the WLC","It doesn't use a WLC at all, because APs register directly with the fabric","APs must run in FlexConnect mode so they can switch traffic locally","It supports only WPA2-Personal because 802.1X isn't available in fabric"],a:[0],e:"The WLC is still the control plane and registers wireless clients with the fabric control plane, but data stays distributed."},
{id:"b95",d:2,q:"What does Layer 2 flooding in SD-Access allow?",o:["Apps that need broadcast or link-local multicast, like some IoT, to work in the fabric","Faster IP routing between fabric edges, because it skips the LISP lookup for each flow","STP to run across the fabric so loops are prevented between edges","Higher VLAN counts on each edge by flooding VLAN information"],a:[0],e:"Fabric normally suppresses broadcast. Enabling Layer 2 flooding maps broadcasts to an underlay multicast group for that pool."},
{id:"b96",d:2,q:"What is the role of the 'L2 handoff' feature on an SD-Access border during migration?",o:["Extends a fabric pool into a traditional VLAN so both sides share one subnet","Translates IPv4 to IPv6 for endpoints moving from the legacy network","Encrypts traffic between the fabric and the traditional network","Creates a new virtual network for the endpoints that are still in the legacy network"],a:[0],e:"Layer 2 border handoff lets the fabric anycast gateway serve hosts still on the old network until they move."},
{id:"b97",d:2,q:"Which Catalyst Center feature discovers existing devices and onboards new switches with zero-touch Plug and Play?",o:["PnP (Plug and Play) and Discovery","Assurance and AI analytics","Path Trace and Network Reasoner","Template Hub on its own"],a:[0],e:"Discovery adds existing devices via CDP/LLDP/IP range. PnP onboards new devices that call home via DHCP option or DNS."},
{id:"b98",d:2,q:"What is micro-segmentation in a campus design?",o:["Controlling traffic between groups inside the same VN or subnet, usually with SGTs","Splitting large VLANs into smaller subnets so broadcasts are reduced","Using /31 links between the switches to save address space in the underlay network","Building separate physical networks for each group of endpoints"],a:[0],e:"Macro-segmentation (VNs/VRFs) separates large domains. Micro-segmentation (SGTs) controls group-to-group within them."},
{id:"b99",d:2,q:"Which Layer 2 access design uses a single VLAN per access switch and no VLANs spanning the distribution pair?",o:["Loop-free U-less (V) topology","Looped triangle topology design","Looped square topology","Flat Layer 2 topology"],a:[0],e:"When each VLAN stays local to one access switch and the distribution link is Layer 3, there are no Layer 2 loops and STP blocks nothing."},
{id:"b100",d:2,q:"What is a downside of a looped Layer 2 triangle design?",o:["STP must block one uplink, wasting bandwidth and tying convergence to STP","It provides no redundancy if a distribution switch fails","It requires routed access, which removes the Layer 2 VLAN flexibility it was chosen for","It can't use HSRP, so hosts lose their gateway on failure"],a:[0],e:"Looped designs are sometimes needed for VLANs spanning access switches but are less efficient and riskier than loop-free designs."},
{id:"b101",d:2,q:"What is the purpose of the 'UDLD aggressive' mode in a campus design?",o:["Err-disables a link after detecting a one-way failure, preventing STP loops","Speeds up STP convergence by letting the port skip the listening and learning states","Bundles parallel links into one logical link for more bandwidth","Monitors PoE draw on each port and shuts down overloaded ports"],a:[0],e:"Normal mode only logs. Aggressive mode disables the port when echoes stop, which is important on fiber uplinks."},
{id:"b102",d:2,q:"Which feature should be configured on access ports to quickly bring up end hosts?",o:["PortFast with BPDU guard","Root guard with PortFast","Loop guard","UplinkFast"],a:[0],e:"PortFast skips listening and learning, and BPDU guard shuts the port if a switch appears."},
{id:"b103",d:2,q:"What is the main campus design reason to tune or disable DTP?",o:["Prevent unwanted trunks and switch spoofing","Speed up STP convergence on access ports","Enable PoE on ports that connect phones","Reduce the size of the MAC address table"],a:[0],e:"Set access ports to access mode and trunks to trunk with nonegotiate."},
{id:"b104",d:2,q:"Which two methods help prevent VLAN hopping in a campus? (Choose two.)",o:["Use an unused VLAN as the native VLAN on trunks","Disable DTP on access ports","Use VLAN 1 for management","Allow all VLANs on all trunks","Enable PortFast on trunks"],a:[0,1],e:"Double tagging relies on the native VLAN matching the attacker's VLAN. Switch spoofing relies on DTP."},
{id:"b105",d:2,q:"Which mechanism lets a campus design scale to thousands of VLANs while keeping STP load low?",o:["MST with VLANs mapped to a few instances","PVST+ with one instance per VLAN","Rapid PVST+ with faster timers","VTP pruning on its own"],a:[0],e:"MST runs one STP calculation per instance, not per VLAN."},
{id:"b106",d:2,q:"What is the purpose of a campus services block?",o:["Hosting central services like WLCs, ISE, DHCP, DNS, and Catalyst Center near the core","Connecting end users and their phones to the network with PoE and port security policies","Connecting the campus to the WAN and terminating branch VPN tunnels","Hosting only the internet edge firewalls and their DMZ networks"],a:[0],e:"A dedicated services block attaches to the core and gives all distribution blocks equal access to shared services."},
{id:"b107",d:2,q:"Why place WLCs in a services block rather than in a building distribution block?",o:["So every building gets consistent access and wireless traffic doesn't hairpin","Because WLCs need PoE, which only the distribution switches in a building can deliver","Because APs must be in the same VLAN as the WLC to join it","So wireless traffic can reach the WLC without any routing"],a:[0],e:"Central placement keeps paths symmetrical and avoids tying shared infrastructure to one building's failure domain."},
{id:"b108",d:2,q:"What is the benefit of using /31 masks on point-to-point IPv4 links?",o:["Saves address space with no loss of function (RFC 3021)","Allows two more host addresses than a /30 for servers","Required for OSPF to form adjacencies on point-to-point links","Enables directed broadcasts across the point-to-point link"],a:[0],e:"/31 links use both addresses as host addresses. /30 wastes two (network and broadcast)."},
{id:"b109",d:2,q:"What does a modular campus design make easier?",o:["Adding or changing a building block without affecting the rest of the network","Removing redundancy from blocks that don't host any critical applications or users","Using one large VLAN across every block for simpler host mobility","Avoiding routing protocols by linking every block at Layer 2"],a:[0],e:"Self-contained blocks (access/distribution per building) connect to the core with consistent interfaces and summarization."},
{id:"b110",d:2,q:"What should a high-availability campus avoid?",o:["Single points of failure like one uplink, supervisor, or power supply","Redundant links, because they add STP complexity to the design","Fast convergence, because it causes instability during failures","Summarization, because it hides failures from the core"],a:[0],e:"Add redundancy where the impact justifies it: core and distribution most, access as needed."},
{id:"b111",d:2,q:"What does ISSU (In-Service Software Upgrade) allow?",o:["Upgrading software on a redundant system with little or no disruption","Upgrading software on single-supervisor switches with no reload","Downgrading license levels without rebooting the device","Changing the hardware model while keeping the same running configuration"],a:[0],e:"ISSU works with SSO: upgrade the standby, switch over, then upgrade the other. StackWise Virtual and dual-sup chassis support it."},
{id:"b112",d:2,q:"What does Graceful Insertion and Removal (GIR) do?",o:["Takes a device out of the forwarding path for maintenance and returns it after","Inserts new line cards without needing to reload either of the supervisor modules","Removes unused VLANs from trunks to reduce STP load on the switch","Resets passwords on a device without losing its running configuration"],a:[0],e:"Maintenance mode isolates the switch (for example via max-metric and shutting peerings) so traffic moves away first."},
{id:"b113",d:2,q:"Which wireless deployment fits a retail chain with hundreds of small stores and a central IT team?",o:["FlexConnect APs managed by central WLCs, or cloud-managed APs","A redundant WLC appliance pair installed in every store","Autonomous APs configured locally, one AP at a time","Mesh APs at every store with a root AP at headquarters"],a:[0],e:"Central management with local switching avoids hardware at each store while keeping traffic local."},
{id:"b114",d:2,q:"What is an OEAP (OfficeExtend AP)?",o:["An AP at a teleworker's home that tunnels corporate SSIDs to a WLC","An outdoor AP built to withstand weather in campus parking areas","An AP in sniffer mode that captures frames for troubleshooting","A cloud-managed AP that doesn't need any controller at all"],a:[0],e:"OEAP extends corporate wireless to home offices with DTLS-encrypted CAPWAP, often with a local personal SSID."},
{id:"b115",d:2,q:"What is a key consideration when designing an outdoor mesh WLAN?",o:["Limit hop count and plan backhaul channels, since each hop cuts throughput","Use only 2.4 GHz for backhaul, since it has much better range than 5 GHz","Skip planning, since mesh APs find the best paths on their own","Give every mesh AP its own wired connection back to the network"],a:[0],e:"Mesh APs (MAPs) share bandwidth with the root AP (RAP). Fewer hops means better throughput and latency."},
{id:"b116",d:2,q:"Which method locates wireless clients for location services and analytics?",o:["RSSI trilateration or Fine Timing Measurement with Cisco Spaces","CDP neighbor information from each AP's switch port","STP topology data from the access layer switches","NetFlow records exported from the wireless controller"],a:[0],e:"Location accuracy needs AP density and placement suited to location, not just coverage."},
{id:"b117",d:2,q:"In high-density WLAN design, why are directional or patch antennas sometimes used?",o:["To focus coverage on a specific area and reduce co-channel interference","To make each cell larger so fewer APs are needed in the venue","To support legacy clients that can't connect through omnidirectional antennas","To raise beacon rates so clients discover the SSID faster"],a:[0],e:"Stadiums and auditoriums use directional antennas (often under-seat or overhead) to create small, focused cells."},
{id:"b118",d:2,q:"What does an access switch typically need to support Wi-Fi 6/6E APs well?",o:["mGig (2.5/5 Gbps) ports with 802.3bt or PoE+","100 Mbps ports with standard 802.3af power","Gigabit ports with no PoE and local AP power","Fiber-only ports with external power injectors"],a:[0],e:"Modern APs can exceed 1 Gbps and draw more power. mGig works over existing Cat5e/6 cabling."},
{id:"b119",d:2,q:"What is the role of the WLC's mobility group?",o:["Lets controllers share client context so clients can roam between them","Groups APs by floor so each floor gets its own RF settings","Configures VLANs on every AP that joins the controllers","Assigns IP addresses to wireless clients from a pool shared by the controllers"],a:[0],e:"Mobility peers exchange client info, so roaming across controllers keeps sessions and IPs."},
{id:"b120",d:2,q:"Which two are valid SD-Access fabric roles that can be combined on one device in a small site? (Choose two.)",o:["Control plane node","Border node","Catalyst Center","ISE PSN","DHCP server"],a:[0,1],e:"A co-located border and control plane node is common. Fabric in a box combines border, control plane, and edge (and optionally wireless) on one device."},
{id:"b121",d:2,q:"Why does SD-Access use an anycast gateway instead of HSRP?",o:["Every edge has the same gateway IP and MAC, so hosts move with no FHRP","HSRP doesn't work with IPv4 hosts connected to fabric edge nodes","Anycast gateways are quicker to configure than HSRP on a single switch","It lets the fabric avoid IP routing between the edge nodes"],a:[0],e:"Distributed gateways remove FHRP complexity and hairpinning through a central gateway."},
{id:"b122",d:2,q:"Which statement about a campus QoS design is correct?",o:["Classify and mark at the access edge, then queue consistently on every uplink","Configure QoS only on the WAN, since campus links are never congested","Trust all endpoint markings so applications get the treatment they request","Use a single queue everywhere so traffic is handled the same on every link"],a:[0],e:"Congestion can happen at any oversubscribed uplink, so queuing should be consistent end to end."},
{id:"b123",d:2,q:"What is conditional trust in campus QoS?",o:["The switch trusts markings only when it detects a Cisco IP phone","Trust is enabled on the port only during business hours","The switch never trusts markings from any device connected to the port","Trust is enabled or disabled based on the VLAN number"],a:[0],e:"trust device cisco-phone extends trust to the phone and re-marks the PC behind it."},
{id:"b124",d:2,q:"Which campus feature lets you isolate IoT devices, contractors, and employees without separate VLANs per group per closet?",o:["Group-based policy with SGTs (TrustSec or SD-Access)","Static routes between each group's subnets","Larger subnets that hold every group together","STP blocking between groups in each closet"],a:[0],e:"Policy follows the identity of the device or user, so you don't need to multiply VLANs and ACLs everywhere."},
{id:"b125",d:2,q:"What is a common reason to use a Layer 2 access design instead of routed access today?",o:["Some apps or devices need Layer 2 adjacency across several access switches","Layer 2 forwarding is faster than routing on modern access switches","Layer 2 access removes the need for spanning tree anywhere in the access layer","Layer 2 access needs fewer IP addresses than routed access designs"],a:[0],e:"Legacy apps, certain IoT, or clustering needs can require VLANs that span closets. Overlays like SD-Access offer the same with routed underlay."},
// ---------- Domain 3 (expanded) ----------
{id:"c44",d:3,q:"Which WAN transport typically offers SLAs for latency and loss and supports QoS end to end?",o:["MPLS L3VPN","Consumer broadband internet","Public Wi-Fi","Best-effort LTE"],a:[0],e:"Carrier MPLS services usually include SLAs and honor DSCP classes. Internet links are cheaper but best effort."},
{id:"c45",d:3,q:"What is the main advantage of using internet circuits with SD-WAN instead of only MPLS?",o:["Lower cost and more bandwidth, with SD-WAN adding encryption and path choice","Guaranteed latency from the internet provider under a formal service level agreement","No need for encryption, because internet circuits are already private","Provider-managed routing between sites, the same as MPLS L3VPN"],a:[0],e:"Broadband and DIA give cheap bandwidth. SD-WAN overlays add security and steer critical apps by measured performance."},
{id:"c46",d:3,q:"A branch has MPLS and broadband. Which SD-WAN design gives the best resilience?",o:["Build tunnels over both transports and use app-aware routing to steer traffic","Use only MPLS and keep broadband idle until the MPLS circuit fails completely","Use only broadband and cancel MPLS once the SD-WAN overlay is up","Use static routes per application that point at each transport"],a:[0],e:"Active/active transports with SLA-based policies keep critical apps on the best path and fail over automatically."},
{id:"c47",d:3,q:"Which LTE/5G WAN design concern is most important for a backup link?",o:["Data caps and usage costs, so traffic is limited to critical apps","LTE can't carry IP traffic without a separate tunneling protocol","LTE needs an MPLS label stack from the carrier to forward traffic","LTE has lower latency than fiber, so it shouldn't be used as backup"],a:[0],e:"Cellular links often have usage costs. SD-WAN can mark the link as last-resort and restrict which apps use it."},
{id:"c48",d:3,q:"In Catalyst SD-WAN, what does marking a circuit 'last-resort-circuit' do?",o:["It's used only when all other transports are down","It's used first, ahead of every other transport","It turns off encryption for tunnels over that circuit","It's used for management traffic only"],a:[0],e:"BFD runs at reduced rates and data tunnels on it are used only when no other tunnel is available."},
{id:"c49",d:3,q:"Which SD-WAN feature lets branch internet traffic go directly to the internet instead of backhauling to a data center?",o:["Direct Internet Access (DIA) with NAT and security","A hub-and-spoke centralized control policy","TLOC extension between two branch routers","OMP route reflection on the controllers"],a:[0],e:"DIA uses a NAT-enabled transport for local breakout, often paired with on-box firewall or cloud security like Umbrella SIG."},
{id:"c50",d:3,q:"What is a design risk of local internet breakout at branches?",o:["Each branch becomes an internet edge that needs security controls","Latency to SaaS applications goes up compared with backhauling","Traffic loses SD-WAN encryption between branches and the hub","MPLS transports stop working while local breakout is enabled"],a:[0],e:"Security moves to the branch: use SD-WAN integrated security or SASE/SSE services so policy stays consistent."},
{id:"c51",d:3,q:"What is SASE?",o:["SD-WAN combined with cloud-delivered security like SWG, CASB, ZTNA and FWaaS","A routing protocol that replaces OMP for large multi-region SD-WAN designs","A type of MPLS service that adds encryption between provider PE routers","A Wi-Fi standard that adds stronger authentication for enterprise SSIDs"],a:[0],e:"Secure Access Service Edge brings networking and security together as cloud services close to users."},
{id:"c52",d:3,q:"Which SD-WAN policy controls which sites form data plane tunnels with each other?",o:["Centralized control policy on the controllers, filtering TLOCs and routes","Localized data policy on each WAN edge router","QoS policy applied to each transport interface","Application-aware routing policy with SLA classes"],a:[0],e:"By filtering which TLOCs each site learns, a control policy creates hub-and-spoke, regional mesh, or partial mesh topologies."},
{id:"c53",d:3,q:"In Catalyst SD-WAN, which policy type lets you do service chaining, for example sending traffic through a firewall at a hub?",o:["Centralized data policy or control policy service insertion","Localized QoS policy on the hub WAN edge","An interface ACL applied on the branch WAN edge toward the hub","A device template pushed to the hub routers"],a:[0],e:"Service advertisements (like FW, IDS) from a hub and policy that references the service redirect matched traffic."},
{id:"c54",d:3,q:"How many vSmart controllers should a production SD-WAN design have, at minimum?",o:["At least two for redundancy","One","Exactly one per site","None if vManage is clustered"],a:[0],e:"Edges connect to multiple vSmarts. Controller counts scale with the number of edges and region design."},
{id:"c55",d:3,q:"What happens to SD-WAN data forwarding if all vSmart controllers become unreachable?",o:["Edges keep forwarding on last known routes and keys for a graceful restart period","All traffic stops immediately until at least one controller is reachable again","Edges fall back to forwarding over MPLS only, outside the overlay tunnels","Edges reboot and keep retrying until they can reach a controller"],a:[0],e:"OMP graceful restart keeps existing tunnels and routes working until timers expire or controllers return."},
{id:"c56",d:3,q:"Which SD-WAN deployment option has Cisco host the controllers?",o:["Cisco cloud-hosted controllers","On-premises controllers only","MSP-only controllers","No controllers"],a:[0],e:"Most customers use Cisco-hosted controllers. On-prem and MSP-hosted options exist for specific requirements."},
{id:"c57",d:3,q:"What does SD-WAN multi-region fabric (hierarchical SD-WAN) add?",o:["Regions joined by border routers in a core region, cutting full-mesh tunnels at scale","More vManage instances at every site, so each region is managed locally by its own team","A new routing protocol that replaces OMP between the regions","Replacing OMP with BGP so regions exchange routes like separate ASes"],a:[0],e:"Edges mesh within their region. Border routers connect regions through a core region."},
{id:"c58",d:3,q:"Which DMVPN phase uses NHRP redirects and shortcuts so spokes can build direct tunnels even when the hub summarizes routes?",o:["Phase 3","Phase 1","Phase 2","Phase 0"],a:[0],e:"Phase 3 lets the hub send summaries or defaults, and NHRP redirect/shortcut install direct routes on demand."},
{id:"c59",d:3,q:"Which routing protocol is commonly recommended over DMVPN for large scale (thousands of spokes)?",o:["BGP, often with the hub as route reflector","RIPv2, with split horizon disabled on the hub","OSPF in a single area across all spokes","Static routes only, configured on each spoke"],a:[0],e:"BGP handles large numbers of peers well and gives policy control. EIGRP is also common for mid-size designs."},
{id:"c60",d:3,q:"What is a design consideration for running OSPF over DMVPN?",o:["Use point-to-multipoint (or broadcast with the hub as DR), and all spokes share one area","OSPF can't run over DMVPN at all, because mGRE tunnels don't carry any multicast traffic","Every spoke must be the DR for its own segment of the DMVPN cloud","Use NBMA network type with no neighbors so hellos are never sent"],a:[0],e:"OSPF network type affects next-hop behavior. Phase 3 typically uses point-to-multipoint. All spokes in one area limits scale."},
{id:"c61",d:3,q:"What is the role of the DMVPN hub with NHRP?",o:["Next Hop Server: spokes register their tunnel-to-NBMA mappings with it","It forwards all spoke-to-spoke traffic permanently, with no shortcuts","It assigns DHCP addresses to spoke tunnel interfaces as they join","It acts as the IPsec certificate authority for every spoke router"],a:[0],e:"Spokes register with the NHS and query it to resolve another spoke's public address."},
{id:"c62",d:3,q:"Which two features increase DMVPN hub resiliency? (Choose two.)",o:["Dual hubs with separate clouds (dual cloud)","Dual hubs in a single cloud with spokes registering to both","A single hub with larger CPU","Disabling IPsec","Using static routes only"],a:[0,1],e:"Either design lets spokes keep tunnels to a second hub. Dual cloud gives clearer routing control."},
{id:"c63",d:3,q:"What is FlexVPN?",o:["Cisco's IKEv2 framework for site-to-site, hub-spoke and remote access, with one CLI","A legacy IKEv1 VPN framework kept only for compatibility with older third-party peers","An MPLS service that carries VPN routes between provider PE routers","A DMVPN replacement that uses GRE without IPsec for faster tunnels"],a:[0],e:"FlexVPN uses IKEv2, VTIs, and can use NHRP for spoke-to-spoke. It also integrates with AAA for per-peer attributes."},
{id:"c64",d:3,q:"What is the main advantage of GETVPN on a private MPLS WAN?",o:["Tunnel-less any-to-any encryption that keeps the original IP header","Works well over the internet because it hides the private addresses","Builds point-to-point tunnels between every pair of sites","Doesn't need a key server because peers negotiate keys directly"],a:[0],e:"Group members share keys from a key server. Header preservation means the MPLS provider still routes normally."},
{id:"c65",d:3,q:"Which IPsec VPN option suits connecting an enterprise to a single cloud VPC quickly?",o:["Site-to-site IPsec VPN, often with BGP over the tunnel","GETVPN with the VPC as a group member","VPLS from the data center to the VPC","Metro Ethernet E-LAN extended to the cloud provider"],a:[0],e:"Cloud providers offer managed VPN gateways supporting IKEv2 and BGP."},
{id:"c66",d:3,q:"Which cloud connectivity option provides private, dedicated bandwidth to a cloud provider?",o:["AWS Direct Connect or Azure ExpressRoute","Internet IPsec VPN to the cloud gateway","LTE connections from each branch","Consumer broadband at the data center"],a:[0],e:"Dedicated interconnects avoid the internet and give predictable performance, often via a colocation or carrier."},
{id:"c67",d:3,q:"What is a colocation-based cloud on-ramp (carrier-neutral facility) used for in WAN design?",o:["Terminating private links to many cloud providers and SaaS close to their edges","Hosting all user PCs in one facility so they sit close to the cloud services they use","Replacing MPLS completely by moving every branch into the facility","Providing Wi-Fi to branch users through the carrier's facility"],a:[0],e:"A regional hub in a colo can reach multiple clouds with low latency and aggregate branch traffic."},
{id:"c68",d:3,q:"In an MPLS L3VPN, which device is the provider edge router connected to the customer?",o:["PE","P","CE","RR"],a:[0],e:"CE is the customer router, PE is the provider edge with VRFs, and P routers are core label switches with no customer routes."},
{id:"c69",d:3,q:"Why do enterprises often choose eBGP as the PE-CE routing protocol?",o:["It scales, gives policy control, and every provider supports it","It's the only PE-CE protocol that providers allow on any L3VPN","It needs no configuration once the provider turns it on","It converges faster than static routes in every case"],a:[0],e:"eBGP gives clear separation, rich policy (communities, local preference), and handles multihoming well."},
{id:"c70",d:3,q:"An enterprise uses the same private AS at every site over an MPLS L3VPN with eBGP. What issue occurs and what fixes it?",o:["Sites drop each other's routes due to AS-path loop checks; use allowas-in or as-override","Routes are accepted normally, because MPLS VPNs ignore the AS path entirely at the PE","OSPF must be used instead because eBGP can't run with private AS numbers","The provider must put each site in a different VRF to keep routes apart"],a:[0],e:"A CE sees its own AS in the path and rejects the route. as-override (PE) or allowas-in (CE) solves it."},
{id:"c71",d:3,q:"What is the 'site of origin' (SoO) extended community used for in MPLS VPN designs?",o:["Preventing loops at multihomed sites with backdoor links or as-override","Choosing the best PE router when a site connects to more than one PE","Encrypting VPN routes between the PE routers in the provider core","Setting MED values so inbound traffic prefers a specific PE"],a:[0],e:"SoO marks routes with their origin site so they aren't re-advertised back into that same site."},
