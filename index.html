{id:"d83",d:4,q:"Where should NetFlow typically be enabled for broad visibility without duplicate records?",o:["Ingress on key aggregation points like the WAN edge, distribution, and DC edge","On every interface in both directions","Only on access ports","Only on loopbacks"],a:[0],e:"Ingress-only on chosen interfaces avoids double counting. Sampled NetFlow reduces load on high-speed links."},
{id:"d84",d:4,q:"What does IPFIX offer over NetFlow v5?",o:["Template-based flexible fields including IPv6 and variable-length data, as an IETF standard","Fixed seven-field records","Only IPv4","No export"],a:[0],e:"IPFIX (based on v9) lets exporters define custom records."},
{id:"d85",d:4,q:"Which tool would you use to continuously measure jitter between a branch and HQ for voice SLA reporting?",o:["IP SLA UDP jitter (or SD-WAN BFD metrics)","Ping once a day","Syslog","CDP"],a:[0],e:"Continuous synthetic probes show trends and SLA compliance."},
{id:"d86",d:4,q:"What is the recommended logging design for network devices?",o:["Send logs to central syslog/SIEM with synced time, and keep a local buffer","Only use console logging","Disable logging to save CPU","Log only at debug level everywhere"],a:[0],e:"Central collection allows correlation and retention. Choose severities that balance noise and value."},
{id:"d87",d:4,q:"Which first hop redundancy protocol is the best choice for IPv6 and multi-vendor environments?",o:["VRRPv3","HSRPv1","GLBP for IPv4 only","Proxy ARP"],a:[0],e:"VRRPv3 supports IPv4 and IPv6 and is an open standard. HSRPv2 also supports IPv6 but is Cisco-only."},
{id:"d88",d:4,q:"In GLBP, what does the active virtual gateway (AVG) do?",o:["Answers ARP requests with different virtual MACs to spread hosts across forwarders","Forwards all traffic","Runs the routing protocol","Assigns IP addresses"],a:[0],e:"Up to four AVFs forward traffic. The AVG assigns MACs and responds to ARP using a load balancing method (round robin by default)."},
{id:"d89",d:4,q:"Why is GLBP rarely used in modern campus designs with StackWise Virtual or routed access?",o:["Those designs already provide active/active forwarding or don't need an FHRP","GLBP doesn't work with IPv4","GLBP needs MPLS","GLBP is an open standard"],a:[0],e:"With MEC/StackWise Virtual there is one logical gateway. Routed access puts the gateway on the access switch."},
{id:"d90",d:4,q:"Which HSRP timers give subsecond failover?",o:["Millisecond hello/hold timers (for example 250 ms / 750 ms) or HSRP with BFD","Default 3 s / 10 s","30 s / 90 s","Disabling hello"],a:[0],e:"Fast timers increase CPU use. BFD is lighter for fast detection."},
{id:"d91",d:4,q:"What NAT design consideration applies when an internal server is reachable from the internet?",o:["Static NAT or port forwarding plus firewall rules, often in a DMZ","PAT with overload only","No NAT needed with private addresses","NAT64"],a:[0],e:"Inbound access needs a fixed mapping. Place public-facing servers in a DMZ to limit exposure."},
{id:"d92",d:4,q:"Why is NAT generally avoided with IPv6?",o:["Global addresses give end-to-end connectivity; security comes from firewalls instead of address hiding","IPv6 can't support NAT","NAT is required for IPv6","IPv6 has no global addresses"],a:[0],e:"NPTv6 exists for some multihoming cases, but the norm is stateful firewalling without translation."},
{id:"d93",d:4,q:"What is a common design choice for scalable PAT at a large enterprise internet edge?",o:["A pool of public addresses with PAT, sized for concurrent sessions","One public IP for 50,000 users","Static NAT for every user","No NAT"],a:[0],e:"Each public IP supports about 64,000 ports per destination. Large user counts need multiple IPs."},
{id:"d94",d:4,q:"Which service lets switches and routers share neighbor and device information in multi-vendor networks?",o:["LLDP","CDP","VTP","DTP"],a:[0],e:"LLDP (802.1AB) is the open standard. LLDP-MED adds voice VLAN and PoE info for endpoints."},
{id:"d95",d:4,q:"What does LLDP-MED provide to IP phones?",o:["Voice VLAN, QoS, and power information","IP addresses","Firmware images","Encryption keys"],a:[0],e:"Phones learn their voice VLAN and markings, and switches learn power needs."},
{id:"d96",d:4,q:"Which DSCP should be used to mark traffic from an untrusted endpoint you don't recognize?",o:["Default (DSCP 0, best effort)","EF","CS6","AF41"],a:[0],e:"Untrusted traffic is re-marked to 0 unless a classifier identifies it as something else."},
{id:"d97",d:4,q:"Why should routing protocols be marked CS6 and protected in queuing?",o:["So control traffic isn't dropped during congestion, which would cause adjacencies to drop","To slow them down","To encrypt them","Because CS6 is scavenger"],a:[0],e:"Routers often prioritize locally generated control traffic internally, but marking and queuing on the path keeps it safe."},
{id:"d98",d:4,q:"What should be considered when designing QoS for encrypted tunnels?",o:["Copy the inner DSCP to the outer header (default for IPsec/GRE) and use qos pre-classify if classifying on inner fields","Encryption removes the need for QoS","QoS can't work with tunnels","All tunnel traffic gets EF"],a:[0],e:"ToS is copied by default, but ACL-based classification on inner IPs needs pre-classify on older platforms."},
{id:"d99",d:4,q:"Which statement about IP SLA and object tracking in a design is correct?",o:["Tracking can adjust HSRP priority, remove static routes, or trigger PBR changes when a probe fails","Tracking only sends syslog","IP SLA replaces routing protocols","Tracking only works on IPv6"],a:[0],e:"This gives policy-driven failover for paths that routing protocols can't monitor end to end."},
{id:"d100",d:4,q:"In multicast design, which IGMP setting helps quickly stop forwarding when the last receiver leaves a port?",o:["IGMP snooping immediate leave (fast-leave) on ports with a single host","IGMPv1","Long query intervals","PIM dense mode"],a:[0],e:"Immediate leave removes the port right after a leave message, which suits IPTV set-top box ports."},
// ---------- Domain 5 (expanded) ----------
{id:"e26",d:5,q:"Which NETCONF capability allows a change to be rolled back automatically if it isn't confirmed within a timeout?",o:["Confirmed commit","Writable running","Startup","XPath"],a:[0],e:"Confirmed commit protects against changes that cut off management access: if you can't confirm, the device reverts."},
{id:"e27",d:5,q:"Which NETCONF operation checks a candidate configuration for errors before committing?",o:["<validate>","<lock>","<get>","<kill-session>"],a:[0],e:"Validate catches syntax and semantic errors in the candidate before it becomes running."},
{id:"e28",d:5,q:"What is the purpose of the NETCONF <lock> operation in automation design?",o:["Prevent other sessions from changing the datastore during a multi-step change","Encrypt the session","Speed up commits","Delete the config"],a:[0],e:"Lock, edit, validate, commit, unlock is a safe pattern for transactional changes."},
{id:"e29",d:5,q:"Which YANG statement defines a reusable group of nodes that can be included elsewhere with 'uses'?",o:["grouping","container","typedef","augment"],a:[0],e:"Groupings avoid repetition. typedef defines a reusable type. augment adds nodes to another module."},
{id:"e30",d:5,q:"What does the YANG 'augment' statement do?",o:["Adds nodes into another module's data tree, for example vendor extensions to a standard model","Deletes nodes","Defines a list key","Imports Python code"],a:[0],e:"Vendors augment IETF or OpenConfig models with platform-specific features."},
{id:"e31",d:5,q:"What does 'config false' mean in a YANG model?",o:["The node is operational state data that can be read but not configured","The node is disabled","The node is required","The node is a list key"],a:[0],e:"State data like counters and oper-status is config false."},
{id:"e32",d:5,q:"Which tool lets you browse YANG models and generate sample NETCONF/RESTCONF requests from them?",o:["YANG Suite (or pyang)","Wireshark","Excel","Telnet"],a:[0],e:"Cisco YANG Suite explores models, builds RPCs, and tests against devices. pyang validates and displays model trees."},
{id:"e33",d:5,q:"What does a RESTCONF PUT do compared with POST?",o:["PUT creates or replaces the target resource; POST creates a new child resource and fails if it exists","PUT deletes; POST reads","They are identical","PUT merges; POST replaces"],a:[0],e:"PATCH merges. PUT replaces. POST creates. DELETE removes."},
{id:"e34",d:5,q:"Which HTTP header tells a RESTCONF server you want JSON responses?",o:["Accept: application/yang-data+json","Content-Length","Authorization: Bearer json","X-Format: json"],a:[0],e:"Content-Type describes what you send. Accept describes what you want back."},
{id:"e35",d:5,q:"Which telemetry subscription type sends data only when a value changes?",o:["On-change","Periodic","Polling","Batch"],a:[0],e:"On-change suits state like interface status. Periodic suits counters like bytes and CPU."},
{id:"e36",d:5,q:"In dial-in telemetry, who starts the session?",o:["The collector connects to the device and subscribes","The device connects to the collector","SNMP traps start it","Syslog starts it"],a:[0],e:"Dial-in (for example gNMI Subscribe) is collector-initiated. Dial-out is configured on the device, which connects to receivers."},
{id:"e37",d:5,q:"Which encoding is most efficient for streaming telemetry?",o:["Protocol Buffers (GPB) over gRPC","XML over SSH","CSV over email","Plain text syslog"],a:[0],e:"Binary protobuf encoding is compact and fast. JSON is easier to read but larger."},
{id:"e38",d:5,q:"What is a source of truth (SoT) in network automation design?",o:["An authoritative system (like NetBox or Nautobot) holding the intended network state that automation reads from","The running config on each device","A spreadsheet on one engineer's laptop","Syslog"],a:[0],e:"Automation renders configs from intended data in the SoT, then compares to the actual state to find drift."},
{id:"e39",d:5,q:"What is configuration drift?",o:["Differences between the intended configuration and what is actually running on devices","Clock differences between devices","Packet loss","Route flapping"],a:[0],e:"Manual changes cause drift. Automation and compliance checks detect and remediate it."},
{id:"e40",d:5,q:"What is the benefit of a CI/CD pipeline for network changes?",o:["Automated testing and validation (lint, simulate, verify) before and after deploying changes","No version history","Manual approvals only","Faster typing"],a:[0],e:"Pipelines add repeatable checks, peer review, and rollback, reducing human errors."},
{id:"e41",d:5,q:"What is a network digital twin used for in automation design?",o:["Testing changes in a virtual copy of the network before production","Backing up configs","Monitoring Wi-Fi","Running DHCP"],a:[0],e:"Tools like Cisco Modeling Labs or vendor twins let you validate changes against realistic topology and configs."},
{id:"e42",d:5,q:"Which Ansible feature allows parameterized, reusable groups of tasks shared across playbooks?",o:["Roles","Inventory","Facts","Handlers only"],a:[0],e:"Roles package tasks, variables, templates, and handlers in a standard structure."},
{id:"e43",d:5,q:"Which Ansible network modules apply structured config like VLANs or interfaces declaratively, with states like merged and replaced?",o:["Resource modules (for example cisco.ios.ios_vlans)","Raw command module","Shell module","Ping module"],a:[0],e:"Resource modules take structured data and are idempotent. States: merged, replaced, overridden, deleted, gathered, rendered."},
{id:"e44",d:5,q:"What is Terraform mainly used for in network and cloud automation?",o:["Declarative infrastructure provisioning with state tracking, for example cloud VPCs or controller objects","Packet capture","Device CLI scraping","Wireless site surveys"],a:[0],e:"Terraform uses providers (AWS, Azure, Catalyst Center, ACI) and keeps a state file to plan and apply changes."},
{id:"e45",d:5,q:"What is a key difference between declarative and imperative automation?",o:["Declarative defines the end state; imperative defines the exact steps to get there","Imperative defines only the end state","Declarative needs CLI commands in order","They're the same"],a:[0],e:"Declarative tools (Terraform, resource modules, controllers) compute the needed changes. Imperative scripts run commands in sequence."},
{id:"e46",d:5,q:"Which Catalyst Center API category provides network health, issues, and client data for external dashboards?",o:["Intent API (Know Your Network / Assurance)","Southbound SNMP","PnP only","Command Runner only"],a:[0],e:"Intent APIs expose sites, devices, health, issues, and clients for integration."},
{id:"e47",d:5,q:"What does the Catalyst Center 'Command Runner' API allow?",o:["Running read-only show commands on many devices and collecting output","Pushing any config without templates","Rebooting all devices","Changing the Catalyst Center password"],a:[0],e:"Command Runner is useful for inventory and audits at scale."},
{id:"e48",d:5,q:"Which interface lets ITSM tools like ServiceNow receive Catalyst Center events and approvals?",o:["Integration with webhooks/events and ITSM bundles","SNMP traps only","Direct CLI access","CDP"],a:[0],e:"Catalyst Center can open tickets for issues and require ITSM approval for changes."},
{id:"e49",d:5,q:"What is a common design pattern for safe automation at scale?",o:["Roll out in stages (canary devices first), with pre-checks, post-checks, and automatic rollback","Push changes to all devices at once without checks","Only use manual changes","Disable logging during changes"],a:[0],e:"Staged rollouts limit the blast radius if something goes wrong."},
{id:"e50",d:5,q:"Which protocol is used by gNMI and model-driven telemetry for efficient transport?",o:["gRPC over HTTP/2","SNMP over UDP","Telnet","FTP"],a:[0],e:"gRPC uses HTTP/2 multiplexing and protobuf encoding. gNMI defines Capabilities, Get, Set, and Subscribe."}
];

// ---------- storage (fail-safe) ----------
const KEY="ensld-practice-v1", SKEY="ensld-session-v1";
let mem = {stats:{}, exams:[], size:10};
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const p=JSON.parse(r); mem={stats:p.stats||{},exams:p.exams||[],size:p.size||10}; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }
function saveSession(){ try{ if(S) localStorage.setItem(SKEY, JSON.stringify(S)); else localStorage.removeItem(SKEY);}catch(e){} }
function loadSession(){ try{ const r=localStorage.getItem(SKEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
load();

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCDEFGH";
const qhtml=s=>{const k=s.indexOf("\n\n"); return k<0?esc(s):esc(s.slice(0,k))+`<pre class="code">${esc(s.slice(k+2))}</pre>`;};
function record(id, ok){ const s=mem.stats[id]||{s:0,c:0,w:false}; s.s++; if(ok)s.c++; s.w=!ok; mem.stats[id]=s; }
function missedIds(){ return BANK.filter(q=>mem.stats[q.id]&&mem.stats[q.id].w).map(q=>q.id); }
function domainStats(d){ let s=0,c=0,seen=0; BANK.filter(q=>q.d==d).forEach(q=>{const t=mem.stats[q.id]; if(t){s+=t.s;c+=t.c;seen++;}}); return {pct:s?Math.round(c/s*100):null,seen,total:BANK.filter(q=>q.d==d).length}; }
function pick(ids){
  const n=mem.size||ids.length;
  const score=id=>{const t=mem.stats[id]; if(!t) return 0; if(t.w) return 1; return 2+t.c/t.s;};
  return shuffle(ids).sort((a,b)=>score(a)-score(b)).slice(0,n);
}
function makeItem(id){ return {id, order:shuffle(byId[id].o.map((_,i)=>i))}; }
function isRight(id, sel){ const a=byId[id].a; return sel && sel.length===a.length && a.every(x=>sel.includes(x)); }

let S=null; // active session
let timerH=null;

// ---------- start modes ----------
function startExam(){
  let ids=[];
  for(const d in DOMAINS){ ids=ids.concat(shuffle(BANK.filter(q=>q.d==d).map(q=>q.id)).slice(0,DOMAINS[d].n)); }
  ids=shuffle(ids);
  S={mode:"exam",items:ids.map(makeItem),i:0,ans:{},flags:{},checked:{},endAt:Date.now()+90*60*1000,title:"Full exam"};
  saveSession(); render();
}
function startPractice(ids,title,kind){
  if(!ids.length){ showModal("Nothing to practice here yet.",[["OK",closeModal]]); return; }
  S={mode:"practice",items:shuffle(ids).map(makeItem),i:0,ans:{},flags:{},checked:{},title,kind:kind||null};
  saveSession(); render();
}
function quick(){ startPractice(pick(BANK.map(q=>q.id)),"Quick practice",{t:"quick"}); }
function drill(d){ startPractice(pick(BANK.filter(q=>q.d==d).map(q=>q.id)),DOMAINS[d].name,{t:"drill",d}); }
function missed(){ startPractice(pick(missedIds()),"Missed questions",{t:"missed"}); }
function nextSet(k){ S=null; if(k.t==="drill") drill(k.d); else if(k.t==="missed") missed(); else quick(); }
const SIZES=[10,20,50,0];
const sizeLbl=n=>n?String(n):"All";

// ---------- modal ----------
function showModal(msg,btns){
  $("#modal").innerHTML=`<div class="modal"><div class="card"><p>${msg}</p><div class="row" style="justify-content:flex-end">${btns.map((b,i)=>`<button data-i="${i}" class="${i===btns.length-1?'primary':''}">${b[0]}</button>`).join("")}</div></div></div>`;
  $("#modal").querySelectorAll("button").forEach(b=>b.onclick=()=>btns[+b.dataset.i][1]());
}
function closeModal(){ $("#modal").innerHTML=""; }

// ---------- render ----------
function render(){
  clearInterval(timerH);
  if(!S) return renderHome();
  if(S.done) return renderResults();
  renderQuestion();
}

function renderHome(){
  const m=missedIds().length;
  const last=mem.exams.slice(-5).reverse();
  $("#app").innerHTML=`
  <h1>ENSLD 300-420 Practice</h1>
  <p class="sub">Designing Cisco Enterprise Networks v1.1 &middot; ${BANK.length} questions &middot; weighted to Cisco's blueprint</p>
  <div class="grid">
    <button class="big primary" id="bExam"><b>Full practice exam</b><span style="color:inherit;opacity:.85">60 questions &middot; 90 min timer &middot; scored at the end</span></button>
    <button class="big" id="bQuick"><b>Quick practice</b><span>${mem.size?mem.size+" questions":"Every question"}, unseen first, answers shown as you go</span></button>
    <button class="big" id="bMiss" ${m?"":"disabled"}><b>Missed questions</b><span>${m} to review${m&&mem.size&&m>mem.size?" &middot; "+mem.size+" at a time":""}</span></button>
  </div>
  <h2>Questions per practice session</h2>
  <div class="card"><div class="chips" id="sizes">${SIZES.map(n=>`<button data-n="${n}" class="${(mem.size||0)===n?'on':''}">${sizeLbl(n)}</button>`).join("")}</div>
  <p class="note" style="margin-bottom:0">Applies to quick practice, domain drills, and missed questions. Questions you haven't seen come first, then ones you missed.</p></div>
  <h2>Drill a domain</h2>
  <div class="card">${Object.entries(DOMAINS).map(([d,x])=>{const st=domainStats(d);return `
    <div class="dom"><div class="lbl"><span><a href="#" data-d="${d}">${d}.0 ${x.name}</a> <span class="tag">${x.w}%</span></span><span class="muted">${st.pct===null?"not started":st.pct+"% &middot; "+st.seen+"/"+st.total+" seen"}</span></div>
    <div class="bar"><i style="width:${st.pct||0}%"></i></div></div>`}).join("")}
    <p class="note">Tap a domain to drill ${mem.size?mem.size+" questions":"every question"} from it.</p>
  </div>
  ${last.length?`<h2>Recent exams</h2><div class="card">${last.map(x=>`<div class="row small"><span>${new Date(x.t).toLocaleDateString()}</span><span class="spacer"></span><b class="${x.p>=80?'pass':'fail'}">${x.p}%</b><span class="muted">${x.c}/${x.n}</span></div>`).join("")}</div>`:""}
  <h2>Your data</h2>
  <div class="card small">
    <p class="muted" style="margin-top:0">Progress saves in this browser only. Copy a backup now and then so you don't lose it.</p>
    <div class="row"><button id="bBackup">Backup / restore</button><button id="bReset">Reset stats</button></div>
  </div>
  <p class="note">Cisco doesn't publish a pass mark. Aim for 80%+ here before booking. Questions are original study material, not exam dumps.</p>`;
  document.querySelectorAll("#sizes [data-n]").forEach(b=>b.onclick=()=>{mem.size=+b.dataset.n;save();render();});
  $("#bExam").onclick=startExam; $("#bQuick").onclick=quick; $("#bMiss").onclick=missed;
  document.querySelectorAll("[data-d]").forEach(a=>a.onclick=e=>{e.preventDefault();drill(a.dataset.d);});
  $("#bBackup").onclick=renderBackup;
  $("#bReset").onclick=()=>showModal("Clear all stats and exam history?",[["Cancel",closeModal],["Clear",()=>{mem={stats:{},exams:[],size:mem.size};save();closeModal();render();}]]);
}

function renderBackup(){
  $("#app").innerHTML=`
  <div class="top"><button id="bBack">&larr; Back</button><b>Backup / restore</b></div>
  <div class="card"><b>Backup</b><p class="small muted">Copy this text and keep it somewhere (notes app, email to yourself).</p>
  <textarea id="out" readonly>${esc(JSON.stringify(mem))}</textarea>
  <div class="row"><button id="bCopy" class="primary">Copy</button><span id="cmsg" class="small muted"></span></div></div>
  <div class="card"><b>Restore</b><p class="small muted">Paste a backup here. This replaces your current stats.</p>
  <textarea id="in" placeholder="Paste backup text"></textarea>
  <div class="row"><button id="bRestore" class="primary">Restore</button><span id="rmsg" class="small"></span></div></div>`;
  $("#bBack").onclick=render;
  $("#bCopy").onclick=async()=>{ const t=$("#out"); try{ await navigator.clipboard.writeText(t.value); $("#cmsg").textContent="Copied."; }catch(e){ t.select(); $("#cmsg").textContent="Selected. Copy it manually."; } };
  $("#bRestore").onclick=()=>{ try{ const p=JSON.parse($("#in").value); if(!p||typeof p.stats!=="object") throw 0; mem={stats:p.stats,exams:p.exams||[],size:p.size||mem.size||10}; save(); $("#rmsg").textContent="Restored."; $("#rmsg").className="small pass"; }catch(e){ $("#rmsg").textContent="That doesn't look like a valid backup."; $("#rmsg").className="small fail"; } };
}

function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return m+":"+String(s).padStart(2,"0"); }

function renderQuestion(){
  const it=S.items[S.i], q=byId[it.id], sel=S.ans[S.i]||[], multi=q.a.length>1, checked=S.checked[S.i];
  const exam=S.mode==="exam";
  const answered=Object.keys(S.ans).filter(k=>S.ans[k]&&S.ans[k].length).length;
  $("#app").innerHTML=`
  <div class="top">
    <button id="bQuit">&times;</button>
    <span class="small"><b>${S.i+1}</b> / ${S.items.length}</span>
    <span class="spacer"></span>
    ${exam?`<span class="timer" id="tmr"></span>`:`<span class="small muted">${esc(S.title)}</span>`}
  </div>
  <span class="tag">${q.d}.0 ${DOMAINS[q.d].name}</span> ${multi?`<span class="tag">Choose ${q.a.length}</span>`:""}
  <div class="qtext">${qhtml(q.q)}</div>
  <div id="opts">${it.order.map((oi,k)=>{
    let cls="opt";
    if(sel.includes(oi)) cls+=" sel";
    if(checked){ if(q.a.includes(oi)) cls+=" right"; else if(sel.includes(oi)) cls+=" wrong"; }
    return `<button class="${cls}" data-oi="${oi}" ${checked?"disabled":""}><span class="k">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`;}).join("")}</div>
  ${checked?`<div class="explain"><span class="verdict ${isRight(it.id,sel)?'ok':'no'}">${isRight(it.id,sel)?"Correct.":"Not quite."}</span> ${esc(q.e)}</div>`:""}
  <div class="row" style="margin-top:14px">
    ${exam?`<button id="bPrev" ${S.i?"":"disabled"}>Prev</button><button id="bFlag">${S.flags[S.i]?"Unflag":"Flag"}</button><span class="spacer"></span>
      ${S.i<S.items.length-1?`<button id="bNext" class="primary">Next</button>`:`<button id="bSubmit" class="primary">Submit exam</button>`}`
    :`${Object.keys(S.checked).length?`<button id="bEnd">End &amp; score</button>`:""}<span class="spacer"></span>${checked?(S.i<S.items.length-1?`<button id="bNext" class="primary">Next</button>`:`<button id="bFinish" class="primary">Finish</button>`):`<button id="bCheck" class="primary" ${sel.length===q.a.length?"":"disabled"}>Check</button>`}`}
  </div>
  ${exam?`<div class="card small"><div class="row"><span class="muted">${answered} answered &middot; ${Object.values(S.flags).filter(Boolean).length} flagged</span><span class="spacer"></span><button id="bSub2">Submit</button></div>
    <div class="nav">${S.items.map((_,k)=>`<button data-j="${k}" class="${(S.ans[k]&&S.ans[k].length)?'ans':''} ${k===S.i?'cur':''} ${S.flags[k]?'fl':''}">${k+1}${S.flags[k]?"*":""}</button>`).join("")}</div></div>`:""}
  `;
  $("#bQuit").onclick=()=>showModal(exam?"Leave this exam? Progress on it will be lost.":"End this practice session?",[["Stay",closeModal],["Leave",()=>{S=null;saveSession();closeModal();render();}]]);
  if(!checked) document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi; let cur=(S.ans[S.i]||[]).slice();
    if(multi){ cur=cur.includes(oi)?cur.filter(x=>x!==oi):(cur.length<q.a.length?[...cur,oi]:cur); } else cur=[oi];
    S.ans[S.i]=cur; saveSession(); renderQuestion();
  });
  const go=j=>{S.i=j;saveSession();renderQuestion();window.scrollTo(0,0);};
  if($("#bNext")) $("#bNext").onclick=()=>go(S.i+1);
  if($("#bPrev")) $("#bPrev").onclick=()=>go(S.i-1);
  if($("#bFlag")) $("#bFlag").onclick=()=>{S.flags[S.i]=!S.flags[S.i];saveSession();renderQuestion();};
  if($("#bCheck")) $("#bCheck").onclick=()=>{S.checked[S.i]=true; record(it.id,isRight(it.id,sel)); save(); saveSession(); renderQuestion();};
  if($("#bFinish")) $("#bFinish").onclick=finish;
  if($("#bEnd")) $("#bEnd").onclick=finish;
  const sub=()=>{ const un=S.items.length-answered; showModal(un?`${un} question${un>1?"s are":" is"} unanswered. Submit anyway?`:"Submit your exam?",[["Keep going",closeModal],["Submit",()=>{closeModal();finish();}]]); };
  if($("#bSubmit")) $("#bSubmit").onclick=sub;
  if($("#bSub2")) $("#bSub2").onclick=sub;
  document.querySelectorAll(".nav [data-j]").forEach(b=>b.onclick=()=>go(+b.dataset.j));
  if(exam){
    const tick=()=>{ const left=S.endAt-Date.now(); const t=$("#tmr"); if(t){ t.textContent=fmt(left); t.classList.toggle("low",left<5*60000);} if(left<=0){ clearInterval(timerH); finish(); } };
    tick(); timerH=setInterval(tick,1000);
  }
}

function finish(){
  clearInterval(timerH);
  const per={}; let c=0;
  S.items.forEach((it,k)=>{
    const q=byId[it.id], ok=isRight(it.id,S.ans[k]);
    if(S.mode==="exam") record(it.id,ok);
    else if(!S.checked[k]) return;
    per[q.d]=per[q.d]||{c:0,n:0}; per[q.d].n++; if(ok){per[q.d].c++;c++;}
  });
  const n=Object.values(per).reduce((a,b)=>a+b.n,0);
  S.result={c,n,p:n?Math.round(c/n*100):0,per};
  if(S.mode==="exam") mem.exams.push({t:Date.now(),c,n,p:S.result.p});
  save(); S.done=true; saveSession(); render(); window.scrollTo(0,0);
}

function renderResults(){
  const r=S.result; let wrongOnly=S.wrongOnly??true;
  const list=S.items.map((it,k)=>({it,k})).filter(({it,k})=>S.mode==="exam"||S.checked[k]).filter(({it,k})=>!wrongOnly||!isRight(it.id,S.ans[k]));
  $("#app").innerHTML=`
  <div class="top"><button id="bHome">&larr; Home</button><b>${esc(S.title)} results</b></div>
  <div class="card"><p class="score ${r.p>=80?'pass':'fail'}">${r.p}%</p><p class="muted" style="margin:0">${r.c} of ${r.n} correct${S.mode==="exam"?" &middot; target 80%+":""}</p></div>
  <div class="card">${Object.entries(r.per).sort().map(([d,x])=>{const p=Math.round(x.c/x.n*100);return `
    <div class="dom"><div class="lbl"><span>${d}.0 ${DOMAINS[d].name}</span><span class="${p>=80?'pass':'fail'}">${x.c}/${x.n} &middot; ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
  <div class="row"><h2 style="margin:12px 0">Review</h2><span class="spacer"></span><button id="bToggle">${wrongOnly?"Show all":"Show missed only"}</button></div>
  <div class="card">${list.length?list.map(({it,k})=>{const q=byId[it.id], sel=S.ans[k]||[], ok=isRight(it.id,sel);
    return `<div class="rev"><div class="small muted">Q${k+1} &middot; ${q.d}.0 ${DOMAINS[q.d].name}</div>
    <div style="margin:4px 0 6px;font-weight:700;white-space:pre-wrap">${qhtml(q.q)}</div>
    <div class="small">Your answer: <span class="${ok?'pass':'fail'}">${sel.length?sel.map(i=>esc(q.o[i])).join("; "):"(none)"}</span></div>
    ${ok?"":`<div class="small">Correct: <span class="pass">${q.a.map(i=>esc(q.o[i])).join("; ")}</span></div>`}
    <div class="small muted" style="margin-top:4px">${esc(q.e)}</div></div>`}).join(""):`<p class="muted">Nothing missed. Nice.</p>`}</div>
  <div class="row">${S.kind?`<button id="bNextSet" class="primary">Next ${mem.size||"set"}</button><button id="bAgain">Retry these</button>`:`<button id="bAgain" class="primary">${S.mode==="exam"?"New exam":"Practice again"}</button>`}</div>`;
  if($("#bNextSet")) $("#bNextSet").onclick=()=>nextSet(S.kind);
  $("#bHome").onclick=()=>{S=null;saveSession();render();};
  $("#bToggle").onclick=()=>{S.wrongOnly=!wrongOnly;renderResults();};
  $("#bAgain").onclick=()=>{ const m=S.mode, ids=S.items.map(i=>i.id), t=S.title, k=S.kind; S=null; if(m==="exam") startExam(); else startPractice(ids,t,k); };
}

// resume an in-progress session after refresh
S=loadSession();
if(S && S.mode==="exam" && !S.done && Date.now()>S.endAt){ finish(); }
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
