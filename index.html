{id:"c72",d:3,q:"When OSPF is used PE-CE and a site has a backdoor link, what makes the MPLS path preferred?",o:["A sham link between the PEs so the MPLS path appears intra-area","A higher cost on the backdoor link, with no other changes","E2 external routes for all prefixes learned over MPLS","A stub area on both sites so only a default is learned"],a:[0],e:"Without a sham link, routes through MPLS appear as inter-area (Type 3) and the backdoor intra-area path always wins."},
{id:"c73",d:3,q:"How many DSCP-based QoS classes do MPLS providers typically offer customers?",o:["Usually 4 to 6 classes","All 64 DSCP values","A single best-effort class","More than 100 classes"],a:[0],e:"Enterprise 8 or 12-class models must be mapped into the provider's smaller set at the CE."},
{id:"c74",d:3,q:"What is a key WAN QoS design rule for the CE router?",o:["Shape to the contracted rate, queue below it, and map classes to the provider's","Police inbound only, and leave egress traffic for the provider to handle","Trust the provider to queue traffic based on the enterprise's own 12-class markings","Use FIFO on the WAN interface, since the provider handles all priority"],a:[0],e:"Without shaping, the provider polices and drops traffic randomly. Shaping makes your own queuing decide what drops."},
{id:"c75",d:3,q:"What is hierarchical QoS (HQoS) at the WAN edge?",o:["A parent shaper at the sub-rate with a child queuing policy inside it","Queuing applied on every hop inside the provider's network","QoS applied only on LAN switches, not on WAN routers","Marking traffic at the access layer before it ever reaches the WAN"],a:[0],e:"The parent shaper creates backpressure so the child policy's priority and bandwidth queues work at the contracted rate."},
{id:"c76",d:3,q:"Which Metro Ethernet service is multipoint-to-multipoint like a LAN?",o:["E-LAN","E-Line","E-Tree","E-Access"],a:[0],e:"E-Line is point-to-point, E-LAN is any-to-any, E-Tree is rooted multipoint (hub-spoke), per MEF definitions."},
{id:"c77",d:3,q:"Which Metro Ethernet service lets leaves talk to a root but not to each other?",o:["E-Tree","E-LAN","E-Line","EPL"],a:[0],e:"E-Tree suits hub-and-spoke designs like franchises connecting to HQ."},
{id:"c78",d:3,q:"What is the difference between EPL and EVPL?",o:["EPL uses the whole port; EVPL multiplexes several services on one port by VLAN","EPL is multipoint between many sites; EVPL is point-to-point between two","EPL runs over fiber; EVPL runs over licensed wireless links between sites","They're identical services that different carriers simply choose to name differently"],a:[0],e:"Ethernet Private Line dedicates the UNI. Ethernet Virtual Private Line uses VLANs to carry multiple EVCs."},
{id:"c79",d:3,q:"What routing behavior applies when an enterprise uses a Layer 2 VPLS service between sites?",o:["Routers at each site share a subnet and form IGP adjacencies directly","The provider runs the enterprise's routing protocol on its PE routers","Routing isn't possible, so every site must use static default routes","BGP is required between each site and the provider's PE routers"],a:[0],e:"VPLS acts like one big switch. All CE routers become neighbors, so watch scaling with many sites."},
{id:"c80",d:3,q:"What does EVPN add compared with VPLS?",o:["A BGP control plane for MAC learning, with all-active multihoming and less flooding","Built-in encryption of all customer traffic between the provider's PE routers","Lower latency fiber paths, since EVPN uses dedicated wavelengths","A Layer 1 service that carries any protocol transparently between sites"],a:[0],e:"EVPN advertises MAC/IP routes via BGP instead of flood-and-learn, and supports active/active links."},
{id:"c81",d:3,q:"A branch with one router and one WAN circuit is which redundancy level?",o:["Single-homed, no redundancy","Dual-homed","Dual router, dual link, dual carrier","Fully meshed"],a:[0],e:"Options in increasing availability: single router/single link, single router/dual links, dual routers/dual links."},
{id:"c82",d:3,q:"For a branch with two routers and two WAN links, how do LAN hosts get a redundant gateway?",o:["An FHRP (HSRP, VRRP or GLBP) on the LAN side, tracking the WAN","Each host configured with two default gateways in DHCP","STP blocking one router's LAN port until the other router fails","DHCP option 43 pointing hosts to the active router"],a:[0],e:"Tracking WAN health lowers FHRP priority on the router whose WAN fails."},
{id:"c83",d:3,q:"Which branch design uses TLOC extension in Catalyst SD-WAN?",o:["Two edges with one transport each, linked so each can use the other's circuit","One edge with two circuits that share the same TLOC color on both links","A branch with no WAN circuit that reaches the overlay through another site","A branch with only an LTE circuit that needs a backup over another branch"],a:[0],e:"TLOC extension links the two edges so both can build tunnels over both transports."},
{id:"c84",d:3,q:"Which availability approach gives the fastest WAN failover?",o:["Active/active links with BFD-driven routing or SD-WAN tunnels","Manual cutover by the operations team after an alert","Static routes without any tracking toward the primary link","Waiting for the default 180-second BGP hold timer"],a:[0],e:"Fast detection plus already-established backup paths gives sub-second to a few seconds of failover."},
{id:"c85",d:3,q:"Why tune BGP timers or use BFD on WAN links to the ISP?",o:["The default 180-second hold time is too slow for many failover needs","To increase the number of routes the ISP is allowed to send","To change the local preference of all routes learned from the ISP","To encrypt BGP updates exchanged with the ISP's router"],a:[0],e:"Lower keepalive/hold (for example 10/30) or BFD with fall-over detects failures faster."},
{id:"c86",d:3,q:"What does availability of 99.99% mean in downtime per year?",o:["About 52.6 minutes","About 5.26 minutes","About 8.76 hours","About 3.65 days"],a:[0],e:"99.9% ≈ 8.76 h, 99.99% ≈ 52.6 min, 99.999% ≈ 5.26 min per year."},
{id:"c87",d:3,q:"Two independent WAN links each have 99% availability. Roughly what is the combined availability if either one is enough?",o:["99.99%","99%","98%","99.9%"],a:[0],e:"Parallel availability = 1 - (0.01 x 0.01) = 0.9999, assuming independent failures (diverse paths)."},
{id:"c88",d:3,q:"Why is path diversity important for dual WAN circuits?",o:["Two circuits in the same conduit or from the same POP can fail together","Diverse circuits always have lower latency than circuits on one path","Diverse circuits cost less than two circuits from one provider","SD-WAN requires diverse paths before it will build any tunnels"],a:[0],e:"Shared-risk failures (one backhoe, one carrier POP) defeat redundancy. Ask for diverse entrances and carriers."},
{id:"c89",d:3,q:"In WAN design, what is the impact of high latency on TCP throughput?",o:["Per-flow throughput is limited by window size divided by RTT","Per-flow throughput rises as latency increases on the path","Latency has no effect on TCP throughput, only on UDP","TCP stops working entirely once latency passes 50 ms"],a:[0],e:"Bandwidth-delay product: higher RTT needs larger windows to fill the pipe. WAN optimization or window scaling helps."},
{id:"c90",d:3,q:"Which tunnel MTU problem is common in WAN overlays, and how is it handled?",o:["Encapsulation shrinks usable MTU; set the tunnel MTU and adjust TCP MSS","Overlays increase the usable MTU because headers are compressed","MTU matters only on LANs, so WAN tunnels can ignore it entirely","Turn off path MTU discovery so the routers fragment every large packet"],a:[0],e:"IPsec plus GRE can add 70+ bytes. ip tcp adjust-mss and correct tunnel MTU avoid fragmentation and black holes."},
{id:"c91",d:3,q:"Which SD-WAN feature corrects packet loss on poor links by sending parity packets?",o:["Forward Error Correction (FEC)","OMP graceful restart","TLOC color restriction (restrict)","Direct internet access"],a:[0],e:"FEC adds redundancy to recover lost packets. Packet duplication sends copies over two transports for critical apps."},
{id:"c92",d:3,q:"In Catalyst SD-WAN, what does packet duplication do?",o:["Sends critical traffic over two tunnels, and the receiver drops the extra copy","Doubles available bandwidth by bonding two transports for all traffic","Replicates OMP routes to every controller so none of them are lost","Duplicates the vManage database to a second cluster for disaster recovery purposes"],a:[0],e:"Useful for voice on lossy links, at the cost of extra bandwidth."},
{id:"c93",d:3,q:"Which SD-WAN component gives centralized templates so hundreds of branches get consistent configs?",o:["SD-WAN Manager (vManage) templates or configuration groups","SD-WAN Validator (vBond) onboarding profiles","SD-WAN Controller (vSmart) control policies","WAN edge CLI configured on each router"],a:[0],e:"Templates with variables make large rollouts repeatable."},
{id:"c94",d:3,q:"What is a design consideration when SD-WAN edges are behind NAT?",o:["Symmetric NAT on both sides can block direct tunnels, so traffic may go via a hub","NAT always works with SD-WAN, so no design changes are ever needed","Edges can't be placed behind NAT at all, so every WAN edge needs its own public IP","NAT turns off encryption on the tunnels that pass through the NAT device"],a:[0],e:"vBond helps with NAT traversal, but symmetric NAT at both ends can block direct edge-to-edge tunnels."},
{id:"c95",d:3,q:"Which WAN design pattern sends all branch internet traffic to a central data center for inspection?",o:["Centralized internet breakout (backhaul)","Local internet breakout at each branch","Cloud on-ramp through a colocation site","Split tunneling at each branch router"],a:[0],e:"Backhaul centralizes security but adds latency and loads the hub and WAN. Many designs move to local breakout with cloud security."},
{id:"c96",d:3,q:"What does a remote access VPN with split tunneling do?",o:["Sends only corporate traffic through the tunnel; internet traffic goes direct","Sends all traffic through the tunnel, including internet browsing","Turns off the tunnel whenever the user is on a trusted network","Encrypts only DNS traffic and sends everything else in the clear"],a:[0],e:"Split tunneling saves VPN bandwidth. Full tunneling gives central inspection. Cloud security can protect direct traffic."},
{id:"c97",d:3,q:"Which IPsec design uses a hub-spoke topology with IKEv2 and lets spokes dynamically build tunnels via NHRP?",o:["FlexVPN spoke-to-spoke","GETVPN","Static crypto maps everywhere","L2TPv3"],a:[0],e:"FlexVPN can use NHRP similar to DMVPN Phase 3, with IKEv2 features."},
{id:"c98",d:3,q:"What is the purpose of IPsec Dead Peer Detection (DPD)?",o:["Detects a peer that stopped responding so the SA clears and failover can happen","Detects duplicate IP addresses configured on the tunnel interfaces of two peers","Detects routing loops that form across the tunnel between two peers","Encrypts keepalive messages so peers can't be spoofed by attackers"],a:[0],e:"Without DPD, a router keeps sending into a stale SA. DPD triggers rebuilding to an alternate peer."},
{id:"c99",d:3,q:"Which WAN service replaces legacy T1/Frame Relay at most enterprises today?",o:["Ethernet-based services (MPLS, Metro Ethernet, DIA, broadband) with SD-WAN","ATM circuits with permanent virtual circuits to each branch office","ISDN lines with dial-on-demand routing to each branch","Dial-up modems with backup routes to each branch"],a:[0],e:"Ethernet handoffs scale bandwidth easily. Overlays add flexibility across mixed transports."},
{id:"c100",d:3,q:"An enterprise needs to connect 500 small sites cheaply with encrypted any-to-any traffic and central management. What fits best?",o:["SD-WAN over broadband/LTE with dynamic tunnels and centralized policy","Full-mesh static IPsec tunnels","Leased lines to each site","Metro Ethernet E-Line circuits from each site to every other site"],a:[0],e:"Static full mesh at 500 sites needs ~125,000 tunnels to configure. SD-WAN automates keys, tunnels, and policy."},
// ---------- Domain 4 (expanded) ----------
{id:"d44",d:4,q:"Which QoS model does Cisco recommend for enterprise networks?",o:["DiffServ","IntServ","Best effort only","RSVP end to end"],a:[0],e:"DiffServ marks packets into classes and applies per-hop behaviors, which scales well. IntServ reserves per flow."},
{id:"d45",d:4,q:"Which per-hop behavior is defined for EF traffic?",o:["Low delay, low jitter and low loss through priority queuing","Assured bandwidth with three levels of drop precedence","Best-effort forwarding with no bandwidth guarantee","Less than best effort for traffic that can be dropped first"],a:[0],e:"EF (RFC 3246) is for real-time traffic in a priority queue. AF (RFC 2597) gives assured bandwidth with three drop levels."},
{id:"d46",d:4,q:"In Cisco's 12-class QoS model, which class is CS5 typically used for?",o:["Broadcast video","Voice","Network control","Scavenger"],a:[0],e:"Common mapping: EF voice, CS5 broadcast video, AF4x multimedia conferencing, CS4 real-time interactive, CS3 signaling, CS6 network control, CS1 scavenger."},
{id:"d47",d:4,q:"Which DSCP is used for multimedia streaming (on-demand video) in the 12-class model?",o:["AF31","AF41","EF","CS1"],a:[0],e:"AF3x is multimedia streaming, AF2x transactional data, AF1x bulk data. AF4x is interactive video."},
{id:"d48",d:4,q:"Which DSCP is commonly used for bulk data like backups and file transfers?",o:["AF11","AF21","EF","CS6"],a:[0],e:"Bulk data gets AF1x with modest guaranteed bandwidth. Scavenger (CS1) gets even less."},
{id:"d49",d:4,q:"Which DSCP is used for network management traffic (SNMP, SSH, syslog) in the 12-class model?",o:["CS2","CS6","EF","AF41"],a:[0],e:"CS2 is OAM. CS6 is network control (routing protocols). CS7 is reserved."},
{id:"d50",d:4,q:"In a 4-class WAN QoS model, which classes are typical?",o:["Real-time, control, critical data, best effort","Voice only, data only, video only, scavenger only","Gold, silver, bronze only","There is no 4-class model"],a:[0],e:"Smaller models collapse the 12 classes into fewer, often to match provider classes."},
{id:"d51",d:4,q:"What share of a link should best-effort traffic typically get at minimum?",o:["About 25%","About 1%","About 90%","No minimum"],a:[0],e:"Cisco guidance reserves around 25% for the default class so unclassified apps don't starve."},
{id:"d52",d:4,q:"Why should real-time traffic be capped at about 33% of a link in strict priority?",o:["So data apps still get bandwidth and latency stays predictable","Because voice codecs need exactly 33% of any link in order to work","Because priority queues can't be set above 10% of a link","To raise jitter so real-time apps buffer more effectively"],a:[0],e:"Too much priority traffic starves other classes and turns the priority queue into FIFO for real-time traffic."},
{id:"d53",d:4,q:"Which QoS tool prevents TCP global synchronization?",o:["WRED (or DSCP-based WRED)","Strict priority queuing","Policing","Marking"],a:[0],e:"Random early drops cause different flows to back off at different times."},
{id:"d54",d:4,q:"Where is a policer most appropriate in a QoS design?",o:["At ingress to enforce a contract or limit scavenger traffic","On egress to smooth bursts before they reach the provider","Only on voice traffic to protect the priority queue","Nowhere, because policing always hurts application performance"],a:[0],e:"Policers drop or remark excess immediately. Shapers on egress buffer to avoid drops at a provider policer."},
{id:"d55",d:4,q:"What is a downside of shaping?",o:["It adds delay and needs buffers, which can hurt real-time traffic without priority queuing","It drops all excess traffic immediately instead of holding it in a buffer","It can only be applied inbound, so it can't protect against the provider's egress policer","It strips DSCP markings from packets that exceed the shaped rate"],a:[0],e:"Use a child LLQ policy inside the shaper so voice is prioritized within the shaped rate."},
{id:"d56",d:4,q:"What does a two-rate three-color policer (RFC 2698) use?",o:["CIR and PIR to classify traffic as conform, exceed, or violate","Only CIR to classify traffic as conform or exceed","Only the committed burst size to decide what traffic to drop","The hop count of each packet to decide what to drop"],a:[0],e:"Traffic under CIR conforms, between CIR and PIR exceeds, above PIR violates."},
{id:"d57",d:4,q:"How should wireless QoS map to wired QoS for voice?",o:["Voice (EF) maps to the WMM voice access category (UP 6)","Voice (EF) maps to the WMM background access category","WMM has no voice category, so voice uses video","Voice uses the best-effort access category on Wi-Fi"],a:[0],e:"WLCs translate DSCP to 802.11e user priority. A Platinum QoS profile on the WLAN allows voice priority."},
{id:"d58",d:4,q:"What is NBAR2 used for in QoS design?",o:["Recognizing apps by deep packet inspection, even on shared ports","Routing traffic between VRFs based on the application in use","Encrypting application traffic before it leaves the branch","Shaping traffic only on LAN ports facing end users"],a:[0],e:"Many apps share TCP 443. NBAR2 identifies them by signatures for marking and reporting."},
{id:"d59",d:4,q:"What is the role of AutoQoS?",o:["Generates Cisco-recommended QoS config for common devices like IP phones","Configures routing protocols automatically based on detected neighbors","Turns off QoS on ports where no IP phone is detected","Assigns VLANs automatically based on the device that connects"],a:[0],e:"AutoQoS is a quick starting point, but production designs should review and tune generated policies."},
{id:"d60",d:4,q:"Which multicast design element is needed for PIM sparse mode?",o:["A rendezvous point (RP) for each group range","IGMP snooping on the access switches only","No routers, since hosts forward multicast themselves","A DHCP server that assigns group addresses"],a:[0],e:"ASM sparse mode needs an RP. SSM doesn't."},
{id:"d61",d:4,q:"Which method provides fast RP redundancy without waiting for Auto-RP or BSR timers?",o:["Anycast RP with MSDP, or PIM anycast RP","A static RP configured on one router only","PIM dense mode as a fallback when the RP fails","IGMPv1 on all hosts so they rejoin quickly"],a:[0],e:"Multiple RPs share one address. The IGP sends each router to the nearest one, and failover follows IGP convergence."},
{id:"d62",d:4,q:"Which PIM mode builds only shared trees and is good for many-to-many applications?",o:["Bidirectional PIM","PIM dense mode","SSM","PIM sparse-dense mode"],a:[0],e:"BiDir-PIM avoids per-source state, so it scales when every member is both sender and receiver."},
{id:"d63",d:4,q:"What is a design benefit of SSM?",o:["No RP or MSDP needed, and protection against unwanted sources","Works with any receiver, even without IGMPv3 or SSM mapping","Supports any-source applications where receivers don't know the source","Requires dense mode on the routers between source and receivers"],a:[0],e:"Receivers subscribe to (S,G). Hosts need IGMPv3, or routers use SSM mapping for IGMPv2 hosts."},
{id:"d64",d:4,q:"What is SSM mapping used for?",o:["Letting IGMPv2 hosts use SSM by mapping groups to sources on the router","Mapping access VLANs to multicast groups on the access layer switches","Mapping RPs to groups so routers know where to send joins","Mapping DSCP values to groups so multicast gets the right QoS"],a:[0],e:"Legacy hosts send (*,G) joins. The last-hop router converts them to (S,G) joins using configured mappings."},
{id:"d65",d:4,q:"What does PIM-SM use to elect a single forwarder on a multiaccess segment when two routers could send the same traffic?",o:["PIM Assert","DR election only","IGMP querier","RPF failover"],a:[0],e:"Assert messages compare AD and metric to the source. The winner forwards and the loser prunes."},
{id:"d66",d:4,q:"What is the PIM DR's role on a receiver LAN?",o:["Sends PIM joins toward the RP or source on behalf of hosts","Answers ARP requests on behalf of hosts on the receiver LAN","Assigns IP addresses to receivers on the LAN","Forwards all unicast traffic for hosts on the LAN"],a:[0],e:"The DR (highest priority, then highest IP) handles joins on the receiver side and registers sources on the source side."},
{id:"d67",d:4,q:"Multicast traffic is dropped because it arrives on an interface that isn't the unicast path back to the source. Which check is failing?",o:["RPF check","IGMP snooping","TTL check","Assert"],a:[0],e:"If unicast and multicast topologies differ (for example over a tunnel), you may need a static mroute or MBGP to fix RPF."},
{id:"d68",d:4,q:"Which protocol shares multicast source information between PIM domains or anycast RPs?",o:["MSDP","BSR","IGMP","CGMP"],a:[0],e:"MSDP Source-Active messages tell other RPs about active sources so they can join toward them."},
{id:"d69",d:4,q:"Which campus setting prevents multicast flooding in a VLAN when no router is present?",o:["IGMP snooping with an IGMP snooping querier","PIM dense mode enabled on the access switches","Storm control on every access port","DHCP snooping with trusted uplinks"],a:[0],e:"Snooping needs queries to keep membership. Without a multicast router, enable a querier on a switch."},
{id:"d70",d:4,q:"Which multicast address scope is best for an enterprise-internal application?",o:["239.0.0.0/8, administratively scoped","224.0.0.0/24, link-local control","232.0.0.0/8, source-specific only","Any public range, for global reach"],a:[0],e:"239/8 is like private address space for multicast. You can define boundaries so groups don't leak."},
{id:"d71",d:4,q:"What does 'ip multicast boundary' do?",o:["Blocks specified groups from crossing an interface, defining a scope","Enables PIM on the interface so it can start forwarding multicast traffic","Sets the RP address for groups that arrive on the interface","Turns off IGMP on the interface so hosts can't join groups"],a:[0],e:"Boundaries plus scoped addresses keep site-local multicast inside the site."},
{id:"d72",d:4,q:"Which IPv6 multicast feature lets routers learn the RP without BSR or static config?",o:["Embedded RP","SSM mapping","Auto-RP","MSDP"],a:[0],e:"The RP address is encoded in the FF7x:: group address."},
{id:"d73",d:4,q:"In a design using DHCP for many VLANs, where should DHCP servers be placed?",o:["Centralized in the data center or services block, with relay on each SVI","On every access switch, so each wiring closet hands out its own addresses","On a server in every building, so each building is self-contained","On the ISP router, so addressing is managed by the provider"],a:[0],e:"Central redundant DHCP (with failover) is easier to manage. ip helper-address relays requests."},
{id:"d74",d:4,q:"How can DHCP servers be made redundant?",o:["DHCP failover pairs or split scopes across two servers, both set as helpers","One server with a larger scope so it never runs out of addresses to lease","Static IP addresses on every host so DHCP isn't needed at all","DNS round robin between two servers that share one scope"],a:[0],e:"Failover pairs share lease state. Split scopes divide the pool (for example 80/20) across servers."},
{id:"d75",d:4,q:"What does DHCP option 82 add?",o:["Relay agent information, like the switch and port the client is on","The DNS server addresses that the client should use","The default gateway the client should use","The lease time the client should be given"],a:[0],e:"Option 82 helps with location-based address assignment and security. DHCP snooping can insert it."},
{id:"d76",d:4,q:"What is the purpose of DNS in network design beyond name resolution?",o:["Service discovery, load distribution, and controller discovery for onboarding","Routing packets between subnets when no routing protocol is running on the network","Assigning VLANs to endpoints based on their hostname","Encrypting traffic between clients and servers on the network"],a:[0],e:"Many systems discover controllers via DNS names like CISCO-CAPWAP-CONTROLLER and pnpserver."},
{id:"d77",d:4,q:"Which NTP design is recommended for an enterprise?",o:["A few internal servers synced to reliable external sources, with authentication","Every device syncing directly to public NTP servers on the internet, with no authentication","No NTP at all, relying on each device's internal hardware clock","Manually setting the clock on each device after every reload"],a:[0],e:"Hierarchical NTP reduces external dependency. Use multiple sources so one bad clock can be outvoted."},
{id:"d78",d:4,q:"Why is NTP important for security operations?",o:["Accurate timestamps let you correlate logs, validate certificates, and investigate","It encrypts log messages so they can't be altered after they've been written to disk","It blocks attacks that rely on replaying old authentication messages","It speeds up authentication by caching credentials with timestamps"],a:[0],e:"Without synced time, events from different devices can't be put in order."},
{id:"d79",d:4,q:"Which management approach separates management traffic from user traffic?",o:["An out-of-band management network or a dedicated management VRF","VLAN 1 for all management and user traffic","Managing devices directly over the internet with SSH","Telnet from user subnets to each device"],a:[0],e:"OOB gives access even when the production network fails and limits exposure of management interfaces."},
{id:"d80",d:4,q:"Which SNMP design best practice improves security?",o:["SNMPv3 with authPriv, ACLs limiting access, and read-only where possible","SNMPv2c with a long community string shared across every device","SNMPv1 with read-write access limited to the operations team's subnet","SNMPv3 with noAuthNoPriv so polling has the lowest CPU impact"],a:[0],e:"Treat SNMP like an admin interface: encrypted, authenticated, and source-restricted."},
{id:"d81",d:4,q:"Which monitoring approach scales better for high-frequency data from thousands of devices?",o:["Model-driven streaming telemetry","SNMP polling every second","Manual show commands on a schedule","Syslog messages only"],a:[0],e:"Push-based telemetry avoids polling overhead and gives near real-time data."},
{id:"d82",d:4,q:"What is Flexible NetFlow commonly used for in design?",o:["Capacity planning, application visibility, and security analytics","Routing traffic based on the applications seen in flow records","Assigning IP addresses based on observed flow patterns","Managing Wi-Fi roaming between access points"],a:[0],e:"Flow data shows who uses bandwidth and for what, and feeds tools like Secure Network Analytics."},
{id:"d83",d:4,q:"Where should NetFlow typically be enabled for broad visibility without duplicate records?",o:["Ingress on key aggregation points like the WAN edge, distribution, and DC edge","On every interface in both directions, so that no flow is ever missed anywhere","Only on access ports, so every flow is captured right at its source","Only on loopback interfaces, so records aren't tied to one physical link"],a:[0],e:"Ingress-only on chosen interfaces avoids double counting. Sampled NetFlow reduces load on high-speed links."},
{id:"d84",d:4,q:"What does IPFIX offer over NetFlow v5?",o:["Template-based flexible fields, including IPv6, as an IETF standard","Fixed seven-field records that every collector can parse","IPv4-only records that are smaller than NetFlow v9","Real-time packet capture instead of exporting summarized flow records"],a:[0],e:"IPFIX (based on v9) lets exporters define custom records."},
{id:"d85",d:4,q:"Which tool would you use to continuously measure jitter between a branch and HQ for voice SLA reporting?",o:["IP SLA UDP jitter (or SD-WAN BFD metrics)","A single ping test run once a day","Syslog messages from the WAN routers","CDP neighbor information on the WAN"],a:[0],e:"Continuous synthetic probes show trends and SLA compliance."},
{id:"d86",d:4,q:"What is the recommended logging design for network devices?",o:["Send logs to central syslog or SIEM with synced time, and keep a local buffer","Use console logging only, so messages are seen by whoever happens to be connected","Turn off logging entirely to save CPU and memory on the devices","Log at debug level on every device so nothing is ever missed"],a:[0],e:"Central collection allows correlation and retention. Choose severities that balance noise and value."},
{id:"d87",d:4,q:"Which first hop redundancy protocol is the best choice for IPv6 and multi-vendor environments?",o:["VRRPv3","HSRPv1","GLBP for IPv4 only","Proxy ARP"],a:[0],e:"VRRPv3 supports IPv4 and IPv6 and is an open standard. HSRPv2 also supports IPv6 but is Cisco-only."},
{id:"d88",d:4,q:"In GLBP, what does the active virtual gateway (AVG) do?",o:["Answers ARP with different virtual MACs to spread hosts across forwarders","Forwards all traffic for the group while the other routers stay in standby mode","Runs the routing protocol on behalf of all routers in the group","Assigns IP addresses to hosts that request a default gateway"],a:[0],e:"Up to four AVFs forward traffic. The AVG assigns MACs and responds to ARP using a load balancing method (round robin by default)."},
{id:"d89",d:4,q:"Why is GLBP rarely used in modern campus designs with StackWise Virtual or routed access?",o:["Those designs already give active/active forwarding or don't need an FHRP","GLBP doesn't work with IPv4 hosts on modern Catalyst switches","GLBP requires MPLS in the campus core in order to load balance traffic correctly","GLBP is an open standard that Cisco no longer supports"],a:[0],e:"With MEC/StackWise Virtual there is one logical gateway. Routed access puts the gateway on the access switch."},
{id:"d90",d:4,q:"Which HSRP timers give subsecond failover?",o:["Millisecond hello and hold timers (such as 250/750 ms) or HSRP with BFD","The default 3-second hello and 10-second hold timers on both routers","A 30-second hello with a 90-second hold timer","Turning off hellos and relying on interface state"],a:[0],e:"Fast timers increase CPU use. BFD is lighter for fast detection."},
{id:"d91",d:4,q:"What NAT design consideration applies when an internal server is reachable from the internet?",o:["Static NAT or port forwarding with firewall rules, often in a DMZ","PAT with overload only, sharing the edge router's address","No NAT, because private addresses route across the internet","NAT64, so the server is reachable over IPv6 instead"],a:[0],e:"Inbound access needs a fixed mapping. Place public-facing servers in a DMZ to limit exposure."},
{id:"d92",d:4,q:"Why is NAT generally avoided with IPv6?",o:["Global addresses give end-to-end reachability; firewalls provide the security","IPv6 can't support NAT at all, so translation was removed from the IPv6 standards","NAT is required for IPv6 to reach the internet, so it's always used","IPv6 has no global addresses, so translation is never needed"],a:[0],e:"NPTv6 exists for some multihoming cases, but the norm is stateful firewalling without translation."},
{id:"d93",d:4,q:"What is a common design choice for scalable PAT at a large enterprise internet edge?",o:["A pool of public addresses with PAT, sized for concurrent sessions","A single public IP shared by 50,000 users with PAT","Static NAT that gives every user their own public address","No NAT, with private addresses advertised to the ISP"],a:[0],e:"Each public IP supports about 64,000 ports per destination. Large user counts need multiple IPs."},
{id:"d94",d:4,q:"Which service lets switches and routers share neighbor and device information in multi-vendor networks?",o:["LLDP","CDP","VTP","DTP"],a:[0],e:"LLDP (802.1AB) is the open standard. LLDP-MED adds voice VLAN and PoE info for endpoints."},
{id:"d95",d:4,q:"What does LLDP-MED provide to IP phones?",o:["Voice VLAN, QoS, and power information","IP addresses for the phone","Firmware images for the phone","Encryption keys for voice traffic"],a:[0],e:"Phones learn their voice VLAN and markings, and switches learn power needs."},
{id:"d96",d:4,q:"Which DSCP should be used to mark traffic from an untrusted endpoint you don't recognize?",o:["Default (DSCP 0, best effort)","EF (DSCP 46)","CS6 (DSCP 48)","AF41 (DSCP 34, video)"],a:[0],e:"Untrusted traffic is re-marked to 0 unless a classifier identifies it as something else."},
{id:"d97",d:4,q:"Why should routing protocols be marked CS6 and protected in queuing?",o:["So control traffic isn't dropped in congestion, which would drop adjacencies","To slow routing updates down so they don't use too much bandwidth","To encrypt routing updates as they cross untrusted links","Because CS6 is the scavenger class, reserved for traffic that can be dropped first"],a:[0],e:"Routers often prioritize locally generated control traffic internally, but marking and queuing on the path keeps it safe."},
{id:"d98",d:4,q:"What should be considered when designing QoS for encrypted tunnels?",o:["Inner DSCP is copied to the outer header; use qos pre-classify for inner fields","Encryption removes the need for QoS, because encrypted traffic can't be classified","QoS can't be applied to tunnel interfaces on Cisco routers","All tunnel traffic is automatically placed in the EF priority queue"],a:[0],e:"ToS is copied by default, but ACL-based classification on inner IPs needs pre-classify on older platforms."},
{id:"d99",d:4,q:"Which statement about IP SLA and object tracking in a design is correct?",o:["Tracking can adjust HSRP priority, remove static routes, or change PBR when a probe fails","Tracking can only send a syslog message when a probe fails, and can't change routing","IP SLA replaces routing protocols by deciding paths from probe results","Tracking works only with IPv6 static routes and IPv6 HSRP groups"],a:[0],e:"This gives policy-driven failover for paths that routing protocols can't monitor end to end."},
{id:"d100",d:4,q:"In multicast design, which IGMP setting helps quickly stop forwarding when the last receiver leaves a port?",o:["IGMP snooping immediate leave (fast-leave) on single-host ports","IGMPv1 on all hosts so they leave groups silently","Longer IGMP query intervals on the router","PIM dense mode on the access switches"],a:[0],e:"Immediate leave removes the port right after a leave message, which suits IPTV set-top box ports."},
// ---------- Domain 5 (expanded) ----------
{id:"e26",d:5,q:"Which NETCONF capability allows a change to be rolled back automatically if it isn't confirmed within a timeout?",o:["Confirmed commit","Writable running","Startup","XPath"],a:[0],e:"Confirmed commit protects against changes that cut off management access: if you can't confirm, the device reverts."},
{id:"e27",d:5,q:"Which NETCONF operation checks a candidate configuration for errors before committing?",o:["<validate>","<lock>","<get>","<kill-session>"],a:[0],e:"Validate catches syntax and semantic errors in the candidate before it becomes running."},
{id:"e28",d:5,q:"What is the purpose of the NETCONF <lock> operation in automation design?",o:["Prevents other sessions from changing the datastore during a multi-step change","Encrypts the NETCONF session after it's been established over SSH","Speeds up commits by skipping validation of the candidate datastore before it's applied","Deletes the configuration so a new one can be loaded from scratch"],a:[0],e:"Lock, edit, validate, commit, unlock is a safe pattern for transactional changes."},
{id:"e29",d:5,q:"Which YANG statement defines a reusable group of nodes that can be included elsewhere with 'uses'?",o:["grouping","container","typedef","augment"],a:[0],e:"Groupings avoid repetition. typedef defines a reusable type. augment adds nodes to another module."},
{id:"e30",d:5,q:"What does the YANG 'augment' statement do?",o:["Adds nodes into another module's tree, like vendor extensions to a standard model","Deletes nodes from another module's data tree when a vendor doesn't support those features","Defines the key leaf for a list so each entry can be identified uniquely","Imports Python code into the model so devices can run custom logic"],a:[0],e:"Vendors augment IETF or OpenConfig models with platform-specific features."},
{id:"e31",d:5,q:"What does 'config false' mean in a YANG model?",o:["The node is operational state that can be read but not configured","The node is disabled and ignored by the device","The node is mandatory and must always be set","The node is the key for a list entry"],a:[0],e:"State data like counters and oper-status is config false."},
{id:"e32",d:5,q:"Which tool lets you browse YANG models and generate sample NETCONF/RESTCONF requests from them?",o:["YANG Suite (or pyang)","Wireshark (with filters)","Excel","Telnet"],a:[0],e:"Cisco YANG Suite explores models, builds RPCs, and tests against devices. pyang validates and displays model trees."},
{id:"e33",d:5,q:"What does a RESTCONF PUT do compared with POST?",o:["PUT creates or replaces the target; POST creates a new child and fails if it exists","PUT deletes the target resource; POST reads the resource back from the device","They're identical, and servers treat both the same way","PUT merges into the target resource; POST replaces the whole target"],a:[0],e:"PATCH merges. PUT replaces. POST creates. DELETE removes."},
{id:"e34",d:5,q:"Which HTTP header tells a RESTCONF server you want JSON responses?",o:["Accept: application/yang-data+json","Content-Length: json","Authorization: Bearer json-token","X-Format: json"],a:[0],e:"Content-Type describes what you send. Accept describes what you want back."},
{id:"e35",d:5,q:"Which telemetry subscription type sends data only when a value changes?",o:["On-change","Periodic","Polling","Batch"],a:[0],e:"On-change suits state like interface status. Periodic suits counters like bytes and CPU."},
{id:"e36",d:5,q:"In dial-in telemetry, who starts the session?",o:["The collector connects to the device and subscribes","The device connects to the collector and pushes data","SNMP traps from the device start the session","Syslog messages from the device start the session"],a:[0],e:"Dial-in (for example gNMI Subscribe) is collector-initiated. Dial-out is configured on the device, which connects to receivers."},
{id:"e37",d:5,q:"Which encoding is most efficient for streaming telemetry?",o:["Protocol Buffers (GPB) over gRPC","XML over SSH (NETCONF RPCs)","CSV files over email","Plain text over syslog"],a:[0],e:"Binary protobuf encoding is compact and fast. JSON is easier to read but larger."},
{id:"e38",d:5,q:"What is a source of truth (SoT) in network automation design?",o:["An authoritative system like NetBox or Nautobot holding the intended state","The running configuration on each device, read live during every automation job","A spreadsheet kept on one engineer's laptop and shared when needed","The syslog server, which records every change made on the devices"],a:[0],e:"Automation renders configs from intended data in the SoT, then compares to the actual state to find drift."},
{id:"e39",d:5,q:"What is configuration drift?",o:["Differences between the intended config and what's actually running","Differences between device clocks across the network","Gradual packet loss increasing on a link over time","Routes that flap repeatedly between two paths"],a:[0],e:"Manual changes cause drift. Automation and compliance checks detect and remediate it."},

{id:"e45",d:5,q:"What is a key difference between declarative and imperative automation?",o:["Declarative defines the end state; imperative defines the exact steps","Imperative defines only the end state; declarative defines the steps","Declarative needs every CLI command listed in the right order","They're the same thing described with different terms"],a:[0],e:"Declarative tools (Terraform, resource modules, controllers) compute the needed changes. Imperative scripts run commands in sequence."},

];
if(window.HARD) BANK.push(...window.HARD);
const HARD_SHARE=0.6; // share of each domain in the full exam drawn from the hard set

// ---------- storage (fail-safe) ----------
const KEY="ensld-practice-v1", SKEY="ensld-session-v1";
let mem = {stats:{}, exams:[], size:10, strict:true};
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const p=JSON.parse(r); mem={stats:p.stats||{},exams:p.exams||[],size:p.size||10,strict:p.strict!==false}; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }
function saveSession(){ try{ if(S) localStorage.setItem(SKEY, JSON.stringify(S)); else localStorage.removeItem(SKEY);}catch(e){} }
function loadSession(){ try{ const r=localStorage.getItem(SKEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
load();

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCDEFGH";
const qhtml=s=>{const k=s.indexOf("\n\n"); if(k<0) return esc(s); let ex=s.slice(k+2), tail=""; const j=ex.lastIndexOf("\n\n"); if(j>=0){ tail=ex.slice(j+2); ex=ex.slice(0,j); } return esc(s.slice(0,k))+`<pre class="code${/^- /.test(ex)?" req":""}">${esc(ex)}</pre>`+(tail?`<div style="margin-top:10px">${esc(tail)}</div>`:"");};
function record(id, ok){ const s=mem.stats[id]||{s:0,c:0,w:false}; s.s++; if(ok)s.c++; s.w=!ok; mem.stats[id]=s; }
function missedIds(){ return BANK.filter(q=>mem.stats[q.id]&&mem.stats[q.id].w).map(q=>q.id); }
function domainStats(d){ let s=0,c=0,seen=0; BANK.filter(q=>q.d==d).forEach(q=>{const t=mem.stats[q.id]; if(t){s+=t.s;c+=t.c;seen++;}}); return {pct:s?Math.round(c/s*100):null,seen,total:BANK.filter(q=>q.d==d).length}; }
function pick(ids){
  const n=mem.size||ids.length;
  const score=id=>{const t=mem.stats[id]; if(!t) return 0; if(t.w) return 1; return 2+t.c/t.s;};
  return shuffle(ids).sort((a,b)=>score(a)-score(b)).slice(0,n);
}
function makeItem(id){ const q=byId[id]; return {id, order:shuffle((q.t==="m"?q.items:q.o).map((_,i)=>i))}; }
function isRight(id, sel){ const q=byId[id], a=q.a; if(q.t==="m") return Array.isArray(sel)&&a.every((c,i)=>sel[i]===c); return sel && sel.length===a.length && a.every(x=>sel.includes(x)); }
function complete(q, sel){ sel=sel||[]; return q.t==="m" ? q.items.every((_,i)=>sel[i]!=null) : sel.length===q.a.length; }
function started(k){ const v=S.ans[k]; return !!(v && v.some(x=>x!=null)); }
function ansHtml(q, sel){ sel=sel||[]; if(q.t==="m") return q.items.map((t,i)=>`${esc(t)}: <b>${sel[i]!=null?esc(q.cats[sel[i]]):"(none)"}</b>`).join("<br>"); return sel.length?sel.map(i=>esc(q.o[i])).join("; "):"(none)"; }
function keyHtml(q){ if(q.t==="m") return q.items.map((t,i)=>`${esc(t)}: <b>${esc(q.cats[q.a[i]])}</b>`).join("<br>"); return q.a.map(i=>esc(q.o[i])).join("; "); }

let S=null; // active session
let timerH=null;

// ---------- start modes ----------
function startExam(){
  let ids=[];
  for(const d in DOMAINS){
    const n=DOMAINS[d].n;
    const hard=shuffle(BANK.filter(q=>q.d==d&&q.h).map(q=>q.id));
    const reg=shuffle(BANK.filter(q=>q.d==d&&!q.h).map(q=>q.id));
    const hn=Math.min(hard.length,Math.round(n*HARD_SHARE));
    ids=ids.concat(hard.slice(0,hn),reg.slice(0,n-hn));
  }
  ids=shuffle(ids);
  S={mode:"exam",strict:mem.strict!==false,items:ids.map(makeItem),i:0,ans:{},flags:{},checked:{},endAt:Date.now()+90*60*1000,title:"Full exam"};
  saveSession(); render();
}
function startMini(){
  const ids=pick5(BANK.map(q=>q.id));
  S={mode:"exam",mini:true,strict:mem.strict!==false,items:ids.map(makeItem),i:0,ans:{},flags:{},checked:{},endAt:Date.now()+8*60*1000,title:"5-question test"};
  saveSession(); render();
}
function pick5(ids){
  const score=id=>{const t=mem.stats[id]; if(!t) return 0; if(t.w) return 1; return 2+t.c/t.s;};
  return shuffle(ids).sort((a,b)=>score(a)-score(b)).slice(0,5);
}
function startPractice(ids,title,kind){
  if(!ids.length){ showModal("Nothing to practice here yet.",[["OK",closeModal]]); return; }
  S={mode:"practice",items:shuffle(ids).map(makeItem),i:0,ans:{},flags:{},checked:{},title,kind:kind||null};
  saveSession(); render();
}
function hardSet(){ startPractice(pick(BANK.filter(q=>q.h).map(q=>q.id)),"Hard scenarios",{t:"hard"}); }
function quick(){ startPractice(pick(BANK.map(q=>q.id)),"Quick practice",{t:"quick"}); }
function drill(d){ startPractice(pick(BANK.filter(q=>q.d==d).map(q=>q.id)),DOMAINS[d].name,{t:"drill",d}); }
function missed(){ startPractice(pick(missedIds()),"Missed questions",{t:"missed"}); }
function nextSet(k){ S=null; if(k.t==="drill") drill(k.d); else if(k.t==="missed") missed(); else if(k.t==="hard") hardSet(); else quick(); }
const SIZES=[5,10,20,50,0];
const sizeLbl=n=>n?String(n):"All";

// ---------- modal ----------
function showModal(msg,btns){
  $("#modal").innerHTML=`<div class="modal"><div class="card"><p>${msg}</p><div class="row" style="justify-content:flex-end">${btns.map((b,i)=>`<button data-i="${i}" class="${i===btns.length-1?'primary':''}">${b[0]}</button>`).join("")}</div></div></div>`;
  $("#modal").querySelectorAll("button").forEach(b=>b.onclick=()=>btns[+b.dataset.i][1]());
}
function closeModal(){ $("#modal").innerHTML=""; }

// ---------- render ----------
function render(){
  clearInterval(timerH);
  if(!S) return renderHome();
  if(S.done) return renderResults();
  renderQuestion();
}

function renderHome(){
  const m=missedIds().length;
  const last=mem.exams.slice(-5).reverse();
  $("#app").innerHTML=`
  <h1>ENSLD 300-420 Practice</h1>
  <p class="sub">Designing Cisco Enterprise Networks v1.1 &middot; ${BANK.length} questions (${BANK.filter(q=>q.h).length} hard scenarios) &middot; weighted to Cisco's blueprint</p>
  <div class="grid">
    <button class="big primary" id="bExam"><b>Full practice exam</b><span style="color:inherit;opacity:.85">60 questions &middot; ${mem.strict!==false?"90 min":"study mode, no timer"} &middot; mostly hard scenarios${mem.strict!==false?" &middot; no going back":""}</span></button>
    <button class="big" id="bHard"><b>Hard scenarios</b><span>Design scenarios, choose-two, and drag-and-drop style matching</span></button>
    <button class="big" id="bMini"><b>5-question test</b><span>${mem.strict!==false?"Timed (8 min), scored at the end":"No timer, answers as you go"}, unseen first</span></button>
    <button class="big" id="bQuick"><b>Quick practice</b><span>${mem.size?mem.size+" questions":"Every question"}, unseen first, answers shown as you go</span></button>
    <button class="big" id="bMiss" ${m?"":"disabled"}><b>Missed questions</b><span>${m} to review${m&&mem.size&&m>mem.size?" &middot; "+mem.size+" at a time":""}</span></button>
  </div>
  <h2>Exam mode</h2>
  <div class="card"><div class="chips" id="rules"><button data-r="1" class="${mem.strict!==false?'on':''}">Cisco style</button><button data-r="0" class="${mem.strict===false?'on':''}">Study</button></div>
  <p class="note" style="margin-bottom:0">Cisco style matches the real exam: one question at a time, no going back, no flags. Study has no timer, lets you move around, and shows the answer and explanation after each question. Applies to the full exam and the 5-question test.</p></div>
  <h2>Questions per practice session</h2>
  <div class="card"><div class="chips" id="sizes">${SIZES.map(n=>`<button data-n="${n}" class="${(mem.size||0)===n?'on':''}">${sizeLbl(n)}</button>`).join("")}</div>
  <p class="note" style="margin-bottom:0">Applies to quick practice, domain drills, and missed questions. Questions you haven't seen come first, then ones you missed.</p></div>
  <h2>Drill a domain</h2>
  <div class="card">${Object.entries(DOMAINS).map(([d,x])=>{const st=domainStats(d);return `
    <div class="dom"><div class="lbl"><span><a href="#" data-d="${d}">${d}.0 ${x.name}</a> <span class="tag">${x.w}%</span></span><span class="muted">${st.pct===null?"not started":st.pct+"% &middot; "+st.seen+"/"+st.total+" seen"}</span></div>
    <div class="bar"><i style="width:${st.pct||0}%"></i></div></div>`}).join("")}
    <p class="note">Tap a domain to drill ${mem.size?mem.size+" questions":"every question"} from it.</p>
  </div>
  ${last.length?`<h2>Recent exams</h2><div class="card">${last.map(x=>`<div class="row small"><span>${new Date(x.t).toLocaleDateString()}</span><span class="spacer"></span><b class="${x.p>=80?'pass':'fail'}">${x.p}%</b><span class="muted">${x.c}/${x.n}</span></div>`).join("")}</div>`:""}
  <h2>Your data</h2>
  <div class="card small">
    <p class="muted" style="margin-top:0">Progress saves in this browser only. Copy a backup now and then so you don't lose it.</p>
    <div class="row"><button id="bBackup">Backup / restore</button><button id="bReset">Reset stats</button></div>
  </div>
  <p class="note">Cisco doesn't publish a pass mark. People who pass report a scenario-heavy, requirements-driven exam with drag-and-drop items and no going back. Aim for 80%+ on full exams here before booking. Questions are original study material, not exam dumps.</p>`;
  document.querySelectorAll("#sizes [data-n]").forEach(b=>b.onclick=()=>{mem.size=+b.dataset.n;save();render();});
  document.querySelectorAll("#rules [data-r]").forEach(b=>b.onclick=()=>{mem.strict=b.dataset.r==="1";save();render();});
  $("#bHard").onclick=hardSet; $("#bExam").onclick=startExam; $("#bMini").onclick=startMini; $("#bQuick").onclick=quick; $("#bMiss").onclick=missed;
  document.querySelectorAll("[data-d]").forEach(a=>a.onclick=e=>{e.preventDefault();drill(a.dataset.d);});
  $("#bBackup").onclick=renderBackup;
  $("#bReset").onclick=()=>showModal("Clear all stats and exam history?",[["Cancel",closeModal],["Clear",()=>{mem={stats:{},exams:[],size:mem.size,strict:mem.strict};save();closeModal();render();}]]);

function renderBackup(){
  $("#app").innerHTML=`
  <div class="top"><button id="bBack">&larr; Back</button><b>Backup / restore</b></div>
  <div class="card"><b>Backup</b><p class="small muted">Copy this text and keep it somewhere (notes app, email to yourself).</p>
  <textarea id="out" readonly>${esc(JSON.stringify(mem))}</textarea>
  <div class="row"><button id="bCopy" class="primary">Copy</button><span id="cmsg" class="small muted"></span></div></div>

  $("#bBack").onclick=render;
  $("#bCopy").onclick=async()=>{ const t=$("#out"); try{ await navigator.clipboard.writeText(t.value); $("#cmsg").textContent="Copied."; }catch(e){ t.select(); $("#cmsg").textContent="Selected. Copy it manually."; } };
  $("#bRestore").onclick=()=>{ try{ const p=JSON.parse($("#in").value); if(!p||typeof p.stats!=="object") throw 0; mem={stats:p.stats,exams:p.exams||[],size:p.size||mem.size||10,strict:p.strict!==false}; save(); $("#rmsg").textContent="Restored."; $("#rmsg").className="small pass"; }catch(e){ $("#rmsg").textContent="That doesn't look like a valid backup."; $("#rmsg").className="small fail"; } };
}

function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return m+":"+String(s).padStart(2,"0"); }

function renderQuestion(){
  clearInterval(timerH);
  const it=S.items[S.i], q=byId[it.id], sel=S.ans[S.i]||[], match=q.t==="m", multi=!match&&q.a.length>1, checked=S.checked[S.i];
  const exam=S.mode==="exam", strict=exam&&S.strict, study=exam&&!S.strict;
  const answered=S.items.filter((_,k)=>started(k)).length;
  $("#app").innerHTML=`
  <div class="top">
    <button id="bQuit">&times;</button>
    <span class="small"><b>${S.i+1}</b> / ${S.items.length}</span>
    <span class="spacer"></span>
    ${exam&&!study?`<span class="timer" id="tmr"></span>`:`<span class="small muted">${esc(S.title)}</span>`}
  </div>
  <span class="tag">${q.d}.0 ${DOMAINS[q.d].name}</span> ${multi?`<span class="tag">Choose ${q.a.length}</span>`:""}${match?`<span class="tag">Match each item</span>`:""}
  <div class="qtext">${qhtml(q.q)}</div>
  ${match?`<div id="opts">${it.order.map(ii=>{
    const v=sel[ii]; let cls="mrow"; if(checked) cls+=(v===q.a[ii]?" right":" wrong");
    return `<div class="${cls}"><div>${esc(q.items[ii])}</div><div class="chips">${q.cats.map((c,ci)=>`<button data-ii="${ii}" data-ci="${ci}" class="${v===ci?'on':''}" ${checked?"disabled":""}>${esc(c)}</button>`).join("")}</div>${checked&&v!==q.a[ii]?`<div class="small" style="margin-top:6px">Correct: <b>${esc(q.cats[q.a[ii]])}</b></div>`:""}</div>`;}).join("")}</div>`:`<div id="opts">${it.order.map((oi,k)=>{
    let cls="opt";
    if(sel.includes(oi)) cls+=" sel";
    if(checked){ if(q.a.includes(oi)) cls+=" right"; else if(sel.includes(oi)) cls+=" wrong"; }
    return `<button class="${cls}" data-oi="${oi}" ${checked?"disabled":""}><span class="k">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`;}).join("")}</div>`}
  ${checked?`<div class="explain"><span class="verdict ${isRight(it.id,sel)?'ok':'no'}">${isRight(it.id,sel)?"Correct.":"Not quite."}</span> ${esc(q.e)}</div>`:""}
  <div class="row" style="margin-top:14px">
    ${exam?`${strict?"":`<button id="bPrev" ${S.i?"":"disabled"}>Prev</button><button id="bFlag">${S.flags[S.i]?"Unflag":"Flag"}</button>`}<span class="spacer"></span>
      ${!strict&&!checked?`<button id="bCheck" class="primary" ${complete(q,sel)?"":"disabled"}>Check</button>`:""}
      ${S.i<S.items.length-1?`<button id="bNext" class="${!strict&&!checked?"":"primary"}">Next</button>`:`<button id="bSubmit" class="${!strict&&!checked?"":"primary"}">Submit exam</button>`}`
    :`${Object.keys(S.checked).length?`<button id="bEnd">End &amp; score</button>`:""}<span class="spacer"></span>${checked?(S.i<S.items.length-1?`<button id="bNext" class="primary">Next</button>`:`<button id="bFinish" class="primary">Finish</button>`):`<button id="bCheck" class="primary" ${complete(q,sel)?"":"disabled"}>Check</button>`}`}
  </div>
  ${exam&&!strict?`<div class="card small"><div class="row"><span class="muted">${answered} answered &middot; ${Object.values(S.flags).filter(Boolean).length} flagged</span><span class="spacer"></span><button id="bSub2">Submit</button></div>
    <div class="nav">${S.items.map((_,k)=>`<button data-j="${k}" class="${started(k)?'ans':''} ${k===S.i?'cur':''} ${S.flags[k]?'fl':''}">${k+1}${S.flags[k]?"*":""}</button>`).join("")}</div></div>`:""}
  `;
  $("#bQuit").onclick=()=>showModal(exam?"Leave this exam? Progress on it will be lost.":"End this practice session?",[["Stay",closeModal],["Leave",()=>{S=null;saveSession();closeModal();render();}]]);
  if(!checked&&match) document.querySelectorAll("#opts [data-ii]").forEach(b=>b.onclick=()=>{
    const cur=(S.ans[S.i]||q.items.map(()=>null)).slice(); cur[+b.dataset.ii]=+b.dataset.ci;
    S.ans[S.i]=cur; saveSession(); renderQuestion();
  });
  if(!checked&&!match) document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi; let cur=(S.ans[S.i]||[]).slice();
    if(multi){ cur=cur.includes(oi)?cur.filter(x=>x!==oi):(cur.length<q.a.length?[...cur,oi]:cur); } else cur=[oi];
    S.ans[S.i]=cur; saveSession(); renderQuestion();
  });
  const go=j=>{S.i=j;saveSession();renderQuestion();window.scrollTo(0,0);};
  if($("#bNext")) $("#bNext").onclick=()=>{ if(strict&&!complete(q,sel)) showModal("You can't come back to this question. Move on without a full answer?",[["Stay",closeModal],["Move on",()=>{closeModal();go(S.i+1);}]]); else go(S.i+1); };
  if($("#bPrev")) $("#bPrev").onclick=()=>go(S.i-1);
  if($("#bFlag")) $("#bFlag").onclick=()=>{S.flags[S.i]=!S.flags[S.i];saveSession();renderQuestion();};
  if($("#bCheck")) $("#bCheck").onclick=()=>{S.checked[S.i]=true; if(!exam){ record(it.id,isRight(it.id,sel)); save(); } saveSession(); renderQuestion();};
  if($("#bFinish")) $("#bFinish").onclick=finish;
  if($("#bEnd")) $("#bEnd").onclick=finish;
  const sub=()=>{ const un=strict?(complete(q,sel)?0:1):S.items.length-answered; showModal(un?`${un} question${un>1?"s are":" is"} unanswered. Submit anyway?`:"Submit your exam?",[["Keep going",closeModal],["Submit",()=>{closeModal();finish();}]]); };
  if($("#bSubmit")) $("#bSubmit").onclick=sub;
  if($("#bSub2")) $("#bSub2").onclick=sub;
  document.querySelectorAll(".nav [data-j]").forEach(b=>b.onclick=()=>go(+b.dataset.j));
  if(exam&&!study){
    const tick=()=>{ const left=S.endAt-Date.now(); const t=$("#tmr"); if(t){ t.textContent=fmt(left); t.classList.toggle("low",left<5*60000);} if(left<=0){ clearInterval(timerH); finish(); } };
    tick(); timerH=setInterval(tick,1000);
  }
}

function finish(){
  clearInterval(timerH);
  const per={}; let c=0;
  S.items.forEach((it,k)=>{
    const q=byId[it.id], ok=isRight(it.id,S.ans[k]);
    if(S.mode==="exam") record(it.id,ok);
    else if(!S.checked[k]) return;
    per[q.d]=per[q.d]||{c:0,n:0}; per[q.d].n++; if(ok){per[q.d].c++;c++;}
  });
  const n=Object.values(per).reduce((a,b)=>a+b.n,0);
  S.result={c,n,p:n?Math.round(c/n*100):0,per};
  if(S.mode==="exam"&&!S.mini) mem.exams.push({t:Date.now(),c,n,p:S.result.p});
  save(); S.done=true; saveSession(); render(); window.scrollTo(0,0);
}

function renderResults(){
  const r=S.result; let wrongOnly=S.wrongOnly??true;
  const list=S.items.map((it,k)=>({it,k})).filter(({it,k})=>S.mode==="exam"||S.checked[k]).filter(({it,k})=>!wrongOnly||!isRight(it.id,S.ans[k]));
  $("#app").innerHTML=`
  <div class="top"><button id="bHome">&larr; Home</button><b>${esc(S.title)} results</b></div>
  <div class="card"><p class="score ${r.p>=80?'pass':'fail'}">${r.p}%</p><p class="muted" style="margin:0">${r.c} of ${r.n} correct${S.mode==="exam"?" &middot; target 80%+":""}</p></div>
  <div class="card">${Object.entries(r.per).sort().map(([d,x])=>{const p=Math.round(x.c/x.n*100);return `
    <div class="dom"><div class="lbl"><span>${d}.0 ${DOMAINS[d].name}</span><span class="${p>=80?'pass':'fail'}">${x.c}/${x.n} &middot; ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
  <div class="row"><h2 style="margin:12px 0">Review</h2><span class="spacer"></span><button id="bToggle">${wrongOnly?"Show all":"Show missed only"}</button></div>
  <div class="card">${list.length?list.map(({it,k})=>{const q=byId[it.id], sel=S.ans[k]||[], ok=isRight(it.id,sel);
    return `<div class="rev"><div class="small muted">Q${k+1} &middot; ${q.d}.0 ${DOMAINS[q.d].name}</div>
    <div style="margin:4px 0 6px;font-weight:700;white-space:pre-wrap">${qhtml(q.q)}</div>
    <div class="small">Your answer: <span class="${ok?'pass':'fail'}">${ansHtml(q,sel)}</span></div>
    ${ok?"":`<div class="small">Correct: <span class="pass">${keyHtml(q)}</span></div>`}
    <div class="small muted" style="margin-top:4px">${esc(q.e)}</div></div>`}).join(""):`<p class="muted">Nothing missed. Nice.</p>`}</div>
  <div class="row">${S.kind?`<button id="bNextSet" class="primary">Next ${mem.size||"set"}</button><button id="bAgain">Retry these</button>`:`<button id="bAgain" class="primary">${S.mini?"Another 5":S.mode==="exam"?"New exam":"Practice again"}</button>`}</div>`;
  if($("#bNextSet")) $("#bNextSet").onclick=()=>nextSet(S.kind);
  $("#bHome").onclick=()=>{S=null;saveSession();render();};
  $("#bToggle").onclick=()=>{S.wrongOnly=!wrongOnly;renderResults();};
  $("#bAgain").onclick=()=>{ const m=S.mode, mini=S.mini, ids=S.items.map(i=>i.id), t=S.title, k=S.kind; S=null; if(mini) startMini(); else if(m==="exam") startExam(); else startPractice(ids,t,k); };
}

// resume an in-progress session after refresh
S=loadSession();
if(S && S.mode==="exam" && !S.done && !(S.study||S.strict===false) && Date.now()>S.endAt){ finish(); }
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
