<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5cad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENSLD">

<title>ENSLD 300-420 Practice Exam</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#16202b;--muted:#5d6b7a;--line:#dde3ea;
  --brand:#0a5cad;--brand-ink:#fff;--ok:#1d7f46;--ok-bg:#e6f4ec;--bad:#b42318;--bad-bg:#fdecea;--flag:#b26a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141a;--card:#18202a;--ink:#e7edf3;--muted:#98a6b5;--line:#2a3542;--brand:#4b9be8;--brand-ink:#0b1117;--ok:#5fd08f;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1a18;--flag:#f0b44c;}
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
h1{font-size:1.35rem;margin:4px 0 2px}
h2{font-size:1.05rem;margin:22px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.big{display:block;width:100%;text-align:left;padding:14px}
.big b{display:block}
.big span{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.dom{margin:8px 0}
.dom .lbl{display:flex;justify-content:space-between;font-size:.88rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.tag{display:inline-block;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.qtext{font-size:1.05rem;margin:10px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
pre.code{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 0;overflow-x:auto;white-space:pre;font-weight:400}
pre.code.req{font:inherit;font-size:.95rem;white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 14px;border-radius:20px}
.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt .k{font-weight:700;min-width:1.2em}
.opt.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.explain{border-left:3px solid var(--brand);padding:8px 12px;margin-top:12px;background:var(--card);border-radius:0 8px 8px 0}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.nav button{padding:6px 0;font-size:.8rem}
.nav .ans{background:var(--line)}
.nav .cur{outline:2px solid var(--brand)}
.nav .fl{color:var(--flag);font-weight:700}
.score{font-size:2.2rem;font-weight:700;margin:0}
.mrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--card)}
.mrow .chips{margin-top:8px}
.mrow .chips button{padding:5px 10px;font-size:.85rem}
.mrow.right{border-color:var(--ok);background:var(--ok-bg)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pass{color:var(--ok)}.fail{color:var(--bad)}
textarea{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.note{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script src="hard1.js"></script>
<script src="hard2.js"></script>
<script>
const DOMAINS = {
  1:{name:"Advanced Addressing and Routing", w:25, n:15},
  2:{name:"Advanced Enterprise Campus", w:25, n:15},
  3:{name:"WAN for Enterprise Networks", w:20, n:12},
  4:{name:"Network Services", w:20, n:12},
  5:{name:"Automation", w:10, n:6}
};

// d=domain, q=question, o=options, a=correct option indexes, e=explanation
const BANK = [
// ---------- Domain 1 ----------
{id:"a1",d:1,q:"You need one summary route for 10.10.16.0/24 through 10.10.23.0/24. Which summary is the most specific that covers all eight networks?",o:["10.10.16.0/21","10.10.16.0/20","10.10.16.0/22","10.10.0.0/19"],a:[0],e:"Eight /24s = 2^3, so borrow back 3 bits: /21. 16 is a multiple of 8, so 10.10.16.0/21 covers .16 through .23 exactly."},
{id:"a2",d:1,q:"A site is assigned an IPv6 /48. How many /64 subnets can it create?",o:["65,536","256","4,096","16,777,216"],a:[0],e:"64 minus 48 = 16 bits of subnet ID. 2^16 = 65,536 /64 subnets."},
{id:"a3",d:1,q:"The business wants to enable IPv6 gradually while existing IPv4 applications keep running on the same interfaces, with no translation. Which transition approach fits?",o:["Dual stack","NAT64","6to4 tunneling","ISATAP"],a:[0],e:"Dual stack runs IPv4 and IPv6 side by side on the same hosts and interfaces. It is Cisco's preferred long-term transition approach and needs no translation."},
{id:"a4",d:1,q:"New IPv6-only clients must reach a legacy IPv4-only server that can't be upgraded. What should the design include?",o:["NAT64 with DNS64","Dual stack on the clients","ISATAP tunnels","Manual 6in4 tunnels"],a:[0],e:"NAT64 translates IPv6 to IPv4, and DNS64 synthesizes AAAA records so IPv6-only clients can resolve the IPv4-only server."},
{id:"a5",d:1,q:"Which two mechanisms tunnel IPv6 traffic across an IPv4-only infrastructure? (Choose two.)",o:["6to4","ISATAP","NAT64","SLAAC","DHCPv6 prefix delegation"],a:[0,1],e:"6to4 and ISATAP both encapsulate IPv6 in IPv4. NAT64 is translation, not tunneling. SLAAC and DHCPv6-PD are addressing methods."},
{id:"a6",d:1,q:"A remote OSPF area must not receive external Type 5 LSAs, but a router inside that area redistributes local static routes into OSPF. Which area type fits?",o:["NSSA","Stub area","Totally stubby area","Backbone area"],a:[0],e:"Stub and totally stubby areas can't contain an ASBR. NSSA blocks Type 5 but lets a local ASBR inject externals as Type 7, which the ABR converts to Type 5."},
{id:"a7",d:1,q:"Which LSA types are blocked from entering a totally stubby OSPF area?",o:["Types 3, 4, and 5, except a default route","Type 5 only, with Type 3 summaries allowed","Types 4 and 5 only, with a default route","Types 1 and 2 from other areas"],a:[0],e:"Totally stubby (Cisco) blocks inter-area (3), ASBR summary (4) and external (5) LSAs. The ABR injects a default route as a Type 3."},
{id:"a8",d:1,q:"Where can OSPF summarize inter-area routes?",o:["On the ABR","On any internal router","Only on the DR","Only on the ASBR"],a:[0],e:"Inter-area summarization happens on ABRs (area range). External summarization happens on ASBRs (summary-address). That's why a hierarchical addressing plan lines up with area boundaries."},
{id:"a9",d:1,q:"In a large EIGRP hub-and-spoke design, you want to limit query scope and make sure spokes are never used as transit. What should you configure?",o:["EIGRP stub on the spokes","Summarization on the spokes only","Passive interfaces on the hub","Longer hold timers on the hub"],a:[0],e:"Stub routers aren't queried by the hub and don't advertise learned routes as transit. This bounds the query domain and improves convergence and stability."},
{id:"a10",d:1,q:"What condition must a route meet to be an EIGRP feasible successor?",o:["Its reported distance is less than the current feasible distance","Its reported distance equals the current feasible distance","Its administrative distance is lower than the successor's","Its outgoing interface has the same bandwidth as the successor"],a:[0],e:"The feasibility condition: neighbor's reported (advertised) distance < current feasible distance. That guarantees a loop-free backup path."},
{id:"a11",d:1,q:"Which EIGRP feature enables unequal-cost load balancing?",o:["variance","maximum-paths alone","bandwidth-percent","offset-list"],a:[0],e:"variance multiplies the best metric; feasible successors with a metric within that multiple are installed. maximum-paths sets how many paths, but equal cost unless variance is set."},
{id:"a12",d:1,q:"How do IS-IS area boundaries differ from OSPF area boundaries?",o:["Boundaries fall on links, and each router sits in one area","Boundaries fall on routers, the same way as OSPF ABRs","There are no areas, so the whole domain is one flooding scope","Every area must physically connect to a backbone area 0"],a:[0],e:"In IS-IS a router belongs to one area and the boundary sits on the link between L1/L2 routers. In OSPF the ABR itself straddles the boundary."},
{id:"a13",d:1,q:"What does IS-IS use for transport?",o:["Directly over Layer 2 using CLNS, not over IP","TCP port 179, the same transport as BGP","UDP port 520, the same transport as RIP","IP protocol 89, the same transport as OSPF"],a:[0],e:"IS-IS is encapsulated directly in Layer 2 frames. TCP 179 is BGP, UDP 520 is RIP, IP 89 is OSPF. Not depending on IP is one reason it's popular as an underlay."},
{id:"a14",d:1,q:"How many iBGP sessions are needed for a full mesh of 10 routers?",o:["45","10","20","90"],a:[0],e:"n(n-1)/2 = 10 x 9 / 2 = 45. That growth is why route reflectors or confederations are used at scale."},
{id:"a15",d:1,q:"Which design element removes the iBGP full-mesh requirement while keeping a single AS number?",o:["Route reflectors","eBGP multihop","BGP communities","next-hop-self"],a:[0],e:"Route reflectors can re-advertise iBGP routes to clients. Confederations also solve it but split the AS into sub-ASes."},
{id:"a16",d:1,q:"Your AS has two ISP links on two different edge routers. All internal routers should prefer ISP A for outbound traffic. Which attribute should you set?",o:["Local preference","MED","AS-path prepending","Weight"],a:[0],e:"Local preference is shared across the whole AS via iBGP and controls outbound path choice. Weight is Cisco-only and local to one router."},
{id:"a17",d:1,q:"You're dual-homed to two different ISPs and want most inbound traffic to arrive via ISP A. Which method is most commonly used?",o:["AS-path prepending toward ISP B","Higher local preference on ISP A routes","Higher weight on ISP A","Lower MED toward ISP B"],a:[0],e:"Prepending makes the path through ISP B look longer to the world. MED is only compared between paths from the same neighbor AS, and local pref/weight affect outbound."},
{id:"a18",d:1,q:"You have two links to the same provider AS and want to influence which link that provider uses to send traffic to you. Which attribute fits?",o:["MED","Local preference","Weight","Origin"],a:[0],e:"MED is a hint to a directly connected neighbor AS about which entry point to prefer. It's compared when routes come from the same AS."},
{id:"a19",d:1,q:"Which well-known BGP community stops a route from being advertised to eBGP peers?",o:["no-export","no-advertise","internet","local-AS"],a:[0],e:"no-export keeps the route inside the AS (or confederation). no-advertise stops it from being sent to any peer. local-AS keeps it inside the local sub-AS."},
{id:"a20",d:1,q:"Two routers do mutual redistribution between OSPF and EIGRP. What's the best practice to avoid routing loops and suboptimal paths?",o:["Tag routes at redistribution and filter on those tags","Set the AD of all redistributed routes to 255","Redistribute only connected routes in each direction","Turn off split horizon on both redistribution routers"],a:[0],e:"Tagging routes as they're redistributed, then denying routes carrying the tag when going back the other way, prevents feedback loops at multiple redistribution points."},
{id:"a21",d:1,q:"Which route source has the lowest default administrative distance?",o:["eBGP","EIGRP internal","OSPF","IS-IS"],a:[0],e:"eBGP 20, EIGRP internal 90, OSPF 110, IS-IS 115, EIGRP external 170, iBGP 200."},
{id:"a22",d:1,q:"You need sub-second link failure detection that OSPF, EIGRP, and BGP can all use. What should you deploy?",o:["BFD","UDLD","Aggressive hello timers on every protocol","IP SLA"],a:[0],e:"BFD is a lightweight, protocol-independent hello mechanism that multiple routing protocols can register with, giving fast failure detection without tuning each protocol."},
{id:"a23",d:1,q:"What is the 2-byte private BGP AS number range?",o:["64512 to 65534","1 to 64511","65535 to 65551","4200000000 to 4294967294"],a:[0],e:"64512 to 65534 is the 16-bit private range. 4200000000 to 4294967294 is the 32-bit private range."},
{id:"a24",d:1,q:"Which IPv6 prefix is reserved for Unique Local Addresses (ULA)?",o:["fc00::/7","fe80::/10","2000::/3","ff00::/8"],a:[0],e:"ULA is fc00::/7 (fd00::/8 in practice). fe80::/10 is link-local, 2000::/3 is global unicast, ff00::/8 is multicast."},

// ---------- Domain 2 ----------
{id:"b1",d:2,q:"A small single-building campus doesn't need three tiers. Which design is recommended?",o:["Collapsed core, with core and distribution combined","Full three-tier hierarchy with a separate core","Spine-leaf fabric with routed access everywhere","Flat Layer 2 with access switches in a daisy chain"],a:[0],e:"A two-tier collapsed core merges core and distribution to cut cost and complexity when the campus is small."},
{id:"b2",d:2,q:"Which two are benefits of a routed access (Layer 3 access) design? (Choose two.)",o:["No STP needed on access-to-distribution uplinks","Faster convergence with ECMP uplinks","VLANs can span multiple access switches","No IP subnet planning needed","FHRP is required at the access layer"],a:[0,1],e:"Routed access removes STP from the uplinks and uses routing for fast ECMP convergence. The tradeoff is VLANs can't span access switches, and FHRP isn't needed since the access switch is the gateway."},
{id:"b3",d:2,q:"Which FHRP load-balances across multiple routers using one virtual IP address and multiple virtual MAC addresses?",o:["GLBP","HSRP","VRRP","HSRPv2"],a:[0],e:"GLBP's AVG hands out different virtual MACs to hosts, so several AVFs forward traffic at once for a single gateway IP."},
{id:"b4",d:2,q:"Which FHRP is an open standard?",o:["VRRP","HSRP","GLBP","None of them"],a:[0],e:"VRRP is IETF standard (RFC 5798). HSRP and GLBP are Cisco proprietary."},
{id:"b5",d:2,q:"In a Layer 2 access design with HSRP at the distribution layer, where should the STP root bridge for each VLAN be?",o:["On the distribution switch that's HSRP active for that VLAN","On the access switch with the most users in that VLAN","On the core switch so all VLANs share one root","On the distribution switch that's HSRP standby for that VLAN"],a:[0],e:"Aligning STP root with the HSRP active gateway keeps the forwarding path optimal and avoids traffic crossing the inter-distribution link."},
{id:"b6",d:2,q:"What is the main design benefit of StackWise Virtual (or VSS) at the distribution layer?",o:["Both switches act as one, so access uplinks use MEC with nothing blocked","It doubles the number of VLANs each access switch can carry","It lets the distribution pair run OSPF without needing areas","It removes the need for a separate core layer in every campus, no matter how large"],a:[0],e:"Multichassis EtherChannel from the access layer gives all links forwarding, simpler topology, and one logical gateway."},
{id:"b7",d:2,q:"Which feature should be enabled on PortFast access ports to stop a rogue switch from joining the STP topology?",o:["BPDU guard","Root guard","Loop guard","UDLD"],a:[0],e:"BPDU guard err-disables a PortFast port that receives a BPDU. Root guard is used on designated ports where a superior BPDU should never appear."},
{id:"b8",d:2,q:"Which feature detects one-way links on fiber connections that could cause STP loops?",o:["UDLD","BPDU filter","PortFast","Storm control"],a:[0],e:"UDLD detects unidirectional links (for example, one fiber strand failing) and can err-disable the port in aggressive mode."},
{id:"b9",d:2,q:"What is Cisco's general guideline for access-to-distribution uplink oversubscription?",o:["20:1","4:1","1:1","50:1"],a:[0],e:"Common guidance is 20:1 for access to distribution and 4:1 for distribution to core."},
{id:"b10",d:2,q:"Which three protocols make up the SD-Access control, data, and policy planes? (Choose three.)",o:["LISP","VXLAN","Cisco TrustSec (SGT)","OSPF","MPLS"],a:[0,1,2],e:"Control plane: LISP. Data plane: VXLAN. Policy plane: TrustSec with Scalable Group Tags."},
{id:"b11",d:2,q:"Which SD-Access node connects the fabric to external networks such as the WAN, data center, or internet?",o:["Border node","Edge node","Intermediate node","Extended node"],a:[0],e:"Border nodes are the fabric's gateway to outside networks and translate between fabric and non-fabric context."},
{id:"b12",d:2,q:"Which SD-Access node keeps the host tracking database that maps endpoints to their fabric locations?",o:["Control plane node","Border node (internal)","Edge node","Fabric WLC"],a:[0],e:"The control plane node runs LISP map-server/map-resolver and holds the EID-to-RLOC mappings."},
{id:"b13",d:2,q:"What does an SD-Access fabric edge node provide to endpoints?",o:["An anycast default gateway","The LISP map-server function","The external handoff to the WAN","The wireless control plane"],a:[0],e:"Every edge node hosts the same anycast gateway IP and MAC per subnet, so hosts can move anywhere in the fabric without changing their gateway."},
{id:"b14",d:2,q:"How does SD-Access provide macro-segmentation?",o:["Virtual networks (VRFs)","Scalable Group Tags (SGTs)","Private VLANs","Port ACLs"],a:[0],e:"Virtual networks (VRFs) give full routing separation between groups. SGTs handle micro-segmentation inside a VN."},
{id:"b15",d:2,q:"Within a single SD-Access virtual network, how do you stop two groups of users from talking to each other?",o:["SGT-based group policy","Separate VRFs for each group","Different anycast gateways","STP blocking between groups"],a:[0],e:"Scalable Group Tags with group-based access control policy enforce micro-segmentation within a VN."},
{id:"b16",d:2,q:"Which routing protocol does Catalyst Center LAN automation use to build the SD-Access underlay?",o:["IS-IS","OSPF","EIGRP","BGP"],a:[0],e:"LAN automation builds a routed IS-IS underlay. You can build your own underlay with OSPF manually, but automation uses IS-IS."},
{id:"b17",d:2,q:"Branch APs need to switch client traffic locally and keep serving clients if the WAN to the central WLC fails. Which AP mode fits?",o:["FlexConnect","Local mode","Monitor mode","Sniffer mode"],a:[0],e:"FlexConnect allows local switching at the branch and standalone operation if the controller is unreachable. Local mode tunnels all client traffic over CAPWAP."},
{id:"b18",d:2,q:"Which 2.4 GHz channels are non-overlapping in North America?",o:["1, 6, 11","1, 5, 9, 13","3, 7, 11","1, 4, 8, 11"],a:[0],e:"With 22 MHz channel width and 5 MHz spacing, only 1, 6 and 11 avoid overlap in the US."},
{id:"b19",d:2,q:"What minimum signal level at the cell edge is commonly recommended for voice-grade WLAN design?",o:["-67 dBm","-80 dBm","-50 dBm","-90 dBm"],a:[0],e:"-67 dBm with about 20% cell overlap is the usual target for voice over WLAN, with SNR of 25 dB or better."},
{id:"b20",d:2,q:"Guest wireless traffic from internal WLCs must be tunneled to a controller in the DMZ. What is this design called?",o:["Guest anchor (auto-anchor mobility)","FlexConnect central/local switching","Fabric-enabled wireless","Mesh mode with a root AP"],a:[0],e:"Foreign controllers tunnel guest traffic to an anchor WLC in the DMZ, keeping guest traffic off the internal network."},
{id:"b21",d:2,q:"Which pairing lets a dual-supervisor switch fail over without dropping traffic while routing reconverges?",o:["SSO with NSF","HSRP with preemption","UDLD with aggressive mode","STP with PortFast"],a:[0],e:"SSO keeps the standby supervisor in sync. NSF keeps forwarding using the existing FIB while routing protocol adjacencies recover gracefully."},
{id:"b22",d:2,q:"Where should the QoS trust boundary normally be placed in a campus design?",o:["As close to the endpoint as possible, at the access layer","At the core, where all traffic from every block converges","At the WAN edge only, where congestion usually happens","At the internet firewall, where traffic leaves the network"],a:[0],e:"Classify and mark (or trust trusted devices like IP phones) at the access edge so every downstream hop can act on the markings."},
{id:"b23",d:2,q:"In SD-Access fabric wireless, how does client data traffic flow?",o:["The AP sends it in VXLAN to the fabric edge, and the WLC handles control only","The AP tunnels it in CAPWAP to the WLC, which then forwards it into the fabric overlay","It's bridged in one flat VLAN that spans every edge node in the fabric","The AP sends it over GRE straight to the border node for routing"],a:[0],e:"Fabric APs send data directly into the fabric via VXLAN at the edge node, so wireless gets the same policy and anycast gateway as wired. The WLC stays control plane only."},

// ---------- Domain 3 ----------
{id:"c1",d:3,q:"Which Catalyst SD-WAN component authenticates WAN edge devices, orchestrates initial control connections, and helps with NAT traversal?",o:["SD-WAN Validator (vBond)","SD-WAN Controller (vSmart)","SD-WAN Manager (vManage)","WAN Edge"],a:[0],e:"The Validator is the orchestration plane: first point of contact, authentication, and NAT discovery."},
{id:"c2",d:3,q:"Which Catalyst SD-WAN component distributes routes and policy to WAN edges using OMP?",o:["SD-WAN Controller (vSmart)","SD-WAN Validator (vBond)","SD-WAN Manager (vManage)","SD-WAN Analytics"],a:[0],e:"The Controller is the control plane. It acts like a route reflector for OMP and pushes centralized policy."},
{id:"c3",d:3,q:"Which Catalyst SD-WAN component provides the GUI for configuration, templates, and monitoring?",o:["SD-WAN Manager (vManage)","SD-WAN Controller (vSmart)","SD-WAN Validator (vBond)","WAN Edge"],a:[0],e:"The Manager is the management plane: single pane for config, policy authoring, monitoring and software upgrades."},
{id:"c4",d:3,q:"What is the role of OMP in Catalyst SD-WAN?",o:["Advertises routes, TLOCs, and services between controllers and edges","Builds the IPsec data plane tunnels directly between each pair of WAN edges","Measures loss, latency, and jitter on every overlay tunnel","Authenticates new WAN edges when they first join the overlay"],a:[0],e:"OMP runs over the DTLS/TLS control connections and carries OMP routes, TLOC routes and service routes."},
{id:"c5",d:3,q:"Which three values identify an SD-WAN TLOC? (Choose three.)",o:["System IP","Color","Encapsulation","Site ID","VPN ID"],a:[0,1,2],e:"A TLOC is the tuple of system IP, color and encapsulation (IPsec or GRE)."},
{id:"c6",d:3,q:"How does SD-WAN application-aware routing measure path quality?",o:["BFD probes on each tunnel measure loss, latency, and jitter","SNMP polling of each WAN interface by the Manager","NetFlow records exported from each WAN edge to the Manager for analysis","ICMP pings sent from the Controller to each WAN edge"],a:[0],e:"BFD runs on every data plane tunnel, and SLA classes compare those measurements to choose the path for each app."},
{id:"c7",d:3,q:"Which three technologies make up DMVPN? (Choose three.)",o:["mGRE","NHRP","IPsec","LISP","GDOI"],a:[0,1,2],e:"DMVPN = multipoint GRE + NHRP for address resolution + IPsec for encryption (optional but standard). GDOI belongs to GETVPN."},
{id:"c8",d:3,q:"Which DMVPN phase supports dynamic spoke-to-spoke tunnels while letting the hub summarize routes to the spokes?",o:["Phase 3","Phase 1","Phase 2","None; summarization always breaks spoke-to-spoke"],a:[0],e:"Phase 3 uses NHRP redirect and shortcut, so the hub can send a summary or default and spokes still build direct tunnels. Phase 2 needs full specific routes on spokes."},
{id:"c9",d:3,q:"You need to encrypt any-to-any traffic across a private MPLS WAN while keeping the original IP header so provider QoS and routing still work. What fits best?",o:["GETVPN","DMVPN","FlexVPN site-to-site","SSL VPN"],a:[0],e:"GETVPN is tunnel-less group encryption that preserves the original IP header, ideal over a private any-to-any MPLS cloud. It isn't suited to the internet because of private addressing."},
{id:"c10",d:3,q:"Which protocol does GETVPN use to distribute keys from the key server to group members?",o:["GDOI","IKEv2","NHRP","LDP"],a:[0],e:"Group Domain of Interpretation (GDOI) delivers the group SA and keys from key servers to group members."},
{id:"c11",d:3,q:"In an MPLS Layer 3 VPN, which value makes overlapping customer prefixes unique in MP-BGP?",o:["Route distinguisher","Route target","MPLS VPN label (inner)","VRF name"],a:[0],e:"The RD is prepended to the IPv4 prefix to create a unique VPNv4 prefix. It does not control import or export."},
{id:"c12",d:3,q:"In an MPLS Layer 3 VPN, what controls which VRFs import a given VPN route?",o:["Route target","Route distinguisher","Site of origin","Next hop"],a:[0],e:"Route targets are extended communities. Export RT tags the route; a VRF imports routes carrying a matching import RT. This is how extranets and hub-and-spoke VPNs are built."},
{id:"c13",d:3,q:"Which Metro Ethernet service type is point-to-point?",o:["E-Line","E-LAN","E-Tree","E-Access"],a:[0],e:"E-Line = point-to-point (EPL/EVPL). E-LAN = multipoint-to-multipoint. E-Tree = rooted multipoint (hub and spoke)."},
{id:"c14",d:3,q:"Which branch WAN design gives the highest availability?",o:["Dual routers with dual carriers","Single router with dual carriers","Dual routers with one carrier","Single router with one carrier and LTE backup"],a:[0],e:"Dual router, dual carrier removes both the device and the provider as single points of failure."},
{id:"c15",d:3,q:"Which Catalyst SD-WAN feature picks the best path (local internet or backhaul) to apps like Microsoft 365 based on measured performance?",o:["Cloud OnRamp for SaaS","Cloud OnRamp for IaaS","Centralized data policy only","TLOC extension"],a:[0],e:"Cloud OnRamp for SaaS probes SaaS apps over each available exit and steers traffic to the best one."},
{id:"c16",d:3,q:"FlexVPN is built on which key exchange protocol?",o:["IKEv2","IKEv1","GDOI","ISAKMP aggressive mode"],a:[0],e:"FlexVPN unifies site-to-site, hub-and-spoke and remote access on IKEv2."},
{id:"c17",d:3,q:"What does VPLS provide?",o:["A multipoint Layer 2 emulated LAN over MPLS","A point-to-point Layer 3 VPN over MPLS","A routed IPsec overlay across the internet","A Layer 3 VPN that carries only multicast"],a:[0],e:"VPLS makes the provider network look like one big switch to the customer sites, with MAC learning done by the PEs."},

// ---------- Domain 4 ----------
{id:"d1",d:4,q:"Which DSCP value is recommended for voice bearer traffic?",o:["EF (46)","AF41 (34)","CS3 (24)","AF21 (18)"],a:[0],e:"Voice RTP is marked EF (46) and placed in the priority queue. CS3 is commonly used for call signaling."},
{id:"d2",d:4,q:"Per RFC 4594 based guidance, which DSCP is used for interactive video (multimedia conferencing)?",o:["AF41","EF","CS1","AF11"],a:[0],e:"Multimedia conferencing uses AF41. Real-time interactive (like TelePresence) uses CS4. Scavenger is CS1."},
{id:"d3",d:4,q:"Which DSCP marking is used for scavenger (less than best effort) traffic?",o:["CS1","CS0","AF11","CS2"],a:[0],e:"Scavenger is CS1 and gets a small, deprioritized queue. CS0 is default best effort."},
{id:"d4",d:4,q:"What queuing method gives voice strict priority while preventing it from starving other classes?",o:["LLQ, a strict priority queue with an implicit policer","FIFO, with voice packets placed first in line based on their marking","WFQ alone, which gives low-volume flows priority","Custom queuing with a large byte count for voice"],a:[0],e:"LLQ adds a strict priority queue to CBWFQ. The priority queue is policed during congestion so it can't starve other classes."},
{id:"d5",d:4,q:"Which statement about traffic shaping is true?",o:["It buffers excess traffic and smooths it out, applied outbound","It drops or re-marks excess traffic the moment it exceeds the rate","It can only be applied inbound, before traffic enters the router","It never adds delay, because excess packets are simply discarded"],a:[0],e:"Shaping queues excess traffic (adding delay) to conform to a rate. Policing drops or re-marks. Shaping is common on WAN links to a sub-rate service."},
{id:"d6",d:4,q:"What problem does WRED mainly solve?",o:["TCP global synchronization caused by tail drop","Jitter on voice calls during short congestion","Multicast flooding on access layer switches","Routing loops caused by redistribution"],a:[0],e:"WRED randomly drops packets before the queue fills, with lower-priority markings dropped first, so TCP flows don't all back off and ramp up together."},
{id:"d7",d:4,q:"What is the commonly cited one-way latency target for voice?",o:["150 ms or less","300 ms or less","50 ms or less","500 ms or less"],a:[0],e:"Voice targets: one-way latency 150 ms or less, jitter 30 ms or less, loss 1% or less."},
{id:"d8",d:4,q:"An app has many senders who are also receivers in the same group (many-to-many). Which PIM mode scales best?",o:["PIM-BIDIR","PIM-SSM","PIM-DM","PIM-SM with SPT switchover"],a:[0],e:"Bidirectional PIM uses a shared tree only, so routers keep (*,G) state instead of (S,G) per source."},
{id:"d9",d:4,q:"Receivers know the source address of a one-to-many video stream. Which multicast design avoids needing an RP?",o:["PIM-SSM with IGMPv3","PIM-SM with Auto-RP","PIM-BIDIR","PIM-DM"],a:[0],e:"SSM builds (S,G) trees straight to the source. IGMPv3 (or MLDv2) lets hosts specify the source."},
{id:"d10",d:4,q:"What is the default IPv4 address range for Source-Specific Multicast?",o:["232.0.0.0/8","239.0.0.0/8","224.0.0.0/24","233.0.0.0/8"],a:[0],e:"232.0.0.0/8 is reserved for SSM. 239/8 is administratively scoped, 224.0.0.0/24 is link-local, 233/8 is GLOP."},
{id:"d11",d:4,q:"How do you get RP redundancy and load sharing with multiple routers using the same RP address?",o:["Anycast RP with MSDP (or PIM Anycast RP)","Auto-RP with one mapping agent","A static RP on each router pointing to different IPs","PIM dense mode fallback"],a:[0],e:"Anycast RP puts the same address on several RPs. Routing sends each router to the closest one, and MSDP (or PIM anycast RP) syncs source info between them."},
{id:"d12",d:4,q:"What stops a Layer 2 switch from flooding multicast to every port in a VLAN?",o:["IGMP snooping","PIM snooping on routers only","Storm control","Port security"],a:[0],e:"IGMP snooping listens to joins and leaves and forwards multicast only to ports with interested receivers."},
{id:"d13",d:4,q:"What is the purpose of the multicast RPF check?",o:["Makes sure packets arrive on the interface leading back to the source","Makes sure multicast packets are encrypted before they're forwarded","Makes sure the DR is the router closest to the multicast source","Makes sure each group address is assigned by the RP only once"],a:[0],e:"Reverse Path Forwarding drops multicast that arrives on a non-RPF interface, which prevents loops and duplicates."},
{id:"d14",d:4,q:"Which SNMP option gives both authentication and encryption?",o:["SNMPv3 authPriv","SNMPv3 authNoPriv","SNMPv2c","SNMPv3 noAuthNoPriv"],a:[0],e:"authPriv authenticates (SHA) and encrypts (AES). v2c uses cleartext community strings."},
{id:"d15",d:4,q:"Which IETF standard flow export protocol is based on NetFlow v9?",o:["IPFIX","sFlow","SPAN","RMON"],a:[0],e:"IPFIX (RFC 7011) evolved from NetFlow v9 and uses flexible templates."},
{id:"d16",d:4,q:"Which open standard mechanism dynamically distributes RP information in PIM-SM?",o:["BSR","Auto-RP","MSDP","IGMP"],a:[0],e:"Bootstrap Router (BSR) is standards based (RFC 5059). Auto-RP is Cisco proprietary. MSDP shares source info between RPs."},

// ---------- Domain 5 ----------
{id:"e1",d:5,q:"What is YANG?",o:["A data modeling language","A transport protocol","An encoding format like JSON","A config management tool"],a:[0],e:"YANG defines the structure of config and operational data. NETCONF, RESTCONF and gNMI carry data that follows those models."},
{id:"e2",d:5,q:"What does NETCONF use for transport by default?",o:["SSH on TCP 830","HTTPS on TCP 443","gRPC on TCP 57400","SNMP on UDP 161"],a:[0],e:"NETCONF runs over SSH (RFC 6242) on port 830 and uses XML encoding."},
{id:"e3",d:5,q:"Which statement about RESTCONF is true?",o:["It uses HTTPS and supports JSON or XML encoding","It uses HTTPS but supports only XML encoding","It runs over SSH on port 830, just like NETCONF","It uses SNMP MIBs rather than YANG data models"],a:[0],e:"RESTCONF exposes YANG-modeled data through HTTP methods over HTTPS, encoded in JSON or XML."},
{id:"e4",d:5,q:"Which NETCONF datastore lets you stage changes before committing them to the running config?",o:["Candidate","Startup","Running","Operational"],a:[0],e:"The candidate datastore holds changes until a commit, which supports validation and all-or-nothing changes."},
{id:"e5",d:5,q:"Which RESTCONF HTTP method merges a partial change into existing config?",o:["PATCH","PUT","POST","GET"],a:[0],e:"PATCH merges. PUT replaces the target resource. POST creates a new resource. GET reads."},
{id:"e6",d:5,q:"What is the main advantage of model-driven telemetry over SNMP polling?",o:["Devices stream structured data, which is efficient and near real time","It keeps working even when the device loses all of its network connectivity","It needs no data models, so any tool can parse the output","It works only on older IOS 12.x platforms that lack SNMP"],a:[0],e:"Push-based streaming of YANG-modeled data scales better and gives finer granularity than periodic polling."},
{id:"e7",d:5,q:"gNMI is built on which framework?",o:["gRPC, using HTTP/2 and protocol buffers","SSH, using XML-encoded RPC messages","SNMP, using MIBs and community strings","Syslog, using UDP and severity levels"],a:[0],e:"gNMI uses gRPC, which runs over HTTP/2 and typically encodes with protobuf, for both config and streaming telemetry."},
{id:"e8",d:5,q:"Which set of YANG models is vendor neutral and maintained by network operators?",o:["OpenConfig","Cisco native models","IETF MIBs","Cisco IOS XE CLI models"],a:[0],e:"OpenConfig models are vendor neutral. Cisco native models expose platform-specific features. IETF also publishes standard YANG models."},
{id:"e9",d:5,q:"You want to know immediately when an interface goes down without streaming its state every few seconds. Which telemetry subscription type fits?",o:["On-change","Periodic at 1 second","Periodic at 60 seconds","SNMP trap only"],a:[0],e:"On-change sends an update only when the value changes, which is ideal for state like interface up/down."},
{id:"e10",d:5,q:"What is dial-out telemetry?",o:["The device starts the session and pushes data to the collector","The collector starts the session and subscribes to the data","The device sends SNMP traps to the collector when values change","The collector polls the device using NETCONF get operations"],a:[0],e:"Dial-out: config on the device tells it where to send data. Dial-in: the collector connects and requests a subscription (as with gNMI)."},

// ---------- Domain 1 (added) ----------
{id:"a25",d:1,q:"What is the most specific single summary for 172.16.32.0/24 through 172.16.47.0/24?",o:["172.16.32.0/20","172.16.32.0/19","172.16.32.0/21","172.16.0.0/18"],a:[0],e:"16 /24s = 2^4, so /20. 32 is a multiple of 16, so 172.16.32.0/20 covers .32 through .47 exactly."},
{id:"a26",d:1,q:"How many usable host addresses are in an IPv4 /26?",o:["62","64","30","126"],a:[0],e:"/26 leaves 6 host bits: 2^6 = 64, minus network and broadcast = 62."},
{id:"a27",d:1,q:"What is the shortest valid form of 2001:0db8:0000:0000:0000:ff00:0042:8329?",o:["2001:db8::ff00:42:8329","2001:db8:0:0:ff00:42:8329","2001:db8::ff00::42:8329","2001:db8::ff:42:8329"],a:[0],e:"Drop leading zeros in each hextet and replace one run of all-zero hextets with ::. :: can only appear once."},
{id:"a28",d:1,q:"With SLAAC, how does a host learn its IPv6 prefix?",o:["From ICMPv6 router advertisements","From a stateful DHCPv6 server","From ARP replies on the local link","From AAAA records on the DNS server"],a:[0],e:"Routers send RAs (and answer Router Solicitations) with the on-link prefix. The host builds its own interface ID."},
{id:"a29",d:1,q:"IPv6 has no broadcast. What replaces it?",o:["Multicast","Anycast","Unicast flooding","Link-local unicast"],a:[0],e:"Functions that used broadcast in IPv4 use multicast in IPv6, such as solicited-node multicast for neighbor discovery."},
{id:"a30",d:1,q:"Per RFC 6164, what prefix length is recommended for IPv6 point-to-point links between routers?",o:["/127","/64","/126","/112"],a:[0],e:"RFC 6164 recommends /127 on inter-router links to avoid neighbor cache exhaustion attacks. Many designs still reserve a /64 per link and configure a /127."},
{id:"a31",d:1,q:"Hosts should build their own address with SLAAC but get DNS servers from DHCPv6. How should the Router Advertisement flags be set?",o:["M=0, O=1","M=1, O=0","M=1, O=1","M=0, O=0"],a:[0],e:"M (managed) = 1 means get the address from DHCPv6. O (other config) = 1 means get other info like DNS from stateless DHCPv6."},
{id:"a32",d:1,q:"What is 6RD mainly used for?",o:["Letting a provider deliver IPv6 over its IPv4 network using its own prefix","Translating IPv6 to IPv4 at the edge so IPv6-only clients can reach IPv4 servers","Running IPv6 inside a single campus by tunneling it over ISATAP","Encrypting IPv6 traffic between customer sites over the internet"],a:[0],e:"6RD (rapid deployment) is based on 6to4 but uses the provider's own IPv6 prefix, so the provider controls routing and support."},
{id:"a33",d:1,q:"Which OSPF LSA type does the DR generate for a multiaccess segment?",o:["Type 2 (network)","Type 1 (router)","Type 3 (summary)","Type 5 (external)"],a:[0],e:"The DR originates a Type 2 network LSA listing the routers attached to the segment. Every router originates its own Type 1."},
{id:"a34",d:1,q:"What is an OSPF Type 7 LSA?",o:["An external route originated inside an NSSA","An inter-area summary route sent by an ABR","A link-local opaque LSA used for traffic engineering","A router LSA flooded only inside the backbone"],a:[0],e:"Type 7 carries externals inside an NSSA. The NSSA ABR translates it to Type 5 for the rest of the domain."},
{id:"a35",d:1,q:"What is an OSPF virtual link used for?",o:["Connecting an area that isn't attached to area 0, through a transit area","Load balancing inter-area traffic across two ABRs that connect the same area to area 0","Summarizing external routes injected by an ASBR in a regular area","Replacing the DR and BDR election on broadcast network segments"],a:[0],e:"A virtual link logically extends area 0 through a non-backbone transit area. It's a workaround, not a design goal; fix the topology long term."},
{id:"a36",d:1,q:"Two routers connect over a dedicated Ethernet link. Which OSPF network type avoids a DR/BDR election and speeds up adjacency?",o:["Point-to-point","Broadcast","NBMA","Point-to-multipoint non-broadcast"],a:[0],e:"Setting ip ospf network point-to-point on a two-router Ethernet link removes DR election and the wait timer, and avoids a Type 2 LSA."},
{id:"a37",d:1,q:"Your campus has 1G, 10G and 40G links, but OSPF gives them all a cost of 1. What should you change?",o:["The auto-cost reference bandwidth on all routers","The OSPF hello and dead intervals on all links","The administrative distance of OSPF routes","The router ID on each of the core routers"],a:[0],e:"The default reference is 100 Mbps, so anything 100M or faster costs 1. Raise auto-cost reference-bandwidth consistently on every router."},
{id:"a38",d:1,q:"With default K values, which values make up the classic EIGRP metric?",o:["Bandwidth and delay","Bandwidth, delay, load, and reliability","Hop count and delay","Bandwidth and MTU"],a:[0],e:"Default K1 = K3 = 1, others 0, so only minimum bandwidth and cumulative delay are used. Load and reliability are off by default."},
{id:"a39",d:1,q:"What typically causes EIGRP Stuck-in-Active (SIA) and how does design reduce it?",o:["Unanswered queries; limit query scope with summarization and stubs","Mismatched K values; use the same AS number on every router","Too many feasible successors; turn off variance on every router","Wide metrics; turn them off and go back to classic metrics"],a:[0],e:"SIA happens when a query goes unanswered too long. Bounding the query domain with summaries and stubs is the main design fix."},
{id:"a40",d:1,q:"How does EIGRP summarization affect queries?",o:["Routers that know only the summary reply right away, so queries stop there","Queries travel further, because every router must check the summary","It has no effect, because queries are always sent to every neighbor","Queries are converted into updates once they reach the summarizing router at the boundary"],a:[0],e:"Routers beyond the summary point don't know the specific prefix, so they reply immediately. That keeps queries local."},
{id:"a41",d:1,q:"Why does named-mode EIGRP use wide (64-bit) metrics?",o:["To tell apart fast interfaces like 10G, 40G and 100G accurately","To support IPv6 address families, which need larger metrics","To replace the feasibility condition with a newer loop check","To allow unequal-cost load balancing, which needs 64 bits"],a:[0],e:"Classic metrics flatten high-speed links. Wide metrics use picoseconds for delay and a larger scale so modern interfaces get distinct metrics."},
{id:"a42",d:1,q:"How does an IS-IS Level 1 router reach destinations in other areas by default?",o:["A default route toward the nearest L1/L2 router setting the ATT bit","A virtual link through the Level 1 area to the nearest L2 router","Redistributed external routes from every L1/L2 router in the area","A static route configured on every L1 router toward the backbone"],a:[0],e:"L1/L2 routers set the ATT bit in their L1 LSP. L1 routers install a default route to the nearest one, similar to a totally stubby area."},
{id:"a43",d:1,q:"What must be true of the IS-IS Level 2 backbone?",o:["It must be contiguous","It must be area 49.0000","It must contain only L2-only routers","It must use point-to-point links only"],a:[0],e:"The L2 backbone must be a contiguous chain of L2-capable routers. IS-IS has no virtual links to patch a split backbone."},
{id:"a44",d:1,q:"In the IS-IS NET 49.0001.1921.6800.1001.00, what is the area ID?",o:["49.0001","1921.6800.1001","00","49"],a:[0],e:"The last byte is the NSEL (00). The six bytes before it are the system ID. Everything before that is the area ID."},
{id:"a45",d:1,q:"On a Cisco router, which BGP attribute is evaluated first in best path selection?",o:["Weight, highest wins","Local preference, highest wins","AS-path length, shortest wins","MED, lowest wins"],a:[0],e:"Order starts: weight, local preference, locally originated, AS-path length, origin, MED, eBGP over iBGP, IGP metric to next hop."},
{id:"a46",d:1,q:"After weight, which BGP attribute is compared next?",o:["Local preference","AS-path length","Origin","MED"],a:[0],e:"Local preference comes right after weight, which is why it's the main tool for AS-wide outbound policy."},
{id:"a47",d:1,q:"An internal iBGP router can't use routes learned from an eBGP peer because the next hop is unreachable. What's the usual fix?",o:["Configure next-hop-self on the border router toward iBGP peers","Add a default route on the eBGP peer that points back toward the enterprise network","Increase the TTL on iBGP sessions using eBGP multihop","Turn on BGP synchronization on all internal routers"],a:[0],e:"iBGP doesn't change the eBGP next hop by default. next-hop-self (or advertising the external link into the IGP) fixes reachability."},
{id:"a48",d:1,q:"Which two attributes prevent routing loops in a route reflector design? (Choose two.)",o:["Originator ID","Cluster list","MED","Atomic aggregate","Weight"],a:[0,1],e:"A router drops a route carrying its own originator ID, and an RR drops a route whose cluster list already contains its cluster ID."},
{id:"a49",d:1,q:"What does a BGP confederation do?",o:["Splits one AS into sub-ASes that peer with each other, shrinking the iBGP mesh","Combines several ISPs into one public AS for a multihomed customer","Hides private AS numbers from the internet when routes leave the AS through an ISP edge","Lets eBGP peers exchange local preference across AS boundaries"],a:[0],e:"Inside the confederation, sub-ASes run eBGP-like sessions, but to the outside world it looks like one AS. It's an alternative to route reflectors."},
{id:"a50",d:1,q:"An enterprise is dual-homed to two ISPs with BGP. How do you keep it from becoming a transit path between the ISPs?",o:["Filter outbound so only your own prefixes are sent, such as AS-path ^$","Set a higher local preference on routes received from one ISP","Send a lower MED to one ISP so it becomes the preferred path","Prepend your own AS several times on every route advertised to both of the ISPs"],a:[0],e:"If you re-advertise one ISP's routes to the other, you can become transit. Outbound filtering on locally originated routes prevents it. Accepting only defaults inbound doesn't stop it by itself."},
{id:"a51",d:1,q:"Which tool can match a prefix along with a range of allowed prefix lengths?",o:["Prefix list with ge and le","Standard ACL","Distribute list with a wildcard","Community list"],a:[0],e:"Prefix lists match the network bits and can match a length range with ge/le, such as 10.0.0.0/8 le 24."},
{id:"a52",d:1,q:"What is a floating static route?",o:["A static route with a higher AD than the dynamic route, used only as backup","A static route that points to Null0 to discard traffic for a summary","A static route redistributed into BGP so the ISP can reach the network","A static route whose next hop follows whatever the IGP currently chooses"],a:[0],e:"Setting the AD above the dynamic protocol's AD keeps the static out of the table until the dynamic route disappears."},
{id:"a53",d:1,q:"What is policy-based routing used for?",o:["Forwarding on criteria other than destination, such as source subnet","Filtering routing updates that are exchanged between two different routing protocols","Summarizing routes at a boundary to shrink the routing table","Influencing the BGP best path through route attributes"],a:[0],e:"PBR uses route maps to set the next hop or interface by source, protocol, or other match criteria. It overrides the routing table for matched traffic."},
{id:"a54",d:1,q:"What does VRF-Lite provide?",o:["Multiple separate routing tables on one router without MPLS","MPLS label switching across the WAN between PE routers","Route reflection of VPN routes between many PE routers in an MPLS core","Encryption of traffic passing between two separate VRFs"],a:[0],e:"VRF-Lite gives hop-by-hop path isolation using VRFs and 802.1Q subinterfaces or SVIs. It doesn't scale like MPLS VPNs but needs no MPLS."},

// ---------- Domain 2 (added) ----------
{id:"b24",d:2,q:"In a three-tier campus, which layer should focus on fast, reliable transport and avoid complex policy?",o:["Core","Distribution","Access","Services block"],a:[0],e:"The core should be simple and fast. Policy, filtering and summarization belong at distribution; endpoint features at access."},
{id:"b25",d:2,q:"Which is a primary role of the campus distribution layer?",o:["Aggregate access switches, apply policy, and summarize toward the core","Connect endpoints, provide PoE, and enforce port security on each user port","Connect the campus to the internet and run the edge firewalls","Host data center servers and provide storage connectivity"],a:[0],e:"Distribution aggregates access blocks, is often the L2/L3 boundary, and is the right place to summarize and apply policy."},
{id:"b26",d:2,q:"What is a main benefit of a hierarchical, modular campus design?",o:["Fault isolation and easier scaling and troubleshooting","Fewer IP subnets","No need for redundancy","Lower latency than any flat design in all cases, for every traffic type"],a:[0],e:"Modules (building blocks) contain failures, let you grow by adding blocks, and keep each layer's role clear."},
{id:"b27",d:2,q:"Why does Cisco recommend not spanning VLANs across multiple access switches?",o:["It keeps STP domains small and limits failure domains","It increases broadcast domain size for better discovery","It's required for PoE","It allows more VLANs per switch"],a:[0],e:"VLANs confined to one access switch avoid large STP topologies and loops, and let you run a loop-free design."},
{id:"b28",d:2,q:"What is the main benefit of Rapid PVST+ over classic PVST+?",o:["Much faster convergence based on 802.1w","Support for many more VLANs per trunk","No root bridge election is needed at all","It runs across Layer 3 links between switches"],a:[0],e:"RSTP uses proposal and agreement handshakes and alternate ports to converge in a second or less instead of 30 to 50 seconds."},
{id:"b29",d:2,q:"What is the main design benefit of MST (802.1s)?",o:["It maps many VLANs to a few instances, reducing CPU and BPDU load","It removes the need for a root bridge in each VLAN","It converges more slowly but avoids loops more safely","It works only on routed links between distribution and core switches in a campus"],a:[0],e:"MST groups VLANs into instances, so a switch with hundreds of VLANs runs a handful of STP instances instead of hundreds."},
{id:"b30",d:2,q:"What does loop guard prevent?",o:["An alternate or root port turning designated when BPDUs stop","A user connecting a rogue switch to an access edge port","A downstream switch sending superior BPDUs to become root","Broadcast storms caused by a looping end host"],a:[0],e:"If BPDUs stop on a blocking port (for example, due to a one-way link), loop guard puts it in loop-inconsistent state instead of forwarding."},
{id:"b31",d:2,q:"Where should root guard be configured in a classic campus design?",o:["On distribution downlinks toward access switches","On access ports that connect to user PCs","On the links between the two core switches in the campus backbone","On the WAN interface toward the provider"],a:[0],e:"Root guard on distribution downlinks keeps an access switch from ever becoming root, protecting your planned root placement."},
{id:"b32",d:2,q:"How can HSRP fail over when the active router's uplink goes down but its LAN interface stays up?",o:["Object tracking that lowers priority, with preemption on the standby","Shorter hello and hold timers on both HSRP routers","Turning off preemption so the standby keeps the role","Configuring a different virtual MAC address on the standby router for the group"],a:[0],e:"Tracking the uplink decrements the active router's priority. With preempt on the peer, the peer takes over."},
{id:"b33",d:2,q:"What is the default HSRP priority?",o:["100","0","1","255"],a:[0],e:"Default is 100. Highest priority wins; ties break on highest IP address."},
{id:"b34",d:2,q:"Which EtherChannel mode actively starts LACP negotiation?",o:["Active","Passive","Desirable","On"],a:[0],e:"LACP uses active and passive. Desirable and auto are PAgP. On forms a channel with no negotiation protocol, which is riskier."},
{id:"b35",d:2,q:"What's the recommended way to connect distribution switches to the core?",o:["Routed point-to-point links in triangles with ECMP","Layer 2 trunks with STP blocking redundant paths","A single routed link from each to one core switch","Routed links in squares with no redundant paths"],a:[0],e:"Routed triangle links give each distribution switch two equal-cost paths, so failover happens in hardware without waiting on routing."},
{id:"b36",d:2,q:"Why are triangles preferred over squares in campus Layer 3 design?",o:["A failed link is covered by the other ECMP path right away, without reconvergence","Triangles need fewer switches and fewer links than squares for the same number of blocks","Squares can't run OSPF because they create a DR election problem","Triangles avoid the need for IP addressing on the links between layers"],a:[0],e:"In a square, a failed link forces the routing protocol to find a new path. In a triangle, the second path is already in the forwarding table."},
{id:"b37",d:2,q:"What is the main benefit of summarizing at the distribution layer toward the core?",o:["Smaller core routing tables and contained query or LSA scope","Faster PoE negotiation for devices connected to access switches","Larger broadcast domains that span multiple access switches","No need for an IGP between the distribution and core layers"],a:[0],e:"Summaries hide access-block changes from the core, which improves stability and convergence."},
{id:"b38",d:2,q:"A new Wi-Fi AP needs more than 30 W of PoE. Which standard should the access switch support?",o:["802.3bt","802.3af","802.3at","802.3ad"],a:[0],e:"802.3af is up to 15.4 W, 802.3at (PoE+) up to 30 W, and 802.3bt (UPOE/PoE++) up to 60 or 90 W at the switch port. 802.3ad is link aggregation."},
{id:"b39",d:2,q:"Wi-Fi 6 APs can push more than 1 Gbps, but the building has existing Cat5e/Cat6. What switch feature helps?",o:["Multigigabit (2.5 and 5 Gbps) ports","Gigabit ports bundled with LACP","SFP fiber ports only","Gigabit ports with PoE turned off"],a:[0],e:"mGig runs 2.5 and 5 Gbps over most existing Cat5e/Cat6 runs, so you don't need to recable."},
{id:"b40",d:2,q:"In a high-density 5 GHz design, which channel width is usually best?",o:["20 MHz","80 MHz","160 MHz","40 MHz always"],a:[0],e:"Narrower channels give more non-overlapping channels and less co-channel interference, which matters more than per-client peak speed in dense areas."},
{id:"b41",d:2,q:"What design impact do DFS channels have?",o:["APs must detect radar and leave the channel, briefly disrupting clients","They can't be used indoors, so they apply only to outdoor deployments","They only exist in the 2.4 GHz band, so they don't affect 5 GHz designs","They require WPA3, so older clients can't connect to them at all"],a:[0],e:"DFS channels add capacity in 5 GHz but must vacate on radar detection. Some designs avoid them near airports or weather radar."},
{id:"b42",d:2,q:"What security is required for SSIDs on the 6 GHz band?",o:["WPA3, or OWE for open networks","WPA2-PSK, the same as 5 GHz","WEP, for legacy client support","No encryption, for faster roaming"],a:[0],e:"Wi-Fi 6E in 6 GHz requires WPA3 and protected management frames. Open SSIDs must use Enhanced Open (OWE)."},
{id:"b43",d:2,q:"Which amendment speeds up roaming by pre-establishing keys with the target AP?",o:["802.11r (Fast BSS Transition)","802.11k (neighbor reports)","802.11v (BSS transition management)","802.11w (protected management frames)"],a:[0],e:"802.11r cuts roam time for voice. 802.11k gives neighbor reports, 802.11v helps steer clients, 802.11w protects management frames."},
{id:"b44",d:2,q:"Which amendment helps a client find nearby APs to roam to using neighbor reports?",o:["802.11k","802.11r","802.11w","802.11ac"],a:[0],e:"802.11k neighbor reports shrink the list of channels a client scans, which speeds up roaming decisions."},
{id:"b45",d:2,q:"Which WLC redundancy option keeps APs and clients connected during a controller failover?",o:["AP and client SSO with an HA pair","N+1 with a backup controller","Primary and secondary controller names on APs","Mobility groups only"],a:[0],e:"SSO keeps AP and client state synced to the standby WLC. N+1 makes APs rejoin another controller, which drops clients briefly."},
{id:"b46",d:2,q:"In a high-density venue like a lecture hall, what should the WLAN design prioritize?",o:["Capacity: more APs, lower power, and smaller cells","Coverage: fewer APs running at maximum power","Simplicity: use only the 2.4 GHz band for all clients","Throughput: use 160 MHz channels on every AP"],a:[0],e:"Dense areas are capacity limited. Smaller cells and more channels spread clients across more radios."},
{id:"b47",d:2,q:"A small site has a handful of APs and no budget for controller hardware. Which Catalyst 9800 option fits?",o:["Embedded Wireless Controller (EWC) on an AP","9800-80 appliance","9800-CL in a large data center cluster","A Meraki MX"],a:[0],e:"EWC runs the controller on a Catalyst 9100 AP, which suits small sites. 9800-CL and appliances suit larger deployments."},
{id:"b48",d:2,q:"What is SD-Access fabric in a box?",o:["One switch acting as border, control plane and edge for a small site","A fabric site that has only wireless access points and no wired edge","A fabric whose control plane node is hosted in the public cloud","A fabric that runs without any underlay network between nodes"],a:[0],e:"Small sites can run all fabric roles on one switch (often a stack) to get SD-Access policy without extra hardware."},
{id:"b49",d:2,q:"Which transit between SD-Access sites carries VN and SGT context natively?",o:["SD-Access transit","IP-based transit","Layer 2 transit","Internet transit with NAT"],a:[0],e:"SD-Access transit uses LISP and VXLAN between sites, keeping VN and SGT in the header. IP transit needs VRF-Lite and SGT propagation configured separately."},
{id:"b50",d:2,q:"What is an SD-Access extended node used for?",o:["Extending fabric to switches that can't be full edges, like IE switches","Running the LISP control plane node role for small buildings at the edge of the fabric","Connecting the fabric to the WAN and handing off VNs to it","Hosting Catalyst Center software on a switch inside the fabric"],a:[0],e:"Extended nodes hang off an edge node and bring endpoints in places like factory floors into the fabric with limited features."},
{id:"b51",d:2,q:"During migration to SD-Access, how can a traditional VLAN share a subnet with fabric endpoints?",o:["Layer 2 handoff on a border node","Layer 3 handoff only","Run STP across the fabric","A GRE tunnel from the legacy network to each edge"],a:[0],e:"Layer 2 border handoff bridges a fabric subnet to a legacy VLAN so hosts can move gradually without readdressing."},
{id:"b52",d:2,q:"In SD-Access, which component defines SGTs and group-based access policy?",o:["Cisco ISE","The border node","The control plane node","The WLC"],a:[0],e:"Catalyst Center provides the UI, but ISE is the policy engine that holds SGTs and the policy matrix and pushes it to the fabric."},
{id:"b53",d:2,q:"When an endpoint connects to a fabric edge node, what does the edge node do with the endpoint's identity?",o:["Registers the endpoint (EID) with the control plane node","Floods the endpoint information to all other edge nodes","Sends the endpoint information to the border node only","Stores the endpoint information only in its local table"],a:[0],e:"The edge registers the EID-to-RLOC mapping with the control plane node, which other nodes query to find the endpoint."},
{id:"b54",d:2,q:"What does storm control do on an access port?",o:["Limits broadcast, multicast, or unknown unicast traffic above a threshold","Prevents STP loops on its own, without needing BPDU Guard configured on that port","Encrypts traffic on the port using MACsec between switch and host","Detects one-way fiber links and err-disables the port when found"],a:[0],e:"Storm control suppresses or shuts down a port when flood traffic exceeds a threshold, limiting the damage from loops or misbehaving hosts."},

// ---------- Domain 3 (added) ----------
{id:"c18",d:3,q:"Which SD-WAN color is treated as private by default, so tunnels use private IPs without NAT?",o:["mpls","biz-internet","public-internet","lte"],a:[0],e:"Private colors include mpls, metro-ethernet, and private1 through private6. Public colors like biz-internet and lte use the post-NAT public address."},
{id:"c19",d:3,q:"What does the restrict keyword do on an SD-WAN TLOC color?",o:["Only builds data plane tunnels to TLOCs of the same color","Blocks all control connections that use that color","Disables BFD probes on tunnels that use that color","Limits that color so it carries only management traffic for the WAN edge"],a:[0],e:"restrict stops tunnels between different colors, often used on MPLS so it only connects to other MPLS TLOCs."},
{id:"c20",d:3,q:"In Catalyst SD-WAN, what is VPN 0?",o:["The transport VPN for WAN interfaces and control connections","The management VPN used for out-of-band access to each WAN edge device","The default service VPN for user LAN subnets","A reserved VPN number that has no practical use"],a:[0],e:"VPN 0 holds transport (WAN) interfaces. VPN 512 is out-of-band management. Service VPNs carry user traffic."},
{id:"c21",d:3,q:"Where does SD-WAN user traffic like corporate LAN subnets live?",o:["In a service VPN, such as VPN 1","In the transport VPN, VPN 0","In the management VPN, VPN 512","In the TLOC color for each transport"],a:[0],e:"Service VPNs (1 to 511 and higher ranges, excluding 0 and 512) segment user traffic, similar to VRFs."},
{id:"c22",d:3,q:"What do SD-WAN control connections between WAN edges and controllers use by default?",o:["DTLS","IPsec","GRE","Plain TCP"],a:[0],e:"Control plane connections use DTLS by default, with TLS as an option. Data plane tunnels between edges use IPsec."},
{id:"c23",d:3,q:"What encapsulation do SD-WAN data plane tunnels use by default?",o:["IPsec","DTLS","VXLAN","MPLS"],a:[0],e:"Edges build IPsec tunnels between TLOCs. GRE is also supported."},
{id:"c24",d:3,q:"You want branches to talk only through regional hubs instead of full mesh. Which SD-WAN policy type sets that topology?",o:["Centralized control policy","Localized data policy","App-aware routing policy","QoS policy"],a:[0],e:"Centralized control policy on the Controller changes which OMP routes and TLOCs each site learns, which shapes the overlay topology."},
{id:"c25",d:3,q:"QoS queuing and interface ACLs on an SD-WAN edge are configured with which policy type?",o:["Localized policy","Centralized control policy","Centralized data policy","OMP policy"],a:[0],e:"Localized policies are applied on the device itself via templates, covering QoS, ACLs, and route policy."},
{id:"c26",d:3,q:"A site has two WAN edges, each with one different circuit. How can both edges use both circuits?",o:["TLOC extension","OMP graceful restart","VPN 512","A centralized data policy"],a:[0],e:"TLOC extension lets one edge reach the other edge's transport over a local link, so each router can build tunnels on both circuits."},
{id:"c27",d:3,q:"Which SD-WAN feature automates connectivity from branches to AWS, Azure, or Google Cloud?",o:["Cloud OnRamp for Multicloud","Cloud OnRamp for SaaS apps","TLOC extension","Service chaining"],a:[0],e:"Cloud OnRamp for Multicloud builds and manages the connection into cloud transit gateways or virtual WANs."},
{id:"c28",d:3,q:"During zero-touch provisioning, how does a new WAN edge find the SD-WAN Validator?",o:["It contacts Cisco PnP Connect, which supplies the organization and Validator","It's hardcoded at the factory with your organization's Validator address and certificate","It broadcasts a discovery request on the WAN until a Validator answers","It learns the Validator address from the MPLS provider's PE router"],a:[0],e:"The device reaches PnP Connect (ZTP) over the internet, is matched to your org by serial number, and gets pointed at your Validator."},
{id:"c29",d:3,q:"What topology does DMVPN Phase 1 support?",o:["Hub-and-spoke only","Dynamic spoke-to-spoke with hub summarization","Full mesh with no hub","Spoke-to-spoke with no NHRP"],a:[0],e:"In Phase 1, spokes use point-to-point GRE to the hub, so all traffic goes through the hub."},
{id:"c30",d:3,q:"What is a limitation of DMVPN Phase 2?",o:["The hub can't summarize or change the next hop, so spokes need specific routes","It can't use IPsec, so all spoke traffic crosses the transport unencrypted","It supports only static routing, so dynamic protocols can't run over it","It doesn't allow spoke-to-spoke tunnels, so all traffic goes through the hub"],a:[0],e:"Phase 2 spoke-to-spoke depends on spokes seeing the remote spoke as next hop, so the hub must pass specific routes unchanged."},
{id:"c31",d:3,q:"What does NHRP do in DMVPN?",o:["Maps tunnel IP addresses to NBMA (physical) addresses","Encrypts the tunnel traffic between hub and spokes","Exchanges routing information between hub and spokes","Assigns tunnel IP addresses to spokes when they join"],a:[0],e:"Spokes register their tunnel-to-public mapping with the hub (NHS) and query it to build direct spoke-to-spoke tunnels."},
{id:"c32",d:3,q:"A DMVPN design uses two hubs, each with its own tunnel interface and subnet. What is this called?",o:["Dual cloud","Single cloud","Phase 1 redundancy","GETVPN cooperative"],a:[0],e:"Dual cloud gives separate DMVPN clouds per hub, which makes routing policy and traffic engineering clearer. Single cloud puts both hubs in one subnet."},
{id:"c33",d:3,q:"Which IPsec protocol provides confidentiality (encryption)?",o:["ESP","AH","IKE","GRE"],a:[0],e:"ESP encrypts and authenticates. AH only authenticates and breaks with NAT. IKE negotiates keys."},
{id:"c34",d:3,q:"What does IPsec tunnel mode do?",o:["Encrypts the whole original packet and adds a new IP header","Encrypts only the payload and keeps the original IP header in place","Only authenticates the packet","Encrypts only the IP header"],a:[0],e:"Tunnel mode wraps the original packet. Transport mode keeps the original header and protects the payload, often used with GRE over IPsec."},
{id:"c35",d:3,q:"Why is GETVPN a poor fit over the public internet?",o:["It keeps the original private IP header, which isn't routable on the internet","It can't encrypt unicast traffic, so it only protects multicast streams sent between sites","It supports only hub-and-spoke topologies, not any-to-any connectivity","It requires DMVPN Phase 1 tunnels underneath to forward any traffic"],a:[0],e:"Header preservation is great on a private MPLS network but private addresses can't cross the internet. Use DMVPN, FlexVPN or SD-WAN there."},
{id:"c36",d:3,q:"Which PE-CE routing protocol is generally the most flexible and scalable choice for a multihomed MPLS L3VPN site?",o:["eBGP","Static routes","RIPv2","OSPF with no sham links"],a:[0],e:"eBGP gives the most policy control and scales well. OSPF and EIGRP are options too, but bring extra design considerations."},
{id:"c37",d:3,q:"A site uses OSPF as the PE-CE protocol and also has a backdoor link in the same area. What makes the MPLS path preferred?",o:["An OSPF sham link","A virtual link","A higher AD on the backdoor","An NSSA"],a:[0],e:"Without a sham link, MPLS-learned routes appear as inter-area and lose to intra-area backdoor routes. The sham link makes the MPLS path intra-area."},
{id:"c38",d:3,q:"Which protocol commonly distributes labels in an MPLS provider core?",o:["LDP","OMP","NHRP","GDOI"],a:[0],e:"LDP builds label bindings for IGP prefixes, giving PEs label-switched paths to each other."},
{id:"c39",d:3,q:"What does MP-BGP carry between PE routers in an MPLS L3VPN?",o:["VPNv4 or VPNv6 routes with VPN labels and route targets","Only plain IPv4 unicast routes from the global table","LDP labels for every PE loopback in the provider core","OSPF LSAs copied from each customer site's routers"],a:[0],e:"MP-BGP carries RD-prefixed routes, the inner VPN label, and RT communities so the remote PE can import them into the right VRF."},
{id:"c40",d:3,q:"Which Metro Ethernet service lets several virtual circuits share one UNI, separated by VLAN?",o:["EVPL","EPL","EP-LAN","E-Tree port-based"],a:[0],e:"Ethernet Virtual Private Line multiplexes services by VLAN on one port. EPL is port-based, one service per UNI."},
{id:"c41",d:3,q:"A branch has a 1 Gbps Ethernet handoff but only a 100 Mbps contracted rate. What QoS design fits?",o:["Hierarchical QoS: shape the parent to 100 Mbps and queue inside it","Queue at 1 Gbps on the physical interface, with no shaping configured on the router","Police traffic inbound only, and leave egress untouched","Turn off QoS and rely on the provider to prioritize voice"],a:[0],e:"Without shaping, the router never sees congestion and the provider drops traffic blindly. Shaping to CIR creates the queue where your policy applies."},
{id:"c42",d:3,q:"Branches use local internet breakout. What delivers firewall, DNS, and web security for that traffic without backhauling it?",o:["A cloud-delivered security service (SSE or SASE)","GETVPN group encryption between all branches","MPLS QoS classes on the provider network","OMP route filtering on the SD-WAN controllers"],a:[0],e:"SSE/SASE services (such as Cisco Secure Access) inspect branch DIA traffic in the cloud, often reached via tunnels from the SD-WAN edge."},
{id:"c43",d:3,q:"About how much downtime per year does 99.999% availability allow?",o:["About 5 minutes","About 52 minutes","About 8.7 hours","About 1 minute"],a:[0],e:"Five nines is roughly 5.26 minutes a year. Four nines is about 52.6 minutes, three nines about 8.76 hours."},

// ---------- Domain 4 (added) ----------
{id:"d17",d:4,q:"Which DSCP is commonly used for call signaling (SIP, SCCP)?",o:["CS3","EF","AF41","CS1"],a:[0],e:"Call signaling uses CS3 (24). Voice media uses EF."},
{id:"d18",d:4,q:"Which DSCP is used for routing protocol traffic (network control)?",o:["CS6","CS3","EF","AF31"],a:[0],e:"Network control like OSPF and BGP is CS6 (48). CS7 is reserved."},
{id:"d19",d:4,q:"Which DSCP is recommended for transactional data, like ERP or interactive apps?",o:["AF21","AF11","CS1","EF"],a:[0],e:"Transactional/low-latency data is AF21. Bulk data is AF11. Scavenger is CS1."},
{id:"d20",d:4,q:"Which AF41-class marking has the highest drop probability?",o:["AF43","AF41","AF42","They're all equal"],a:[0],e:"In AFxy, x is the class and y is drop precedence. AF43 is dropped first by WRED within class 4."},
{id:"d21",d:4,q:"How many bits make up the DSCP field?",o:["6","3","8","4"],a:[0],e:"DSCP is 6 bits of the ToS/Traffic Class byte, giving 64 values. The other 2 bits are ECN."},
{id:"d22",d:4,q:"Which Layer 2 marking carries priority in an 802.1Q tag, and what value is voice?",o:["CoS (3 bits), voice = 5","DSCP (6 bits), voice = 46","IP Precedence, voice = 7","EXP, voice = 3"],a:[0],e:"802.1p CoS lives in the 802.1Q tag. Voice is CoS 5, which maps to EF at Layer 3."},
{id:"d23",d:4,q:"What is the common guideline for how much bandwidth the strict priority queue should get?",o:["No more than about 33% of the link","At least 75% of the link","Exactly 50% of the link","All of the link during congestion"],a:[0],e:"Keeping priority traffic at or below about one third leaves room for data apps and limits impact if priority traffic misbehaves."},
{id:"d24",d:4,q:"Which feature classifies traffic by application using deep packet inspection?",o:["NBAR2","WRED","CBWFQ","IP SLA"],a:[0],e:"NBAR2 recognizes over a thousand applications, letting QoS classify by app rather than just ports or ACLs."},
{id:"d25",d:4,q:"What can a policer do with traffic that exceeds the rate? (Choose two.)",o:["Drop it","Re-mark it to a lower class","Buffer it for later","Compress it","Fragment it"],a:[0,1],e:"Policers drop or mark down excess traffic. Buffering is what shapers do."},
{id:"d26",d:4,q:"A single-rate three-color policer (RFC 2697) sorts traffic into which three outcomes?",o:["Conform, exceed, violate","Green, yellow, blue","Accept, queue, drop","Priority, normal, scavenger"],a:[0],e:"Each outcome can get its own action, such as transmit, mark down, or drop."},
{id:"d27",d:4,q:"What are the four WMM access categories used for QoS on Wi-Fi?",o:["Voice, video, best effort, background","Gold, silver, bronze, platinum","EF, AF, CS, default","Real-time, interactive, bulk, control"],a:[0],e:"WMM maps traffic into four ACs with different contention parameters. The WLC maps DSCP to these on the air."},
{id:"d28",d:4,q:"Where does queuing policy actually matter?",o:["At egress congestion points, like WAN edges and uplinks","On every ingress port equally, before traffic is switched","Only on the core, where all traffic from the campus meets","Only on access ports facing PCs, where users connect"],a:[0],e:"Queuing only kicks in when an interface is congested. Speed mismatch points like the WAN edge are where it counts most."},
{id:"d29",d:4,q:"What is special about the 224.0.0.0/24 multicast range?",o:["It's link-local control traffic, like OSPF hellos, that routers don't forward","It's reserved for source-specific multicast and needs IGMPv3 on every receiver","It's administratively scoped for private use inside an organization","It's globally routed on the internet for public multicast services"],a:[0],e:"224.0.0.0/24 is local network control, sent with TTL 1. Examples: 224.0.0.5 and .6 for OSPF, .10 for EIGRP."},
{id:"d30",d:4,q:"How is an IPv4 multicast group mapped to an Ethernet MAC address?",o:["01:00:5e plus the low 23 bits of the group, so 32 groups share a MAC","01:00:5e plus all 28 group bits, so every multicast group gets its own MAC","The broadcast MAC ff:ff:ff:ff:ff:ff is used for every group","The router's own MAC address combined with the group number"],a:[0],e:"Only 23 of the 28 variable bits fit, so 32 IP groups map to one MAC. Avoid picking groups that overlap at Layer 2."},
{id:"d31",d:4,q:"What does IGMPv3 add over IGMPv2?",o:["Source filtering, which SSM needs","Faster leave processing for receivers","Support for IPv6 multicast groups","An election of the IGMP querier"],a:[0],e:"IGMPv3 lets hosts join (S,G) for specific sources (include/exclude). IGMPv2 added leave messages; MLD is the IPv6 equivalent."},
{id:"d32",d:4,q:"In PIM-SM on Cisco, when does a last-hop router switch from the shared tree to the shortest path tree by default?",o:["After the first packet arrives, a threshold of 0","Never, unless an SPT threshold is configured","After traffic for the group passes 10 Mbps","Only if the RP for the group becomes unreachable"],a:[0],e:"Cisco's default SPT threshold is 0, so it switches to the source tree right away. You can set infinity to stay on the shared tree."},
{id:"d33",d:4,q:"In PIM-SM, how does the first-hop router tell the RP about a new source?",o:["Unicast PIM Register messages that encapsulate the multicast data","IGMP membership reports sent from the source toward the RP","MSDP source-active messages sent from the first-hop router","Broadcasts on the local segment that the RP listens for and forwards to receivers"],a:[0],e:"The source's DR sends Register messages to the RP. The RP then joins toward the source and sends Register-Stop."},
{id:"d34",d:4,q:"What is MSDP used for?",o:["Sharing active source information between RPs, across domains or in anycast RP","Electing the designated router on each multicast-enabled LAN segment in the PIM domain","Distributing group-to-RP mappings to all routers in a PIM domain","Replacing IGMP between hosts and their first-hop multicast routers"],a:[0],e:"MSDP peers exchange Source-Active messages so RPs learn about sources registered with other RPs."},
{id:"d35",d:4,q:"Auto-RP uses which two groups?",o:["224.0.1.39 and 224.0.1.40","224.0.0.5 and 224.0.0.6","232.0.0.1 and 232.0.0.2","239.255.255.250 and 239.255.255.251"],a:[0],e:"Candidate RPs announce on 224.0.1.39. Mapping agents send discovery on 224.0.1.40. Auto-RP is Cisco proprietary."},
{id:"d36",d:4,q:"Which protocol do IPv6 hosts use to signal multicast group membership?",o:["MLD","IGMPv3","PIMv6 hellos","NDP Router Solicitation"],a:[0],e:"MLDv1 is like IGMPv2 and MLDv2 is like IGMPv3. MLD runs over ICMPv6."},
{id:"d37",d:4,q:"What is IPv6 Embedded RP?",o:["The RP address is encoded inside the multicast group address","The RP runs inside the WLC for wireless multicast clients","The RP is elected using BSR messages and nothing else","Every IPv6 host acts as an RP for the groups it sends to"],a:[0],e:"Embedded RP lets routers learn the RP from the group address itself, with no BSR or static config needed."},
{id:"d38",d:4,q:"What does syslog severity 3 mean?",o:["Error","Warning","Critical","Debug"],a:[0],e:"0 emergency, 1 alert, 2 critical, 3 error, 4 warning, 5 notification, 6 informational, 7 debug."},
{id:"d39",d:4,q:"What is an NTP stratum 1 server?",o:["A server directly attached to a reference clock like GPS","Any server inside your network that other devices sync to","A server that gets its time from a stratum 2 server","The least accurate level of server in the NTP hierarchy"],a:[0],e:"Lower stratum means closer to the reference clock. Accurate time matters for log correlation, certificates, and authentication."},
{id:"d40",d:4,q:"What is IP SLA commonly used for in network design?",o:["Measuring latency, jitter and loss, and tracking reachability for failover","Encrypting traffic between two routers that are connected across an untrusted transport","Assigning IP addresses to hosts that request them on a subnet","Building multicast distribution trees between sources and receivers"],a:[0],e:"IP SLA probes feed object tracking, which can pull a static route or lower HSRP priority when a path degrades."},
{id:"d41",d:4,q:"Clients and the DHCP server are on different subnets. What does the gateway need?",o:["A DHCP relay (ip helper-address) pointing to the server","A separate DHCP server located on every subnet","Proxy ARP so clients can reach the DHCP server","NAT so DHCP requests appear to come from the gateway"],a:[0],e:"The relay turns the client's broadcast into unicast to the server and adds the gateway address so the server picks the right scope."},
{id:"d42",d:4,q:"Which feature blocks rogue DHCP servers on access ports?",o:["DHCP snooping","Dynamic ARP inspection","Port security","Storm control"],a:[0],e:"DHCP snooping trusts only uplink ports for server messages and builds a binding table that DAI and IP Source Guard use."},
{id:"d43",d:4,q:"Which feature uses the DHCP snooping binding table to stop ARP spoofing?",o:["Dynamic ARP inspection","IP SLA","UDLD","BPDU guard with errdisable"],a:[0],e:"DAI checks ARP packets on untrusted ports against snooping bindings and drops mismatches."},

// ---------- Domain 5 (added) ----------
{id:"e11",d:5,q:"Which NETCONF operation retrieves configuration data from a datastore?",o:["<get-config>","<edit-config>","<commit>","<lock>"],a:[0],e:"<get-config> reads config from a named datastore. <get> also returns operational state. <edit-config> changes config."},
