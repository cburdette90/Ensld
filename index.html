{id:"a64",d:1,q:"Which IPv6 transition technology lets IPv4-only hosts reach the IPv4 internet over an IPv6-only access network?",o:["464XLAT or DS-Lite","6to4","ISATAP","Dual stack"],a:[0],e:"464XLAT (CLAT plus NAT64) and DS-Lite (IPv4 in IPv6 to an AFTR) carry IPv4 over IPv6-only networks, common in mobile and ISP designs."},
{id:"a65",d:1,q:"Which statement about NAT64 design is correct?",o:["It needs DNS64 for hostname-based access and breaks apps that embed IPv4 literals","It works without any DNS changes","It's a tunneling technique","It provides end-to-end IPv6"],a:[0],e:"DNS64 synthesizes AAAA records. Apps that use hardcoded IPv4 addresses fail without help like 464XLAT."},
{id:"a66",d:1,q:"Which OSPF design keeps the LSDB small in a large hub-and-spoke network with many remote sites?",o:["Put remote sites in totally stubby areas or NSSAs with summarization at the ABR","Put all sites in area 0","Use a single flat area with no summarization","Redistribute everything into BGP"],a:[0],e:"Stub-type areas plus summarization limit LSAs remote routers carry and isolate topology changes."},
{id:"a67",d:1,q:"Cisco's general guidance on OSPF area size is that design matters more than hard limits. What most affects scalability?",o:["Number of LSAs, adjacencies, and topology change rate","The OSPF process ID","The router ID format","Whether loopbacks are used"],a:[0],e:"Large LSDBs, many neighbors on hub routers, and frequent flaps drive SPF and flooding load, so use areas and summarization."},
{id:"a68",d:1,q:"What is the main role of OSPF area 0?",o:["It's the backbone that all other areas must connect to for inter-area routing","It's for external routes only","It must contain all routers","It's the stub area"],a:[0],e:"Inter-area traffic always passes through area 0 to prevent loops, so all ABRs need a connection to it."},
{id:"a69",d:1,q:"An OSPF hub router has 300 spoke neighbors on a DMVPN cloud. What design helps hub stability?",o:["Use point-to-multipoint network type, summarize toward spokes, and consider EIGRP or BGP for very large scale","Make every spoke an ABR","Put the hub in a totally stubby area","Disable hellos"],a:[0],e:"Large OSPF hubs are hard to scale because every spoke shares the area's LSDB. EIGRP stubs or BGP scale better for big DMVPN."},
{id:"a70",d:1,q:"Which OSPF feature lets a router avoid being used as a transit path during maintenance by advertising maximum metric?",o:["max-metric router-lsa","area range","passive-interface","default-information originate"],a:[0],e:"Stub router advertisement (max-metric) makes the router unattractive for transit while still reaching its own networks, useful during upgrades or boot."},
{id:"a71",d:1,q:"What is OSPF incremental SPF (iSPF) and why use it?",o:["Recomputes only the affected part of the SPF tree after a change, saving CPU in large areas","Runs SPF only every hour","Disables SPF on ABRs","Moves SPF to the DR"],a:[0],e:"iSPF reduces computation when a change affects only part of the topology."},
{id:"a72",d:1,q:"Which EIGRP feature advertises only a default route to spokes, keeping their tables small?",o:["Summarizing to 0.0.0.0/0 on the hub's spoke-facing interfaces","EIGRP stub on the hub","Variance","Passive interfaces on the hub"],a:[0],e:"A summary of 0.0.0.0/0 toward spokes gives them one route and bounds queries at the hub."},
{id:"a73",d:1,q:"EIGRP stub with 'connected summary' is configured on a spoke. What does it advertise?",o:["Only its connected and summary routes","All learned routes","Nothing","Only static routes"],a:[0],e:"connected summary is the default stub option. Other options include static, redistributed, receive-only, and leak-map."},
{id:"a74",d:1,q:"A dual-homed EIGRP spoke uses two hubs, but traffic between the hubs is flowing through the spoke. What is the fix?",o:["Configure the spoke as EIGRP stub","Raise the spoke's bandwidth","Disable split horizon","Increase hold time"],a:[0],e:"Stubs don't advertise learned routes, so they're never used as transit between hubs."},
{id:"a75",d:1,q:"Which EIGRP mode uses address families and wide metrics in one place?",o:["Named mode","Classic mode","Stub mode","Autonomous mode"],a:[0],e:"Named EIGRP configures IPv4 and IPv6 under one process with af-interface settings and 64-bit metrics."},
{id:"a76",d:1,q:"Which IS-IS router level maintains the backbone topology across areas?",o:["Level 2","Level 1","Level 0","Level 3"],a:[0],e:"L1 routers know only their own area. L2 routers form the backbone. L1/L2 routers connect the two."},
{id:"a77",d:1,q:"Why do some large enterprises and service providers choose IS-IS over OSPF?",o:["It runs directly over Layer 2 (CLNS), extends easily with TLVs (like IPv6), and scales well in flat designs","It supports more LSA types","It's required for BGP","It uses less bandwidth than static routes"],a:[0],e:"IS-IS is protocol-agnostic thanks to TLVs and isn't IP-dependent, which makes adding IPv6 and other features simple."},
{id:"a78",d:1,q:"What is IS-IS route leaking used for?",o:["Advertising specific L2 routes into an L1 area so L1 routers pick the best exit","Leaking routes between VRFs","Redistributing BGP into IS-IS","Hiding routes from L2"],a:[0],e:"By default L1 routers just use the nearest L1/L2 router's default route, which can be suboptimal. Leaking specific prefixes fixes that."},
{id:"a79",d:1,q:"In IS-IS, what sets the attached (ATT) bit?",o:["An L1/L2 router connected to the backbone, telling L1 routers to install a default route","An L1 router with no neighbors","The DIS on a broadcast segment","An ASBR"],a:[0],e:"L1 routers install a default toward L1/L2 routers that set ATT. You can suppress it to control exits."},
{id:"a80",d:1,q:"What is the IS-IS equivalent of an OSPF DR on a broadcast network?",o:["DIS (Designated Intermediate System)","BDR","ABR","ASBR"],a:[0],e:"The DIS creates the pseudonode LSP. Unlike OSPF there's no backup, and a higher-priority router preempts."},
{id:"a81",d:1,q:"A company needs to connect to two ISPs and receive full internet routes from both. What must the edge routers have?",o:["Enough memory and CPU to hold full BGP tables (1M+ IPv4 routes)","Only a default route","OSPF to the ISPs","A single /30"],a:[0],e:"Full tables allow best-exit decisions. Many enterprises instead take default plus partial routes to reduce resource needs."},
{id:"a82",d:1,q:"For a dual-ISP design where the company only needs outbound failover, what is the simplest BGP route option from the ISPs?",o:["Default route only from each ISP","Full routes from both","Partial routes from both","No routes; use static only on the ISP side"],a:[0],e:"Default-only is lightweight. Use local preference to prefer one ISP and fail to the other."},
{id:"a83",d:1,q:"A route reflector design has a single RR. What is the main design risk?",o:["The RR is a single point of failure for route distribution","It creates loops","It requires a full mesh","It changes next hops"],a:[0],e:"Deploy at least two RRs (often in the same cluster or different clusters) for redundancy."},
{id:"a84",d:1,q:"Where should BGP route reflectors ideally be placed?",o:["Where they follow the physical topology so reflected paths match forwarding paths, often out of the data path","Only at the internet edge","On every access switch","On the firewalls"],a:[0],e:"RRs that don't match topology can hide better paths. Dedicated out-of-path RRs are common in large designs."},
{id:"a85",d:1,q:"What does BGP 'add-path' help with in route reflector designs?",o:["Advertising multiple paths for a prefix so clients can do multipath and faster failover","Adding AS path prepends","Adding communities","Adding new neighbors automatically"],a:[0],e:"An RR normally reflects only its best path. Add-path sends extra paths so clients see alternatives."},
{id:"a86",d:1,q:"Which BGP feature lets you tag routes with a value used later for policy decisions?",o:["Communities","Weight","Next hop","Origin"],a:[0],e:"Communities (standard, extended, large) group routes so policy can match the tag instead of long prefix lists."},
{id:"a87",d:1,q:"What does the well-known community NO_ADVERTISE do?",o:["The route isn't advertised to any BGP peer","It isn't advertised outside the AS (eBGP)","It isn't advertised outside the confederation","It's dropped immediately"],a:[0],e:"NO_EXPORT blocks eBGP advertisement. NO_ADVERTISE blocks advertisement to all peers. LOCAL_AS blocks it outside the sub-AS."},
{id:"a88",d:1,q:"Many ISPs support customer-set communities. What are they used for?",o:["Letting the customer signal the ISP to prepend, set local pref, or blackhole their routes","Encrypting BGP sessions","Assigning IP addresses","Changing the ISP's AS number"],a:[0],e:"ISP-defined communities give customers control over inbound traffic engineering inside the ISP's network."},
{id:"a89",d:1,q:"What is Remote Triggered Black Hole (RTBH) filtering used for?",o:["Dropping traffic to (or from) an address under DDoS at the edge, triggered by a BGP route","Load balancing across ISPs","Summarizing routes","Encrypting traffic"],a:[0],e:"A trigger router advertises the target with a community that edges set to a Null0 next hop. ISPs often accept a blackhole community from customers."},
{id:"a90",d:1,q:"An enterprise wants to protect its BGP sessions from spoofed resets. Which two features help? (Choose two.)",o:["TCP MD5 or TCP-AO authentication","GTSM (TTL security)","BGP weight","AS path prepending","Local preference"],a:[0,1],e:"Authentication validates the session. GTSM requires TTL 255 on incoming packets so remote attackers can't reach the session."},
{id:"a91",d:1,q:"What does RPKI-based route origin validation do?",o:["Checks that the origin AS of a prefix is authorized to announce it, helping prevent hijacks","Encrypts BGP updates","Speeds up convergence","Replaces route reflectors"],a:[0],e:"ROAs published by prefix holders let routers mark routes as valid, invalid, or not found, and drop invalid ones."},
{id:"a92",d:1,q:"What should an enterprise filter on routes received from its ISPs?",o:["Bogons, its own prefixes, default if unwanted, and overly specific prefixes","Nothing; trust the ISP","Only IPv6 routes","Only /8 prefixes"],a:[0],e:"Inbound filtering protects against leaks and hijacks. Outbound, only advertise your own prefixes."},
{id:"a93",d:1,q:"What is the main design risk of mutual redistribution at two points between OSPF and EIGRP?",o:["Routing loops and suboptimal routing because routes can feed back into their original domain","Higher bandwidth use","Neighbors won't form","OSPF areas break"],a:[0],e:"Use route tags with filtering, or adjust AD, so routes learned from one domain aren't re-advertised back into it."},
{id:"a94",d:1,q:"When redistributing into OSPF on IOS, what must you consider about subnets?",o:["Older IOS needs the 'subnets' keyword or only classful networks are redistributed","OSPF never accepts subnets","All routes become E1","The metric defaults to 0"],a:[0],e:"On older IOS, without 'subnets' only classful networks are redistributed. Newer IOS XE includes subnets automatically. Default seed metric is 20 (E2), or 1 for BGP-learned routes."},
{id:"a95",d:1,q:"What is the default seed metric when redistributing into EIGRP if none is set?",o:["Infinity (routes aren't installed), except for static and connected","20","1","110"],a:[0],e:"EIGRP needs a metric (bandwidth, delay, reliability, load, MTU) via default-metric or on the redistribute command, except when redistributing another EIGRP AS, static, or connected."},
{id:"a96",d:1,q:"Which tool is best to stop specific redistributed routes from being redistributed back at a second redistribution point?",o:["Route tags matched in a route map","Prefix lengths","The OSPF process ID","Increasing bandwidth"],a:[0],e:"Tag routes as they enter a domain, then deny that tag when redistributing in the other direction."},
{id:"a97",d:1,q:"What does a floating static route need to work as a backup to a dynamic route?",o:["An administrative distance higher than the dynamic protocol's AD","A lower AD than the dynamic route","The same AD","A route map"],a:[0],e:"For example, AD 250 makes it only appear in the RIB when the OSPF/EIGRP/BGP route disappears."},
{id:"a98",d:1,q:"A static route points out a broadcast interface (Ethernet) without a next hop. What is the design issue?",o:["The router ARPs for every destination, relying on proxy ARP and consuming memory","It won't install","It's always preferred over connected routes","It forces fragmentation"],a:[0],e:"Use a next-hop IP (or interface plus next hop) on multiaccess networks."},
{id:"a99",d:1,q:"What does PBR do in a design where guest traffic must always exit through a specific firewall?",o:["Overrides normal destination routing for matched guest traffic and sends it to the firewall next hop","Summarizes guest routes","Filters routing updates","Encrypts guest traffic"],a:[0],e:"PBR on the guest SVI sets the next hop. Pair with tracking so PBR falls back if the firewall is down."},
{id:"a100",d:1,q:"When using VRF-Lite to separate guest and corporate traffic across a campus, what is required on each hop?",o:["A separate interface or subinterface and routing instance per VRF","An MPLS label per VRF","One shared routing table","A GRE tunnel per user"],a:[0],e:"VRF-Lite is hop by hop. It works well for a few VRFs but gets complex at scale, where MPLS or SD-Access is easier."},
{id:"a101",d:1,q:"How can several VRFs reach a shared services network (DNS, DHCP) without merging them?",o:["Route leaking via route-target import/export or a fusion router/firewall","Put all VRFs in the global table","Use one VRF for everything","Static ARP entries"],a:[0],e:"A fusion router or firewall connects the VRFs at a controlled point, or MP-BGP route targets leak specific routes."},
{id:"a102",d:1,q:"Which statement about BFD design is correct?",o:["Aggressive BFD timers detect failures fast but can cause flaps on unstable links or busy CPUs","BFD replaces routing protocols","BFD only works with static routes","BFD increases convergence time"],a:[0],e:"Balance detection speed and stability. Hardware-offloaded BFD supports faster timers more safely."},
{id:"a103",d:1,q:"Which mechanism precomputes a backup next hop so traffic switches within about 50 ms when a link fails?",o:["IP Fast Reroute (LFA / TI-LFA)","Graceful restart","BGP route dampening","OSPF stub areas"],a:[0],e:"Loop-Free Alternates install a backup path in the FIB ahead of time, so forwarding switches before the IGP finishes reconverging."},
{id:"a104",d:1,q:"What does NSF/graceful restart need from neighboring routers?",o:["They must be NSF-aware so they keep forwarding to the restarting router","They must be NSF-capable with dual supervisors","They must run BGP","Nothing"],a:[0],e:"The restarting router (NSF-capable) keeps forwarding via its FIB while neighbors (NSF-aware) don't tear down the adjacency."},
{id:"a105",d:1,q:"Why does Cisco recommend tuning SPF and LSA throttle timers in large OSPF networks?",o:["To react quickly to a single change but back off during a flapping storm","To disable SPF","To reduce the number of areas","To speed up hellos"],a:[0],e:"Exponential backoff timers start low for fast convergence and increase if changes keep coming."},
{id:"a106",d:1,q:"An enterprise uses 10.0.0.0/8 internally. A newly acquired company also uses 10.0.0.0/8. Which design options help? (Choose two.)",o:["NAT between the overlapping networks","VRFs with controlled route leaking and NAT for shared services","Merging the routing tables directly","Disabling routing at both companies","Using longer subnet masks everywhere"],a:[0,1],e:"Overlaps are usually handled with NAT at the boundary and/or VRF separation until one side is renumbered."},
{id:"a107",d:1,q:"Which routing protocol is most commonly used between an enterprise and its ISPs?",o:["eBGP","OSPF","EIGRP","RIPv2"],a:[0],e:"BGP is the inter-domain protocol, with policy controls for multihoming."},
{id:"a108",d:1,q:"What is the purpose of the BGP 'maximum-prefix' feature?",o:["Protect the router from a peer that sends too many routes, for example from a leak","Limit how many neighbors a router can have","Set the largest prefix length","Increase table size"],a:[0],e:"It warns or tears down the session if the received prefix count exceeds the limit."},
{id:"a109",d:1,q:"Which two methods prevent an enterprise from becoming transit between its two ISPs? (Choose two.)",o:["Outbound filter permitting only the enterprise's own prefixes (for example an AS-path '^$' filter)","Tag ISP-learned routes with NO_EXPORT","Raise local preference on both ISPs","Use weight on internal routers","Remove the default route"],a:[0,1],e:"Only advertise locally originated routes. NO_EXPORT on received routes also stops them going to other eBGP peers."},
{id:"a110",d:1,q:"An enterprise uses private AS 65010 with one ISP. What happens to the private AS when the ISP advertises the enterprise prefix to the internet?",o:["The ISP removes it (remove-private-as) and announces the prefix from its own AS","It's announced as-is","The prefix is dropped","It's converted to a 4-byte AS"],a:[0],e:"Private ASNs (64512-65534, and 4200000000-4294967294) must not appear on the internet. Multihoming to different ISPs normally needs a public ASN."},
{id:"a111",d:1,q:"What is the main reason an enterprise multihomed to two different ISPs needs provider-independent address space?",o:["So both ISPs can advertise the same prefix and failover works for inbound traffic","To get faster internet","Because BGP requires /24 or shorter","To avoid using NAT"],a:[0],e:"With PI space (or with PA space the first ISP allows), both providers announce the same prefix. Most ISPs filter announcements longer than /24 (IPv4) or /48 (IPv6)."},
{id:"a112",d:1,q:"Which IPv6 routing protocol versions are used by Cisco IGPs?",o:["OSPFv3, EIGRP for IPv6, and IS-IS with IPv6 TLVs","OSPFv2 and RIPv1","EIGRPv2 and OSPFv1","Only static routes"],a:[0],e:"OSPFv3 is a separate protocol version. EIGRP and IS-IS add IPv6 through address families or TLVs. MP-BGP carries IPv6 too."},
{id:"a113",d:1,q:"What is a common IPv6 design rule for loopback addresses?",o:["Use /128 loopbacks from a dedicated block","Use /64 on loopbacks","Use link-local only","Don't configure loopbacks"],a:[0],e:"Allocate a dedicated /64 (or larger) for loopbacks and assign /128s from it, which makes filtering and summarization easy."},
{id:"a114",d:1,q:"Why should you summarize IPv6 routes even though IPv6 has huge address space?",o:["It still reduces routing table size and limits failure propagation","IPv6 doesn't support summarization","It's needed for SLAAC","It encrypts routes"],a:[0],e:"Hierarchy and summarization matter just as much in IPv6. Plan blocks per region and site so summaries line up."},
{id:"a115",d:1,q:"Which of these is the correct expansion of 2001:db8::1:0:0:1?",o:["2001:0db8:0000:0000:0001:0000:0000:0001","2001:0db8:0001:0000:0000:0000:0000:0001","2001:0db8:0000:0001:0000:0000:0000:0001","2001:0db8:0000:0000:0000:0001:0000:0001"],a:[0],e:"Six groups are written out (2001, db8, 1, 0, 0, 1), so :: stands for 8 - 6 = 2 zero groups right after db8."},
{id:"a116",d:1,q:"What does DHCPv6 prefix delegation (PD) do?",o:["A router requests a prefix (like a /56) from an upstream router to assign subnets downstream","It gives hosts a single address","It translates IPv6 to IPv4","It distributes DNS only"],a:[0],e:"PD is common for branch routers and ISP CPEs, which then advertise /64s on their LAN interfaces."},
{id:"a117",d:1,q:"Which RA flag tells hosts to get their address from stateful DHCPv6?",o:["M (Managed) flag","O (Other config) flag","A (Autonomous) flag in the prefix","L (On-link) flag"],a:[0],e:"M=1 means use DHCPv6 for addresses. O=1 means get other info (DNS) from DHCPv6. A=1 in the prefix option allows SLAAC."},
{id:"a118",d:1,q:"Which statement about OSPF summarization and black holes is correct?",o:["The summarizing router installs a discard route to Null0 to avoid loops for unused parts of the summary","Summaries never create loops","OSPF can't summarize","Summaries are only on internal routers"],a:[0],e:"Traffic to an unused address in the summary is dropped at the summarizer instead of following a default route back and forth."},
{id:"a119",d:1,q:"Which design choice lets a large OSPF network add a new area without changing the backbone?",o:["Pre-allocated address blocks per area that summarize cleanly at the ABRs","Using the same address block in every area","Disabling area 0","Putting all ABRs in a stub area"],a:[0],e:"With a block reserved per area, the backbone only sees one summary per area."},
{id:"a120",d:1,q:"An EIGRP network has slow convergence because a lost route triggers queries across 500 routers. Which two changes help most? (Choose two.)",o:["Summarize at distribution and WAN boundaries","Configure remote sites as stubs","Increase hello timers","Turn off split horizon everywhere","Use static routes on the core"],a:[0,1],e:"Both limit how far queries travel: a router receiving a query for a route it only knows as part of a summary replies immediately."},
{id:"a121",d:1,q:"In a BGP design with two edge routers connected to the same ISP, which attribute should the enterprise set to tell the ISP which link to prefer for inbound traffic?",o:["MED","Local preference","Weight","Origin"],a:[0],e:"MED is compared between paths from the same neighboring AS, so it works for two links to one ISP. Prepending is for different ISPs (and also works here)."},
{id:"a122",d:1,q:"What is conditional advertisement in BGP?",o:["Advertising a prefix only if another route exists or doesn't exist, for example to a backup ISP only when the primary fails","Advertising with a delay","Advertising only on weekdays","Advertising only IPv6"],a:[0],e:"advertise-map with exist-map or non-exist-map controls this, which helps active/standby inbound designs."},
{id:"a123",d:1,q:"What is the purpose of BGP route dampening?",o:["Suppress routes that flap repeatedly to protect stability","Speed up convergence","Increase the number of paths","Change the next hop"],a:[0],e:"Each flap adds a penalty. Over the suppress limit, the route is held down until the penalty decays below the reuse limit."},
{id:"a124",d:1,q:"Which IGP is best suited when the design needs very fast convergence, multi-vendor support, and a simple flat hierarchy across a large SP-like core?",o:["IS-IS","RIPv2","EIGRP classic","Static routing"],a:[0],e:"IS-IS is standards-based, scales well in a single L2 domain, and is widely used in SP and large DC cores."},
{id:"a125",d:1,q:"Which route has the lowest preference (highest AD) by default?",o:["iBGP (200)","External EIGRP (170)","RIP (120)","OSPF (110)"],a:[0],e:"iBGP's high AD prefers IGP routes for internal destinations. Only unknown (255) is worse."},
// ---------- Domain 2 (expanded) ----------
{id:"b55",d:2,q:"Which access layer feature lets a single switch port support an IP phone and a PC in separate VLANs?",o:["Voice VLAN (switchport voice vlan)","Private VLAN","VLAN trunking with DTP","Native VLAN tagging"],a:[0],e:"The phone tags voice traffic in the voice VLAN (learned via CDP/LLDP-MED) and passes the PC's untagged data in the access VLAN."},
{id:"b56",d:2,q:"Which two technologies allow multichassis EtherChannel from an access switch to two distribution switches? (Choose two.)",o:["StackWise Virtual","vPC (on Nexus)","HSRP","UDLD","PAgP on separate switches without virtualization"],a:[0,1],e:"StackWise Virtual (Catalyst) and vPC (Nexus) let two physical switches terminate one bundle, giving all links forwarding without STP blocking."},
{id:"b57",d:2,q:"What is a key difference between vPC and StackWise Virtual?",o:["vPC keeps two separate control planes; StackWise Virtual merges them into one","vPC merges control planes; StackWise Virtual keeps them separate","Both use one control plane","Neither supports MEC"],a:[0],e:"Nexus vPC peers stay independent (with a peer link and keepalive). StackWise Virtual creates one logical switch with SSO."},
{id:"b58",d:2,q:"What problem does a dual-active detection link solve in StackWise Virtual?",o:["It detects when both switches think they're active after the SVL fails, preventing a split-brain outage","It load balances traffic","It replaces the SVL","It speeds up STP"],a:[0],e:"If the virtual link fails, both chassis could go active with the same IPs. Dual-active detection forces one into recovery mode."},
{id:"b59",d:2,q:"Which design is preferred for connecting a Layer 2 access switch to a distribution pair to avoid STP blocking?",o:["Multichassis EtherChannel to a StackWise Virtual pair","Two separate uplinks with Rapid PVST+","A single uplink","Daisy-chaining access switches"],a:[0],e:"With MEC, both uplinks are in one logical bundle, so STP sees a single link and no ports block."},
{id:"b60",d:2,q:"What is the recommended EtherChannel member count for even hash distribution?",o:["A power of 2 (2, 4, 8)","Any odd number","Exactly 3","Always 6"],a:[0],e:"Hash buckets divide evenly across 2, 4, or 8 links. Other counts lead to uneven load."},
{id:"b61",d:2,q:"Which STP mode does Cisco recommend for most campus networks with a moderate number of VLANs?",o:["Rapid PVST+","Classic 802.1D","PVST+","CST"],a:[0],e:"Rapid PVST+ gives fast convergence with per-VLAN control. MST is better when there are many VLANs or for multi-vendor interoperability."},
{id:"b62",d:2,q:"Why should STP still be enabled even in a routed access design?",o:["As a safety net against accidental loops from misconnected cables or devices","Because routed links need STP","To elect the default gateway","To run HSRP"],a:[0],e:"Never disable STP. It protects the access layer from user-created loops."},
{id:"b63",d:2,q:"What is the purpose of the STP 'bridge assurance' feature?",o:["BPDUs are sent on all ports and a port blocks if it stops receiving them, catching unidirectional links and misconfigurations","It speeds up PortFast","It replaces root guard","It encrypts BPDUs"],a:[0],e:"Bridge assurance (Rapid PVST+/MST on point-to-point links) puts ports in an inconsistent state when BPDUs stop."},
{id:"b64",d:2,q:"What is the main benefit of an HSRP design with different active routers for different VLANs?",o:["It load shares traffic across both distribution switches","It removes the need for STP","It doubles the virtual IPs per VLAN","It improves security"],a:[0],e:"Make Dist-1 active for odd VLANs and Dist-2 for even VLANs (matching STP root) to use both uplinks."},
{id:"b65",d:2,q:"Which HSRP setting should be tuned so the router that just rebooted doesn't preempt before its routing has converged?",o:["Preempt delay (standby preempt delay minimum)","Hello timer","Virtual MAC","Group number"],a:[0],e:"Without a delay, a rebooted router can take over as gateway before it has routes, black-holing traffic."},
{id:"b66",d:2,q:"In a routed access design, what provides fast convergence on the uplinks?",o:["ECMP routes across both uplinks with fast IGP timers or BFD","STP PortFast","HSRP on the access switch","VTP pruning"],a:[0],e:"Equal-cost paths through both distribution switches mean a failed link is removed from the FIB quickly, often in under 200 ms."},
{id:"b67",d:2,q:"In a routed access design, what should the access switches be configured as to keep them from being used as transit?",o:["EIGRP stub or OSPF totally stubby area","OSPF ASBR","BGP route reflector","HSRP active"],a:[0],e:"Stub configuration keeps access switches out of the transit path and reduces their routing tables."},
{id:"b68",d:2,q:"Which link should exist between a pair of distribution switches in a routed access design?",o:["A Layer 3 link for routing between them","No link at all","A Layer 2 trunk carrying all access VLANs","A management-only link"],a:[0],e:"A routed link between the distribution pair gives an alternate path for summarized routes and avoids black holes."},
{id:"b69",d:2,q:"Why should a distribution pair be connected with a Layer 3 link when it summarizes access routes toward the core?",o:["To avoid black-holing traffic when one distribution switch loses its access link but still advertises the summary","To carry STP BPDUs","To run VTP","To extend VLANs"],a:[0],e:"The summarizing switch still advertises the summary. A Layer 3 path to its peer lets it forward to the access switch it can no longer reach directly."},
{id:"b70",d:2,q:"What oversubscription ratio is generally recommended between distribution and core?",o:["About 4:1","20:1","1:20","Always 1:1"],a:[0],e:"Common guidance is up to 20:1 at access-to-distribution and about 4:1 at distribution-to-core. Data centers aim lower."},
{id:"b71",d:2,q:"What is a main benefit of a separate campus core when there are many distribution blocks?",o:["It avoids a full mesh of distribution blocks, simplifying cabling and routing","It removes the need for routing","It allows VLANs to span the whole campus","It reduces the number of access switches"],a:[0],e:"Without a core, N distribution pairs need N(N-1)/2 interconnections. A core reduces that to connections to the core only."},
{id:"b72",d:2,q:"Which three blocks commonly connect to a campus core? (Choose three.)",o:["Distribution blocks","Data center / server block","WAN and internet edge","Individual user PCs","IP phones"],a:[0,1,2],e:"The core interconnects building distribution, DC/services, and edge blocks. End devices attach at the access layer."},
{id:"b73",d:2,q:"Which PoE standard (Type 3) provides up to 60 W at the PSE?",o:["802.3bt Type 3 (UPOE class)","802.3af","802.3at","Cisco pre-standard PoE"],a:[0],e:"802.3af = 15.4 W, 802.3at (PoE+) = 30 W, 802.3bt Type 3 = 60 W, Type 4 = 90 W at the switch port."},
{id:"b74",d:2,q:"What does Cisco Perpetual PoE provide?",o:["Keeps power to endpoints during a switch software reload","Doubles power output","Allows 200 W per port","Powers devices over fiber"],a:[0],e:"Perpetual PoE keeps power flowing during a soft reload. Fast PoE restores power quickly after a full power cycle."},
{id:"b75",d:2,q:"How should power supply capacity be planned for an access switch?",o:["Sum the expected PoE budget plus system power, with redundancy (N+1 or N+N)","Use the smallest supply available","Only consider data ports","Assume each device uses 1 W"],a:[0],e:"Under-provisioning PoE causes devices to lose power. Redundant supplies protect against PSU failure."},
{id:"b76",d:2,q:"Which Wi-Fi standard is 802.11ax?",o:["Wi-Fi 6/6E","Wi-Fi 5","Wi-Fi 4","Wi-Fi 7"],a:[0],e:"802.11n = Wi-Fi 4, 802.11ac = Wi-Fi 5, 802.11ax = Wi-Fi 6 (6E in 6 GHz), 802.11be = Wi-Fi 7."},
{id:"b77",d:2,q:"What is the main advantage of the 6 GHz band for WLAN design?",o:["Many more clean 20/40/80/160 MHz channels with only modern clients","Better wall penetration than 2.4 GHz","Support for legacy 802.11b clients","Longer range than 5 GHz"],a:[0],e:"6 GHz adds up to 1,200 MHz (region dependent) of spectrum without legacy devices, so wider channels are practical."},
{id:"b78",d:2,q:"What is the recommended cell overlap for seamless roaming in a voice-grade WLAN?",o:["About 15-20% overlap at -67 dBm","No overlap","50% overlap at -85 dBm","Overlap doesn't matter"],a:[0],e:"Enough overlap that the client sees the next AP at a good signal before leaving the current one."},
{id:"b79",d:2,q:"What type of wireless site survey uses software to model coverage from floor plans before any AP is installed?",o:["Predictive survey","Passive survey","Active survey","Post-deployment validation"],a:[0],e:"Predictive surveys estimate coverage. Passive and active surveys measure real signal (active also tests association and throughput), often after install."},
{id:"b80",d:2,q:"Why might a WLAN designer disable the lowest data rates (like 1, 2, 5.5 Mbps)?",o:["To reduce airtime used by slow frames and encourage clients to roam sooner","To increase coverage","To support legacy clients","To make the SSID hidden"],a:[0],e:"Low rates take more airtime, and beacons at low rates make cells larger. Raising the minimum rate shrinks cells and improves capacity."},
{id:"b81",d:2,q:"What does band steering do?",o:["Encourages dual-band clients to connect on 5 or 6 GHz instead of 2.4 GHz","Forces all clients to 2.4 GHz","Changes AP channels","Blocks legacy clients"],a:[0],e:"Higher bands have more channels and less interference, so steering capable clients there improves performance."},
{id:"b82",d:2,q:"What is an anchor controller used for in a guest WLAN design?",o:["Terminating guest traffic in the DMZ via a mobility tunnel from internal WLCs","Managing APs in the core","Running RRM for the campus","Storing user credentials"],a:[0],e:"Foreign (internal) WLCs tunnel guest traffic to the anchor, so guest traffic never touches internal VLANs."},
{id:"b83",d:2,q:"What does an AP in FlexConnect mode do with locally switched WLANs when the WAN to the WLC fails?",o:["Continues serving connected clients and can authenticate new ones with local auth or a local RADIUS","Disconnects all clients","Reboots","Switches to sniffer mode"],a:[0],e:"FlexConnect standalone mode keeps local switching working. Central switching WLANs stop because they depend on the WLC."},
{id:"b84",d:2,q:"Which Catalyst 9800 deployment model fits a large campus with thousands of APs and SSO redundancy?",o:["9800-40 or 9800-80 appliances in an HA SSO pair","EWC on an AP","Mobility Express","Cloud-only Meraki"],a:[0],e:"Appliances scale to thousands of APs (9800-80 up to 6,000 APs). EWC is for small sites."},
{id:"b85",d:2,q:"What does an AP group or site tag commonly control in WLAN design?",o:["Which WLANs and settings apply to a group of APs, such as by building","The RF channel of each AP","Client IP addresses","The WLC's management IP"],a:[0],e:"Grouping APs lets different buildings get different SSIDs, VLANs, or FlexConnect settings."},
{id:"b86",d:2,q:"Which method is preferred to secure enterprise WLAN access for corporate devices?",o:["802.1X with EAP-TLS certificates","WPA2-PSK shared by all employees","Open SSID with MAC filtering","WEP"],a:[0],e:"Per-device certificates give strong mutual authentication and allow revoking a single device."},
{id:"b87",d:2,q:"What is Cisco's recommended maximum number of SSIDs per radio to limit beacon overhead?",o:["About 3 or 4","16","32","1 only"],a:[0],e:"Each SSID sends its own beacons at the minimum data rate, consuming airtime. Fewer SSIDs leave more airtime for data."},
{id:"b88",d:2,q:"In SD-Access, what is a fabric site?",o:["A group of fabric nodes sharing control plane, border, and edge roles at one location","A single switch","A wireless SSID","A VLAN"],a:[0],e:"Each fabric site has its own control plane and border nodes. Multiple sites connect through a transit."},
{id:"b89",d:2,q:"Which two SD-Access transit types connect fabric sites? (Choose two.)",o:["SD-Access transit (LISP/VXLAN, keeps VN and SGT)","IP-based transit (VRF-Lite handoff, SGT via other means)","STP transit","HSRP transit","VTP transit"],a:[0,1],e:"SD-Access transit keeps context end to end over a capable network. IP transit hands off to traditional routing like SD-WAN or MPLS, needing SXP or inline tags for SGTs."},
{id:"b90",d:2,q:"What is the underlay in SD-Access?",o:["The physical routed network (Layer 3 links and an IGP) that carries VXLAN traffic","The VXLAN tunnels","The SGT policy","The wireless SSIDs"],a:[0],e:"The underlay just needs IP reachability between loopbacks, ideally routed links with no STP, and an increased MTU for VXLAN."},
{id:"b91",d:2,q:"What MTU consideration applies to an SD-Access underlay?",o:["Increase MTU (for example 9100) to fit VXLAN's ~50-byte overhead without fragmentation","Reduce MTU to 1000","No changes are needed","Disable jumbo frames"],a:[0],e:"Underlay links should support jumbo frames so client frames at 1500 bytes plus VXLAN headers aren't fragmented."},
{id:"b92",d:2,q:"What is a policy extended node in SD-Access?",o:["An extended node that can also enforce SGT-based policy locally","A node that only runs STP","The border node","A wireless controller"],a:[0],e:"Extended nodes connect non-fabric devices (like IE switches) to the fabric. Policy extended nodes can additionally enforce group-based policy."},
{id:"b93",d:2,q:"Which SD-Access component is optional but helpful for traffic that must go through a firewall between VNs?",o:["A fusion device (router or firewall) outside the border","An extra control plane node","An AP in monitor mode","A second Catalyst Center"],a:[0],e:"VNs are isolated. A fusion router or firewall connected to the border leaks routes between VNs and shared services."},
{id:"b94",d:2,q:"What makes SD-Access wireless different from a traditional centralized WLAN design?",o:["Data is switched at the fabric edge (VXLAN) instead of tunneled to the WLC","It doesn't use a WLC","APs must be in FlexConnect mode","It only supports WPA2-Personal"],a:[0],e:"The WLC is still the control plane and registers wireless clients with the fabric control plane, but data stays distributed."},
{id:"b95",d:2,q:"What does Layer 2 flooding in SD-Access allow?",o:["Applications that need broadcast or link-local multicast (like some IoT or legacy apps) to work in the fabric","Faster IP routing","STP across the fabric","Higher VLAN counts"],a:[0],e:"Fabric normally suppresses broadcast. Enabling Layer 2 flooding maps broadcasts to an underlay multicast group for that pool."},
{id:"b96",d:2,q:"What is the role of the 'L2 handoff' feature on an SD-Access border during migration?",o:["Extends a fabric pool into a traditional VLAN so endpoints in both share the same subnet","Translates IPv4 to IPv6","Encrypts traffic","Creates a new VN"],a:[0],e:"Layer 2 border handoff lets the fabric anycast gateway serve hosts still on the old network until they move."},
{id:"b97",d:2,q:"Which Catalyst Center feature discovers existing devices and onboards new switches with zero-touch Plug and Play?",o:["PnP (Plug and Play) and Discovery","Assurance","Path Trace","Template hub only"],a:[0],e:"Discovery adds existing devices via CDP/LLDP/IP range. PnP onboards new devices that call home via DHCP option or DNS."},
{id:"b98",d:2,q:"What is micro-segmentation in a campus design?",o:["Controlling traffic between groups of endpoints within the same VN or subnet, typically with SGTs","Splitting VLANs into smaller subnets","Using /31 links","Using separate physical networks"],a:[0],e:"Macro-segmentation (VNs/VRFs) separates large domains. Micro-segmentation (SGTs) controls group-to-group within them."},
{id:"b99",d:2,q:"Which Layer 2 access design uses a single VLAN per access switch and no VLANs spanning the distribution pair?",o:["Loop-free U-less (V) topology","Looped triangle","Looped square","Flat Layer 2"],a:[0],e:"When each VLAN stays local to one access switch and the distribution link is Layer 3, there are no Layer 2 loops and STP blocks nothing."},
{id:"b100",d:2,q:"What is a downside of a looped Layer 2 triangle design?",o:["STP must block one uplink, wasting bandwidth and making convergence depend on STP","No redundancy","It needs routed access","It can't use HSRP"],a:[0],e:"Looped designs are sometimes needed for VLANs spanning access switches but are less efficient and riskier than loop-free designs."},
{id:"b101",d:2,q:"What is the purpose of the 'UDLD aggressive' mode in a campus design?",o:["Err-disables a link after it detects a unidirectional failure, preventing STP loops","Speeds up STP","Bundles links","Monitors PoE"],a:[0],e:"Normal mode only logs. Aggressive mode disables the port when echoes stop, which is important on fiber uplinks."},
{id:"b102",d:2,q:"Which feature should be configured on access ports to quickly bring up end hosts?",o:["PortFast with BPDU guard","Root guard","Loop guard","UplinkFast"],a:[0],e:"PortFast skips listening and learning, and BPDU guard shuts the port if a switch appears."},
{id:"b103",d:2,q:"What is the main campus design reason to tune or disable DTP?",o:["Prevent unwanted trunk formation and switch spoofing","Speed up STP","Enable PoE","Reduce MAC table size"],a:[0],e:"Set access ports to access mode and trunks to trunk with nonegotiate."},
{id:"b104",d:2,q:"Which two methods help prevent VLAN hopping in a campus? (Choose two.)",o:["Use an unused VLAN as the native VLAN on trunks","Disable DTP on access ports","Use VLAN 1 for management","Allow all VLANs on all trunks","Enable PortFast on trunks"],a:[0,1],e:"Double tagging relies on the native VLAN matching the attacker's VLAN. Switch spoofing relies on DTP."},
{id:"b105",d:2,q:"Which mechanism lets a campus design scale to thousands of VLANs while keeping STP load low?",o:["MST with VLANs mapped to a few instances","PVST+","Classic STP","VTP pruning only"],a:[0],e:"MST runs one STP calculation per instance, not per VLAN."},
{id:"b106",d:2,q:"What is the purpose of a campus services block?",o:["Hosting centralized services like WLCs, ISE, DHCP, DNS, and Catalyst Center close to the core","Connecting users","Connecting the WAN","Hosting the internet edge firewall only"],a:[0],e:"A dedicated services block attaches to the core and gives all distribution blocks equal access to shared services."},
{id:"b107",d:2,q:"Why place WLCs in a services block rather than in a building distribution block?",o:["So all buildings have consistent access and wireless traffic doesn't hairpin through one building","Because WLCs need PoE","Because APs must be in the same VLAN","To avoid using routing"],a:[0],e:"Central placement keeps paths symmetrical and avoids tying shared infrastructure to one building's failure domain."},
{id:"b108",d:2,q:"What is the benefit of using /31 masks on point-to-point IPv4 links?",o:["Saves address space with no loss of function (RFC 3021)","Allows more hosts","Required for OSPF","Enables broadcast"],a:[0],e:"/31 links use both addresses as host addresses. /30 wastes two (network and broadcast)."},
{id:"b109",d:2,q:"What does a modular campus design make easier?",o:["Adding or changing a building block without affecting the rest of the network","Removing all redundancy","Using one huge VLAN","Avoiding routing"],a:[0],e:"Self-contained blocks (access/distribution per building) connect to the core with consistent interfaces and summarization."},
{id:"b110",d:2,q:"What should a high-availability campus avoid?",o:["Single points of failure like one uplink, one supervisor, or one power supply in critical devices","Redundant links","Fast convergence","Summarization"],a:[0],e:"Add redundancy where the impact justifies it: core and distribution most, access as needed."},
{id:"b111",d:2,q:"What does ISSU (In-Service Software Upgrade) allow?",o:["Upgrading software on a redundant system with minimal or no traffic disruption","Upgrading without redundant supervisors","Downgrading licenses","Changing the hardware model"],a:[0],e:"ISSU works with SSO: upgrade the standby, switch over, then upgrade the other. StackWise Virtual and dual-sup chassis support it."},
{id:"b112",d:2,q:"What does Graceful Insertion and Removal (GIR) do?",o:["Gracefully takes a device out of the forwarding path for maintenance and returns it after","Inserts new line cards","Removes VLANs","Resets passwords"],a:[0],e:"Maintenance mode isolates the switch (for example via max-metric and shutting peerings) so traffic moves away first."},
{id:"b113",d:2,q:"Which wireless deployment fits a retail chain with hundreds of small stores and a central IT team?",o:["FlexConnect APs managed by central WLCs, or cloud-managed APs","A WLC appliance pair in every store","Autonomous APs configured one at a time","Mesh APs at each store"],a:[0],e:"Central management with local switching avoids hardware at each store while keeping traffic local."},
{id:"b114",d:2,q:"What is an OEAP (OfficeExtend AP)?",o:["An AP at a teleworker's home that tunnels corporate SSIDs back to a WLC over the internet","An outdoor AP","An AP in sniffer mode","A Meraki AP"],a:[0],e:"OEAP extends corporate wireless to home offices with DTLS-encrypted CAPWAP, often with a local personal SSID."},
{id:"b115",d:2,q:"What is a key consideration when designing an outdoor mesh WLAN?",o:["Limit hop count and plan backhaul channels, since each hop reduces throughput","Use only 2.4 GHz backhaul","Mesh doesn't need planning","Each MAP needs a wired connection"],a:[0],e:"Mesh APs (MAPs) share bandwidth with the root AP (RAP). Fewer hops means better throughput and latency."},
{id:"b116",d:2,q:"Which method locates wireless clients for location services and analytics?",o:["RSSI-based trilateration or Fine Timing Measurement with Cisco Spaces","CDP","STP","NetFlow"],a:[0],e:"Location accuracy needs AP density and placement suited to location, not just coverage."},
{id:"b117",d:2,q:"In high-density WLAN design, why are directional or patch antennas sometimes used?",o:["To focus coverage on a specific area and reduce co-channel interference","To make cells bigger","To support legacy clients","To increase beacon rates"],a:[0],e:"Stadiums and auditoriums use directional antennas (often under-seat or overhead) to create small, focused cells."},
{id:"b118",d:2,q:"What does an access switch typically need to support Wi-Fi 6/6E APs well?",o:["mGig (2.5/5 Gbps) ports and 802.3bt or PoE+ power","100 Mbps ports only","802.3af only","Only fiber ports"],a:[0],e:"Modern APs can exceed 1 Gbps and draw more power. mGig works over existing Cat5e/6 cabling."},
{id:"b119",d:2,q:"What is the role of the WLC's mobility group?",o:["Allows controllers to share client context so clients can roam between them","Groups APs by floor","Configures VLANs","Assigns IP addresses to clients"],a:[0],e:"Mobility peers exchange client info, so roaming across controllers keeps sessions and IPs."},
{id:"b120",d:2,q:"Which two are valid SD-Access fabric roles that can be combined on one device in a small site? (Choose two.)",o:["Control plane node","Border node","Catalyst Center","ISE PSN","DHCP server"],a:[0,1],e:"A co-located border and control plane node is common. Fabric in a box combines border, control plane, and edge (and optionally wireless) on one device."},
{id:"b121",d:2,q:"Why does SD-Access use an anycast gateway instead of HSRP?",o:["Every edge has the same gateway IP/MAC, so hosts can move anywhere without gateway changes or FHRP","HSRP doesn't work with IPv4","Anycast gateways are faster to configure on a single switch","To avoid IP routing"],a:[0],e:"Distributed gateways remove FHRP complexity and hairpinning through a central gateway."},
{id:"b122",d:2,q:"Which statement about a campus QoS design is correct?",o:["Classify and mark at the access edge, then queue consistently on every uplink","Only configure QoS on the WAN","Trust all endpoint markings","Use a single queue everywhere"],a:[0],e:"Congestion can happen at any oversubscribed uplink, so queuing should be consistent end to end."},
{id:"b123",d:2,q:"What is conditional trust in campus QoS?",o:["The switch trusts markings only when it detects a Cisco IP phone (via CDP/LLDP)","Trust is enabled only during business hours","The switch never trusts markings","Trust depends on the VLAN number"],a:[0],e:"trust device cisco-phone extends trust to the phone and re-marks the PC behind it."},
{id:"b124",d:2,q:"Which campus feature lets you isolate IoT devices, contractors, and employees without separate VLANs per group per closet?",o:["Group-based policy with SGTs (TrustSec/SD-Access)","Static routes","Larger subnets","STP"],a:[0],e:"Policy follows the identity of the device or user, so you don't need to multiply VLANs and ACLs everywhere."},
{id:"b125",d:2,q:"What is a common reason to use a Layer 2 access design instead of routed access today?",o:["Some applications or devices need Layer 2 adjacency across multiple access switches","Layer 2 is faster","It removes STP","It needs fewer IP addresses"],a:[0],e:"Legacy apps, certain IoT, or clustering needs can require VLANs that span closets. Overlays like SD-Access offer the same with routed underlay."},
// ---------- Domain 3 (expanded) ----------
{id:"c44",d:3,q:"Which WAN transport typically offers SLAs for latency and loss and supports QoS end to end?",o:["MPLS L3VPN","Consumer broadband internet","Public Wi-Fi","Best-effort LTE"],a:[0],e:"Carrier MPLS services usually include SLAs and honor DSCP classes. Internet links are cheaper but best effort."},
{id:"c45",d:3,q:"What is the main advantage of using internet circuits with SD-WAN instead of only MPLS?",o:["Lower cost and more bandwidth, with SD-WAN adding encryption and path selection","Guaranteed latency","No need for encryption","Provider-managed routing"],a:[0],e:"Broadband and DIA give cheap bandwidth. SD-WAN overlays add security and steer critical apps by measured performance."},
{id:"c46",d:3,q:"A branch has MPLS and broadband. Which SD-WAN design gives the best resilience?",o:["Build tunnels over both transports and use app-aware routing to steer traffic","Use only MPLS and keep broadband idle","Use only broadband","Use static routes per app"],a:[0],e:"Active/active transports with SLA-based policies keep critical apps on the best path and fail over automatically."},
{id:"c47",d:3,q:"Which LTE/5G WAN design concern is most important for a backup link?",o:["Data caps and usage-based costs, so traffic is limited to critical apps","LTE can't carry IP","LTE needs MPLS","LTE has lower latency than fiber"],a:[0],e:"Cellular links often have usage costs. SD-WAN can mark the link as last-resort and restrict which apps use it."},
{id:"c48",d:3,q:"In Catalyst SD-WAN, what does marking a circuit 'last-resort-circuit' do?",o:["Only uses it when all other transports are down","Uses it first","Disables encryption on it","Uses it for management only"],a:[0],e:"BFD runs at reduced rates and data tunnels on it are used only when no other tunnel is available."},
{id:"c49",d:3,q:"Which SD-WAN feature lets branch internet traffic go directly to the internet instead of backhauling to a data center?",o:["Direct Internet Access (DIA) with NAT and security","Hub-and-spoke control policy","TLOC extension","OMP route reflection"],a:[0],e:"DIA uses a NAT-enabled transport for local breakout, often paired with on-box firewall or cloud security like Umbrella SIG."},
{id:"c50",d:3,q:"What is a design risk of local internet breakout at branches?",o:["Each branch becomes an internet edge needing security controls","Higher latency to SaaS","Loss of SD-WAN encryption","MPLS stops working"],a:[0],e:"Security moves to the branch: use SD-WAN integrated security or SASE/SSE services so policy stays consistent."},
{id:"c51",d:3,q:"What is SASE?",o:["Combining SD-WAN with cloud-delivered security (SWG, CASB, ZTNA, FWaaS)","A routing protocol","A type of MPLS service","A Wi-Fi standard"],a:[0],e:"Secure Access Service Edge brings networking and security together as cloud services close to users."},
{id:"c52",d:3,q:"Which SD-WAN policy controls which sites form data plane tunnels with each other?",o:["Centralized control policy on vSmart (filtering TLOCs and routes)","Localized data policy","QoS policy","Application-aware routing"],a:[0],e:"By filtering which TLOCs each site learns, a control policy creates hub-and-spoke, regional mesh, or partial mesh topologies."},
{id:"c53",d:3,q:"In Catalyst SD-WAN, which policy type lets you do service chaining, for example sending traffic through a firewall at a hub?",o:["Centralized data policy or control policy service insertion","Localized QoS policy","Interface ACL only","Device template"],a:[0],e:"Service advertisements (like FW, IDS) from a hub and policy that references the service redirect matched traffic."},
{id:"c54",d:3,q:"How many vSmart controllers should a production SD-WAN design have, at minimum?",o:["At least two for redundancy","One","Exactly one per site","None if vManage is clustered"],a:[0],e:"Edges connect to multiple vSmarts. Controller counts scale with the number of edges and region design."},
{id:"c55",d:3,q:"What happens to SD-WAN data forwarding if all vSmart controllers become unreachable?",o:["Edges keep forwarding with the last known routes and keys for a graceful restart period (default 12 hours)","All traffic stops immediately","Edges fall back to MPLS only","Edges reboot"],a:[0],e:"OMP graceful restart keeps existing tunnels and routes working until timers expire or controllers return."},
{id:"c56",d:3,q:"Which SD-WAN deployment option has Cisco host the controllers?",o:["Cisco cloud-hosted controllers","On-premises controllers only","MSP-only controllers","No controllers"],a:[0],e:"Most customers use Cisco-hosted controllers. On-prem and MSP-hosted options exist for specific requirements."},
{id:"c57",d:3,q:"What does SD-WAN multi-region fabric (hierarchical SD-WAN) add?",o:["Separating regions with border routers in a core region to reduce full-mesh tunnels and scale large networks","More vManage instances per site","A new routing protocol","Replacing OMP with BGP"],a:[0],e:"Edges mesh within their region. Border routers connect regions through a core region."},
{id:"c58",d:3,q:"Which DMVPN phase uses NHRP redirects and shortcuts so spokes can build direct tunnels even when the hub summarizes routes?",o:["Phase 3","Phase 1","Phase 2","Phase 0"],a:[0],e:"Phase 3 lets the hub send summaries or defaults, and NHRP redirect/shortcut install direct routes on demand."},
{id:"c59",d:3,q:"Which routing protocol is commonly recommended over DMVPN for large scale (thousands of spokes)?",o:["BGP (often eBGP or iBGP with the hub as route reflector)","RIPv2","OSPF in one area","Static routes only"],a:[0],e:"BGP handles large numbers of peers well and gives policy control. EIGRP is also common for mid-size designs."},
{id:"c60",d:3,q:"What is a design consideration for running OSPF over DMVPN?",o:["Use point-to-multipoint (or broadcast with the hub as DR in Phase 2) and remember all spokes share one area","OSPF can't run over DMVPN","Every spoke must be DR","Use NBMA with no neighbors"],a:[0],e:"OSPF network type affects next-hop behavior. Phase 3 typically uses point-to-multipoint. All spokes in one area limits scale."},
{id:"c61",d:3,q:"What is the role of the DMVPN hub with NHRP?",o:["Next Hop Server: spokes register their tunnel-to-NBMA mappings with it","It forwards all spoke-to-spoke traffic forever","It assigns DHCP to spokes","It's the IPsec CA"],a:[0],e:"Spokes register with the NHS and query it to resolve another spoke's public address."},
{id:"c62",d:3,q:"Which two features increase DMVPN hub resiliency? (Choose two.)",o:["Dual hubs with separate clouds (dual cloud)","Dual hubs in a single cloud with spokes registering to both","A single hub with larger CPU","Disabling IPsec","Using static routes only"],a:[0,1],e:"Either design lets spokes keep tunnels to a second hub. Dual cloud gives clearer routing control."},
{id:"c63",d:3,q:"What is FlexVPN?",o:["Cisco's IKEv2-based framework for site-to-site, hub-spoke, and remote access VPNs with a unified CLI","A legacy IKEv1 VPN","An MPLS service","A DMVPN replacement using GRE without IPsec"],a:[0],e:"FlexVPN uses IKEv2, VTIs, and can use NHRP for spoke-to-spoke. It also integrates with AAA for per-peer attributes."},
{id:"c64",d:3,q:"What is the main advantage of GETVPN on a private MPLS WAN?",o:["Tunnel-less any-to-any encryption that keeps the original IP header for routing, QoS, and multicast","Works well over the internet","Builds point-to-point tunnels","Doesn't need a key server"],a:[0],e:"Group members share keys from a key server. Header preservation means the MPLS provider still routes normally."},
{id:"c65",d:3,q:"Which IPsec VPN option suits connecting an enterprise to a single cloud VPC quickly?",o:["Site-to-site IPsec VPN (often with BGP over the tunnel)","GETVPN","VPLS","Metro Ethernet E-LAN"],a:[0],e:"Cloud providers offer managed VPN gateways supporting IKEv2 and BGP."},
{id:"c66",d:3,q:"Which cloud connectivity option provides private, dedicated bandwidth to a cloud provider?",o:["AWS Direct Connect / Azure ExpressRoute","Internet IPsec VPN","LTE","Consumer broadband"],a:[0],e:"Dedicated interconnects avoid the internet and give predictable performance, often via a colocation or carrier."},
{id:"c67",d:3,q:"What is a colocation-based cloud on-ramp (carrier-neutral facility) used for in WAN design?",o:["Terminating private links to many cloud providers and SaaS close to their edges","Hosting all user PCs","Replacing MPLS completely","Providing Wi-Fi"],a:[0],e:"A regional hub in a colo can reach multiple clouds with low latency and aggregate branch traffic."},
{id:"c68",d:3,q:"In an MPLS L3VPN, which device is the provider edge router connected to the customer?",o:["PE","P","CE","RR"],a:[0],e:"CE is the customer router, PE is the provider edge with VRFs, and P routers are core label switches with no customer routes."},
{id:"c69",d:3,q:"Why do enterprises often choose eBGP as the PE-CE routing protocol?",o:["It scales, gives policy control, and is supported by all providers","It's the only option","It needs no configuration","It's faster than static routes"],a:[0],e:"eBGP gives clear separation, rich policy (communities, local preference), and handles multihoming well."},
{id:"c70",d:3,q:"An enterprise uses the same private AS at every site over an MPLS L3VPN with eBGP. What issue occurs and what fixes it?",o:["Sites drop each other's routes due to AS path loop prevention; fix with allowas-in on the CE or as-override on the PE","Routes are accepted normally","OSPF must be used instead","The provider must use a different VRF per site"],a:[0],e:"A CE sees its own AS in the path and rejects the route. as-override (PE) or allowas-in (CE) solves it."},
{id:"c71",d:3,q:"What is the 'site of origin' (SoO) extended community used for in MPLS VPN designs?",o:["Preventing routing loops at multihomed sites with backdoor links or as-override","Choosing the best PE","Encrypting routes","Setting MED"],a:[0],e:"SoO marks routes with their origin site so they aren't re-advertised back into that same site."},
{id:"c72",d:3,q:"When OSPF is used PE-CE and a site has a backdoor link, what makes the MPLS path preferred?",o:["A sham link between the PEs so the MPLS path appears as intra-area","Increasing the backdoor link cost alone","Using E2 routes","Using a stub area"],a:[0],e:"Without a sham link, routes through MPLS appear as inter-area (Type 3) and the backdoor intra-area path always wins."},
{id:"c73",d:3,q:"How many DSCP-based QoS classes do MPLS providers typically offer customers?",o:["Usually 4 to 6 classes","64","1","Over 100"],a:[0],e:"Enterprise 8 or 12-class models must be mapped into the provider's smaller set at the CE."},
{id:"c74",d:3,q:"What is a key WAN QoS design rule for the CE router?",o:["Shape to the contracted rate and queue below it, mapping enterprise classes to the provider's classes","Only police inbound","Trust the provider to queue","Use FIFO"],a:[0],e:"Without shaping, the provider polices and drops traffic randomly. Shaping makes your own queuing decide what drops."},
{id:"c75",d:3,q:"What is hierarchical QoS (HQoS) at the WAN edge?",o:["A parent shaper at the sub-rate with a child queuing policy inside it","Queuing on every hop of the provider","QoS on LAN switches only","Marking at the access layer"],a:[0],e:"The parent shaper creates backpressure so the child policy's priority and bandwidth queues work at the contracted rate."},
{id:"c76",d:3,q:"Which Metro Ethernet service is multipoint-to-multipoint like a LAN?",o:["E-LAN","E-Line","E-Tree","E-Access"],a:[0],e:"E-Line is point-to-point, E-LAN is any-to-any, E-Tree is rooted multipoint (hub-spoke), per MEF definitions."},
{id:"c77",d:3,q:"Which Metro Ethernet service lets leaves talk to a root but not to each other?",o:["E-Tree","E-LAN","E-Line","EPL"],a:[0],e:"E-Tree suits hub-and-spoke designs like franchises connecting to HQ."},
{id:"c78",d:3,q:"What is the difference between EPL and EVPL?",o:["EPL is port-based and uses the whole port; EVPL multiplexes several services on one port by VLAN","EPL is multipoint","EVPL is wireless","They are identical"],a:[0],e:"Ethernet Private Line dedicates the UNI. Ethernet Virtual Private Line uses VLANs to carry multiple EVCs."},
{id:"c79",d:3,q:"What routing behavior applies when an enterprise uses a Layer 2 VPLS service between sites?",o:["Routers at each site appear on a shared subnet and form IGP adjacencies directly","The provider runs the enterprise routing","Routing isn't possible","BGP is required"],a:[0],e:"VPLS acts like one big switch. All CE routers become neighbors, so watch scaling with many sites."},
{id:"c80",d:3,q:"What does EVPN add compared with VPLS?",o:["A BGP control plane for MAC learning, with all-active multihoming and less flooding","Encryption","Lower latency fiber","A Layer 1 service"],a:[0],e:"EVPN advertises MAC/IP routes via BGP instead of flood-and-learn, and supports active/active links."},
{id:"c81",d:3,q:"A branch with one router and one WAN circuit is which redundancy level?",o:["Single-homed, no redundancy","Dual-homed","Dual router, dual link","Fully meshed"],a:[0],e:"Options in increasing availability: single router/single link, single router/dual links, dual routers/dual links."},
{id:"c82",d:3,q:"For a branch with two routers and two WAN links, how do LAN hosts get a redundant gateway?",o:["FHRP (HSRP/VRRP/GLBP) on the LAN side, with tracking of the WAN","Each host gets two default gateways","STP","DHCP option 43"],a:[0],e:"Tracking WAN health lowers FHRP priority on the router whose WAN fails."},
{id:"c83",d:3,q:"Which branch design uses TLOC extension in Catalyst SD-WAN?",o:["Two edges each with one transport, connected so each can use the other's circuit","One edge with two circuits","A branch with no WAN","A branch with LTE only"],a:[0],e:"TLOC extension links the two edges so both can build tunnels over both transports."},
{id:"c84",d:3,q:"Which availability approach gives the fastest WAN failover?",o:["Active/active links with BFD-driven routing or SD-WAN tunnels","Manual cutover","Static routes without tracking","Waiting for BGP hold timer (180s)"],a:[0],e:"Fast detection plus already-established backup paths gives sub-second to a few seconds of failover."},
{id:"c85",d:3,q:"Why tune BGP timers or use BFD on WAN links to the ISP?",o:["The default 180-second hold time is too slow for many failover requirements","To increase table size","To change local preference","To encrypt traffic"],a:[0],e:"Lower keepalive/hold (for example 10/30) or BFD with fall-over detects failures faster."},
{id:"c86",d:3,q:"What does availability of 99.99% mean in downtime per year?",o:["About 52.6 minutes","About 5.26 minutes","About 8.76 hours","About 3.65 days"],a:[0],e:"99.9% ≈ 8.76 h, 99.99% ≈ 52.6 min, 99.999% ≈ 5.26 min per year."},
{id:"c87",d:3,q:"Two independent WAN links each have 99% availability. Roughly what is the combined availability if either one is enough?",o:["99.99%","99%","98%","99.9%"],a:[0],e:"Parallel availability = 1 - (0.01 x 0.01) = 0.9999, assuming independent failures (diverse paths)."},
{id:"c88",d:3,q:"Why is path diversity important for dual WAN circuits?",o:["Two circuits in the same conduit or from the same POP can fail together","It improves latency","It reduces cost","It's required by SD-WAN"],a:[0],e:"Shared-risk failures (one backhoe, one carrier POP) defeat redundancy. Ask for diverse entrances and carriers."},
{id:"c89",d:3,q:"In WAN design, what is the impact of high latency on TCP throughput?",o:["Throughput per flow is limited by window size divided by RTT","Throughput increases with latency","Latency has no effect on TCP","TCP stops working above 50 ms"],a:[0],e:"Bandwidth-delay product: higher RTT needs larger windows to fill the pipe. WAN optimization or window scaling helps."},
{id:"c90",d:3,q:"Which tunnel MTU problem is common in WAN overlays, and how is it handled?",o:["Encapsulation reduces usable MTU; set tunnel MTU and adjust TCP MSS","Overlays increase MTU","MTU only matters on LANs","Disable PMTUD"],a:[0],e:"IPsec plus GRE can add 70+ bytes. ip tcp adjust-mss and correct tunnel MTU avoid fragmentation and black holes."},
{id:"c91",d:3,q:"Which SD-WAN feature corrects packet loss on poor links by sending parity packets?",o:["Forward Error Correction (FEC)","OMP","TLOC color","DIA"],a:[0],e:"FEC adds redundancy to recover lost packets. Packet duplication sends copies over two transports for critical apps."},
{id:"c92",d:3,q:"In Catalyst SD-WAN, what does packet duplication do?",o:["Sends copies of critical traffic over two tunnels, and the receiver discards the extra copy","Doubles bandwidth for all traffic","Replicates routes","Duplicates the vManage database"],a:[0],e:"Useful for voice on lossy links, at the cost of extra bandwidth."},
{id:"c93",d:3,q:"Which SD-WAN component gives centralized templates so hundreds of branches get consistent configs?",o:["vManage (SD-WAN Manager) device and feature templates or configuration groups","vBond","vSmart","WAN Edge CLI only"],a:[0],e:"Templates with variables make large rollouts repeatable."},
{id:"c94",d:3,q:"What is a design consideration when SD-WAN edges are behind NAT?",o:["Symmetric NAT on both sides can prevent direct tunnels, so traffic may need to go through a hub","NAT always works with no issues","Edges can't be behind NAT","NAT disables encryption"],a:[0],e:"vBond helps with NAT traversal, but symmetric NAT at both ends can block direct edge-to-edge tunnels."},
{id:"c95",d:3,q:"Which WAN design pattern sends all branch internet traffic to a central data center for inspection?",o:["Centralized internet breakout (backhaul)","Local breakout","Cloud on-ramp","Split tunneling"],a:[0],e:"Backhaul centralizes security but adds latency and loads the hub and WAN. Many designs move to local breakout with cloud security."},
{id:"c96",d:3,q:"What does a remote access VPN with split tunneling do?",o:["Sends only corporate traffic through the tunnel; internet traffic goes directly from the user","Sends all traffic through the tunnel","Disables the tunnel","Encrypts only DNS"],a:[0],e:"Split tunneling saves VPN bandwidth. Full tunneling gives central inspection. Cloud security can protect direct traffic."},
{id:"c97",d:3,q:"Which IPsec design uses a hub-spoke topology with IKEv2 and lets spokes dynamically build tunnels via NHRP?",o:["FlexVPN spoke-to-spoke","GETVPN","Static crypto maps","L2TPv3"],a:[0],e:"FlexVPN can use NHRP similar to DMVPN Phase 3, with IKEv2 features."},
{id:"c98",d:3,q:"What is the purpose of IPsec Dead Peer Detection (DPD)?",o:["Detects a peer that stopped responding so the SA can be cleared and failover can occur","Detects duplicate IPs","Detects routing loops","Encrypts keepalives only"],a:[0],e:"Without DPD, a router keeps sending into a stale SA. DPD triggers rebuilding to an alternate peer."},
{id:"c99",d:3,q:"Which WAN service replaces legacy T1/Frame Relay at most enterprises today?",o:["Ethernet-based services (MPLS, Metro Ethernet, DIA, broadband) and SD-WAN overlays","ATM","ISDN","Dial-up"],a:[0],e:"Ethernet handoffs scale bandwidth easily. Overlays add flexibility across mixed transports."},
{id:"c100",d:3,q:"An enterprise needs to connect 500 small sites cheaply with encrypted any-to-any traffic and central management. What fits best?",o:["SD-WAN over broadband/LTE with dynamic tunnels and centralized policy","Full-mesh static IPsec tunnels","Leased lines to each site","Metro Ethernet E-Line from each site to every other site"],a:[0],e:"Static full mesh at 500 sites needs ~125,000 tunnels to configure. SD-WAN automates keys, tunnels, and policy."},
// ---------- Domain 4 (expanded) ----------
{id:"d44",d:4,q:"Which QoS model does Cisco recommend for enterprise networks?",o:["DiffServ","IntServ","Best effort only","RSVP end to end"],a:[0],e:"DiffServ marks packets into classes and applies per-hop behaviors, which scales well. IntServ reserves per flow."},
{id:"d45",d:4,q:"Which per-hop behavior is defined for EF traffic?",o:["Low delay, low jitter, low loss via priority queuing","Assured bandwidth with drop precedence","Best effort","Less than best effort"],a:[0],e:"EF (RFC 3246) is for real-time traffic in a priority queue. AF (RFC 2597) gives assured bandwidth with three drop levels."},
{id:"d46",d:4,q:"In Cisco's 12-class QoS model, which class is CS5 typically used for?",o:["Broadcast video","Voice","Network control","Scavenger"],a:[0],e:"Common mapping: EF voice, CS5 broadcast video, AF4x multimedia conferencing, CS4 real-time interactive, CS3 signaling, CS6 network control, CS1 scavenger."},
{id:"d47",d:4,q:"Which DSCP is used for multimedia streaming (on-demand video) in the 12-class model?",o:["AF31","AF41","EF","CS1"],a:[0],e:"AF3x is multimedia streaming, AF2x transactional data, AF1x bulk data. AF4x is interactive video."},
{id:"d48",d:4,q:"Which DSCP is commonly used for bulk data like backups and file transfers?",o:["AF11","AF21","EF","CS6"],a:[0],e:"Bulk data gets AF1x with modest guaranteed bandwidth. Scavenger (CS1) gets even less."},
{id:"d49",d:4,q:"Which DSCP is used for network management traffic (SNMP, SSH, syslog) in the 12-class model?",o:["CS2","CS6","EF","AF41"],a:[0],e:"CS2 is OAM. CS6 is network control (routing protocols). CS7 is reserved."},
{id:"d50",d:4,q:"In a 4-class WAN QoS model, which classes are typical?",o:["Real-time, control, critical data, best effort","Voice only, data only, video only, scavenger only","Gold, silver, bronze only","There is no 4-class model"],a:[0],e:"Smaller models collapse the 12 classes into fewer, often to match provider classes."},
{id:"d51",d:4,q:"What share of a link should best-effort traffic typically get at minimum?",o:["About 25%","1%","90%","0%"],a:[0],e:"Cisco guidance reserves around 25% for the default class so unclassified apps don't starve."},
{id:"d52",d:4,q:"Why should real-time traffic be capped at about 33% of a link in strict priority?",o:["So data apps still get enough bandwidth and latency stays predictable","Because voice codecs need exactly 33%","Because priority queues can't exceed 10%","To increase jitter"],a:[0],e:"Too much priority traffic starves other classes and turns the priority queue into FIFO for real-time traffic."},
{id:"d53",d:4,q:"Which QoS tool prevents TCP global synchronization?",o:["WRED (or DSCP-based WRED)","Strict priority queuing","Policing","Marking"],a:[0],e:"Random early drops cause different flows to back off at different times."},
{id:"d54",d:4,q:"Where is a policer most appropriate in a QoS design?",o:["At ingress to enforce a contract or limit scavenger traffic","On egress to smooth bursts","Only on voice traffic","Never"],a:[0],e:"Policers drop or remark excess immediately. Shapers on egress buffer to avoid drops at a provider policer."},
{id:"d55",d:4,q:"What is a downside of shaping?",o:["It adds delay and needs buffers, which can hurt real-time traffic if not combined with priority queuing","It drops all excess traffic","It can only run inbound","It removes markings"],a:[0],e:"Use a child LLQ policy inside the shaper so voice is prioritized within the shaped rate."},
{id:"d56",d:4,q:"What does a two-rate three-color policer (RFC 2698) use?",o:["CIR and PIR to classify traffic as conform, exceed, or violate","Only CIR","Only Bc","Hop count"],a:[0],e:"Traffic under CIR conforms, between CIR and PIR exceeds, above PIR violates."},
{id:"d57",d:4,q:"How should wireless QoS map to wired QoS for voice?",o:["Voice (EF) maps to the WMM Voice access category (UP 6)","Voice maps to Background","WMM doesn't support voice","Voice uses best effort on Wi-Fi"],a:[0],e:"WLCs translate DSCP to 802.11e user priority. A Platinum QoS profile on the WLAN allows voice priority."},
{id:"d58",d:4,q:"What is NBAR2 used for in QoS design?",o:["Recognizing applications by deep packet inspection so they can be classified even on shared ports","Routing between VRFs","Encrypting app traffic","Shaping on LAN ports only"],a:[0],e:"Many apps share TCP 443. NBAR2 identifies them by signatures for marking and reporting."},
{id:"d59",d:4,q:"What is the role of AutoQoS?",o:["Generates Cisco-recommended QoS configuration automatically for common devices like IP phones","Configures routing protocols","Disables QoS","Assigns VLANs"],a:[0],e:"AutoQoS is a quick starting point, but production designs should review and tune generated policies."},
{id:"d60",d:4,q:"Which multicast design element is needed for PIM sparse mode?",o:["A rendezvous point (RP) for each group range","IGMP snooping only","No routers","A DHCP server"],a:[0],e:"ASM sparse mode needs an RP. SSM doesn't."},
{id:"d61",d:4,q:"Which method provides fast RP redundancy without waiting for Auto-RP or BSR timers?",o:["Anycast RP with MSDP or PIM anycast RP","Static RP on one router","Dense mode","IGMPv1"],a:[0],e:"Multiple RPs share one address. The IGP sends each router to the nearest one, and failover follows IGP convergence."},
{id:"d62",d:4,q:"Which PIM mode builds only shared trees and is good for many-to-many applications?",o:["Bidirectional PIM","PIM dense mode","SSM","PIM sparse-dense mode"],a:[0],e:"BiDir-PIM avoids per-source state, so it scales when every member is both sender and receiver."},
{id:"d63",d:4,q:"What is a design benefit of SSM?",o:["No RP or MSDP needed and protection against unwanted sources","Works without IGMPv3 or SSM mapping","Supports any-source applications","Requires dense mode"],a:[0],e:"Receivers subscribe to (S,G). Hosts need IGMPv3, or routers use SSM mapping for IGMPv2 hosts."},
{id:"d64",d:4,q:"What is SSM mapping used for?",o:["Letting IGMPv2 hosts use SSM by statically or DNS-mapping groups to sources on the router","Mapping VLANs to groups","Mapping RPs to groups","Mapping DSCP to groups"],a:[0],e:"Legacy hosts send (*,G) joins. The last-hop router converts them to (S,G) joins using configured mappings."},
{id:"d65",d:4,q:"What does PIM-SM use to elect a single forwarder on a multiaccess segment when two routers could send the same traffic?",o:["PIM Assert","DR election only","IGMP querier","RPF failover"],a:[0],e:"Assert messages compare AD and metric to the source. The winner forwards and the loser prunes."},
{id:"d66",d:4,q:"What is the PIM DR's role on a receiver LAN?",o:["Sends PIM joins toward the RP or source on behalf of hosts","Answers ARP","Assigns IP addresses","Forwards all unicast traffic"],a:[0],e:"The DR (highest priority, then highest IP) handles joins on the receiver side and registers sources on the source side."},
{id:"d67",d:4,q:"Multicast traffic is dropped because it arrives on an interface that isn't the unicast path back to the source. Which check is failing?",o:["RPF check","IGMP snooping","TTL check","Assert"],a:[0],e:"If unicast and multicast topologies differ (for example over a tunnel), you may need a static mroute or MBGP to fix RPF."},
{id:"d68",d:4,q:"Which protocol shares multicast source information between PIM domains or anycast RPs?",o:["MSDP","BSR","IGMP","CGMP"],a:[0],e:"MSDP Source-Active messages tell other RPs about active sources so they can join toward them."},
{id:"d69",d:4,q:"Which campus setting prevents multicast flooding in a VLAN when no router is present?",o:["IGMP snooping with an IGMP snooping querier","PIM dense mode","Storm control","DHCP snooping"],a:[0],e:"Snooping needs queries to keep membership. Without a multicast router, enable a querier on a switch."},
{id:"d70",d:4,q:"Which multicast address scope is best for an enterprise-internal application?",o:["239.0.0.0/8 (administratively scoped)","224.0.0.0/24","232.0.0.0/8 only","Any public range"],a:[0],e:"239/8 is like private address space for multicast. You can define boundaries so groups don't leak."},
{id:"d71",d:4,q:"What does 'ip multicast boundary' do?",o:["Blocks specified multicast groups from crossing an interface, defining a scope","Enables PIM","Sets the RP","Disables IGMP"],a:[0],e:"Boundaries plus scoped addresses keep site-local multicast inside the site."},
{id:"d72",d:4,q:"Which IPv6 multicast feature lets routers learn the RP without BSR or static config?",o:["Embedded RP","SSM mapping","Auto-RP","MSDP"],a:[0],e:"The RP address is encoded in the FF7x:: group address."},
{id:"d73",d:4,q:"In a design using DHCP for many VLANs, where should DHCP servers be placed?",o:["Centralized in the data center or services block with relay agents on each SVI","On every access switch","On every user PC","On the ISP router"],a:[0],e:"Central redundant DHCP (with failover) is easier to manage. ip helper-address relays requests."},
{id:"d74",d:4,q:"How can DHCP servers be made redundant?",o:["DHCP failover pairs or split scopes across two servers, with both as helpers","Using one server with a large scope","Using static IPs everywhere","Using DNS round robin"],a:[0],e:"Failover pairs share lease state. Split scopes divide the pool (for example 80/20) across servers."},
{id:"d75",d:4,q:"What does DHCP option 82 add?",o:["Relay agent information like the switch and port the client is connected to","DNS server address","Default gateway","Lease time"],a:[0],e:"Option 82 helps with location-based address assignment and security. DHCP snooping can insert it."},
{id:"d76",d:4,q:"What is the purpose of DNS in network design beyond name resolution?",o:["Service discovery, load distribution, and controller discovery (for example for AP or PnP onboarding)","Routing packets","Assigning VLANs","Encrypting traffic"],a:[0],e:"Many systems discover controllers via DNS names like CISCO-CAPWAP-CONTROLLER and pnpserver."},
{id:"d77",d:4,q:"Which NTP design is recommended for an enterprise?",o:["A few internal NTP servers synced to reliable external sources, with devices syncing to them and NTP authentication","Every device syncing directly to public NTP","No NTP","Manually setting clocks"],a:[0],e:"Hierarchical NTP reduces external dependency. Use multiple sources so one bad clock can be outvoted."},
{id:"d78",d:4,q:"Why is NTP important for security operations?",o:["Accurate timestamps let you correlate logs, validate certificates, and investigate incidents","It encrypts logs","It blocks attacks","It speeds up authentication"],a:[0],e:"Without synced time, events from different devices can't be put in order."},
{id:"d79",d:4,q:"Which management approach separates management traffic from user traffic?",o:["Out-of-band management network or a dedicated management VRF","Using VLAN 1 for everything","Managing via the internet","Using Telnet"],a:[0],e:"OOB gives access even when the production network fails and limits exposure of management interfaces."},
{id:"d80",d:4,q:"Which SNMP design best practice improves security?",o:["Use SNMPv3 with authPriv, limit access with ACLs, and use read-only where possible","Use SNMPv1 with 'public'","Allow write access from anywhere","Disable all monitoring"],a:[0],e:"Treat SNMP like an admin interface: encrypted, authenticated, and source-restricted."},
{id:"d81",d:4,q:"Which monitoring approach scales better for high-frequency data from thousands of devices?",o:["Model-driven streaming telemetry","SNMP polling every second","Manual show commands","Syslog only"],a:[0],e:"Push-based telemetry avoids polling overhead and gives near real-time data."},
{id:"d82",d:4,q:"What is Flexible NetFlow commonly used for in design?",o:["Capacity planning, application visibility, and security analytics","Routing traffic","Assigning IPs","Wi-Fi roaming"],a:[0],e:"Flow data shows who uses bandwidth and for what, and feeds tools like Secure Network Analytics."},
